<!doctype html><html lang="en"><head>
<meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Board</title>
<style>
:root{--bg:#e3eaf1;--panel:#ffffff;--card:#fbfcfd;--line:#d6dee7;--fg:#141a21;--sub:#4a5563;--mut:#8a95a3;--edge:#b9c4d0;--urg:#c8524a;--urgbg:#fefaf9;--ok:#3f9a62;--okbg:#f1f8f3;
--k:1.15;--fName:calc(clamp(16px,1.6vw,40px)*var(--k));--fSub:calc(clamp(13px,1.2vw,30px)*var(--k));--fHead:clamp(13px,1.1vw,28px);--fAnn:clamp(14px,1.3vw,32px)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:1.2vw 1.4vw;gap:1vw}
header{display:flex;align-items:flex-end;gap:1.2vw;flex:0 0 auto}
header h1{margin:0;font-size:clamp(20px,2vw,48px);letter-spacing:.01em;font-weight:800;line-height:1}
header .sub{font-size:var(--fHead);color:var(--sub);letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:.15vw}
header .right{margin-left:auto;display:flex;gap:1.2vw;align-items:baseline;font-size:var(--fHead);color:var(--sub);font-weight:700;letter-spacing:.06em}
#snd{cursor:pointer;font-weight:600;letter-spacing:0}#snd.need{color:var(--urg)}#st.off{color:var(--urg)}
.ann{display:flex;gap:.8vw;flex:0 0 auto;min-height:0}
.ann span{font-size:var(--fAnn);font-weight:600;padding:.55vw 1.2vw;border-radius:.6vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%;color:#2d3742}
.ann .CATERING{background:#d4e3ef}.ann .SPECIAL{background:#e4e7cf}.ann .CHEF{background:#ecdbe6}
main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-flow:column;gap:1vw}
.stn{background:var(--panel);border:1px solid var(--line);border-radius:.9vw;padding:1vw 1.1vw;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.stn h2{margin:0 0 .5vw;font-size:var(--fHead);text-transform:uppercase;letter-spacing:.07em;color:#2d3742;font-weight:800;display:flex;align-items:baseline}
.stn h2 .pg{margin-left:auto;color:var(--mut);font-weight:600;letter-spacing:.04em}
.stn h2 .ub{margin-left:.6vw;color:var(--urg);font-weight:800;letter-spacing:.04em}
.stn h2 .ub+.pg{margin-left:.6vw}.stn h2 .ub{margin-left:auto}
.slots{flex:1;min-height:0;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:.45vw}
.rot{display:contents}
.c{border-left:3px solid var(--edge);padding:.15vw .9vw;display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0;transition:opacity .45s ease}
.c .n{font-weight:800;font-size:var(--fName);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .s{font-size:var(--fSub);color:var(--sub);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15vw}
.c .s .unk{color:var(--mut);font-weight:500}
.c.URGENT{border-left-color:#d98a84;background:var(--urgbg);border-radius:0 .4vw .4vw 0}.c.URGENT .u{color:var(--urg);font-weight:700}
.c.DONE{border-left-color:var(--ok);background:var(--okbg);border-radius:0 .4vw .4vw 0}
.c.DONE .n{text-decoration:line-through;text-decoration-thickness:2px;color:#5d6873}.c.DONE .s{color:var(--ok);font-weight:800;letter-spacing:.03em}
.c.DONE .ck{color:var(--ok);margin-right:.4vw;text-decoration:none;display:inline-block}
.fade{opacity:0}
.clear{color:var(--mut);font-size:var(--fSub);align-self:start;padding:.3vw .9vw}

header .sub{flex:0 0 auto}
.tk{display:none;flex:1 1 auto;min-width:0;align-self:center;align-items:center;margin:0 .4vw;background:#ecdbe6;border-radius:.6vw;overflow:hidden;height:2.2em;font-size:var(--fAnn)}
.tk.on{display:flex}.tk.urg{background:#f3d3cf}
.tk b{flex:0 0 auto;padding:0 .9vw;font-size:.7em;letter-spacing:.1em;font-weight:800;color:#6b3a5c;border-right:2px solid #d7bccd;height:100%;display:flex;align-items:center}
.tk.urg b{color:var(--urg);border-color:#e2aaa4}
.tk .win{flex:1;min-width:0;overflow:hidden;position:relative;height:100%}
.tk .txt{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;font-weight:700;color:#2d3742;will-change:transform;animation:tkgo var(--dur,20s) linear infinite}
@keyframes tkgo{from{transform:translateX(var(--w0,100vw))}to{transform:translateX(-100%)}}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,26,33,.45);z-index:50}
#pop.on{display:flex;animation:popin .35s ease}
@keyframes popin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
#pop .box{background:#fff;border:.35vw solid var(--urg);border-radius:1.2vw;padding:2.4vw 3.4vw;max-width:70vw;text-align:center;box-shadow:0 1vw 4vw rgba(0,0,0,.3)}
#pop .from{font-size:clamp(14px,1.3vw,32px);letter-spacing:.14em;font-weight:800;color:var(--urg);margin-bottom:1vw}
#pop .msg{font-size:clamp(26px,3.6vw,90px);font-weight:800;line-height:1.2;color:#141a21}
#cmp{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,26,33,.45);z-index:60}
#cmp.on{display:flex}
#cmp .box{background:#fff;border-radius:1vw;padding:1.6vw;width:min(640px,90vw);font-size:18px}
#cmp textarea{width:100%;height:110px;font:inherit;padding:10px;border:1px solid var(--edge);border-radius:8px}
#cmp .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
#cmp button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--edge);background:#f3f6f9}
#cmp button.go{background:#2d3742;color:#fff;border-color:#2d3742}
#cmp small{color:var(--mut);display:block;margin-bottom:8px}
</style></head><body>
<header><h1>KITCHEN BOARD</h1><div class="sub">Today's prep &amp; checks</div><div class="tk" id="tk"><b id="tkl">CHEF</b><div class="win"><div class="txt" id="tkt"></div></div></div><div class="right"><span id="snd" title="Tap to turn sound on"></span><span id="clk"></span><span id="st">CONNECTING</span></div></header>
<div class="ann" id="ann"></div>
<main id="m"></main>
<div id="pop"><div class="box"><div class="from">MESSAGE FROM CHEF</div><div class="msg" id="popm"></div></div></div>
<div id="cmp"><div class="box"><small>Prova (laboratorio): scrivi un messaggio per la cucina. In produzione lo scrive T.E.C.</small><textarea id="cmt" placeholder="Es. Family meal at 3:30 — Table 12 allergy: no nuts"></textarea>
<div class="row"><label><input type="checkbox" id="cmu"> Urgent (pop-up al centro)</label><button class="go" id="cms">Send</button><button id="cmx">Clear message</button><button id="cmc">Close</button></div></div></div>
<script src="motore.js"></script>
<script>
// V4 — 4 colonne × 2 stazioni, max 4 attività visibili per stazione.
// Rotazione SOLO dentro la stazione (ogni ~20 s) quando ha più di 4 attività; le URGENT e le COMPLETED (60 s) restano ferme.
{ const k = new URLSearchParams(location.search).get('scale'); if (k) document.documentElement.style.setProperty('--k', k) }   // scritte: 1 = prima, 1.15 = un gradino più grandi
const ROTATE_MS = +(new URLSearchParams(location.search).get('rotate') || 20000), SLOTS = 4
let ver = -1, es = null, data = null
const rot = {}   // per stazione: { page, nextAt }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const fmt = x => (Math.round(x * 10) / 10).toString()
function line(i) {
  if (i.tier === 'DONE') return `COMPLETED BY ${esc(i.completed.by.toUpperCase())}`
  const parts = []
  if (i.type === 'check') parts.push(/Due by (.*)/.test(i.reason) ? 'Check · by ' + esc(i.reason.match(/Due by (.*)/)[1]) : 'Check')
  else parts.push(`${fmt(i.min)} ${esc(i.unit)}` + (i.stock?.kind === 'unknown' ? ' <span class="unk">· stock unknown</span>' : ''))   // Chef 20/10: fabbisogno pieno, nota discreta (non è "quanto manca")
  if (i.tier === 'URGENT') parts.push('<span class="u">Urgent</span>')
  else if (i.tier === 'UPCOMING') parts.push(/Weekly/.test(i.reason) ? 'Tomorrow' : /Catering/.test(i.reason) ? 'Catering' : 'Plan ahead')
  else if (/Weekly/.test(i.reason)) parts.push('Weekly')
  else if (/Catering/.test(i.reason)) parts.push('Catering')
  return parts.join(' · ')
}
const card = i => i.strip
  ? `<div class="c DONE" data-id="strip"><div class="n"><span class="ck">✓</span>${i.items.map(x => esc(x.name)).join(' · ')}</div><div class="s">COMPLETED BY ${i.items.map(x => esc(x.completed.by.toUpperCase())).join(' · ')}</div></div>`
  : `<div class="c ${i.tier}" data-id="${esc(i.id)}"><div class="n">${i.tier === 'DONE' ? '<span class="ck">✓</span>' : ''}${esc(i.name)}</div><div class="s">${line(i)}</div></div>`
// divide le attività della stazione: ferme (COMPLETED + URGENT) e a rotazione (le altre)
// V5 (Chef 20/10): se COMPLETED + URGENT superano i 4 posti, niente sparisce in silenzio:
//  - le conferme in corso si raccolgono in UN posto (nomi e cuochi, stessi caratteri), ognuna resta i suoi 60 s;
//  - le URGENT occupano gli altri posti e, se sono di più, ruotano SOLO tra loro ogni 20 s;
//  - nell'intestazione della stazione compare "N URGENT" in rosso: si vede sempre quante sono;
//  - le altre attività (Today / Upcoming) aspettano che si liberi un posto.
function plan(s, list) {
  const D = list.filter(i => i.tier === 'DONE'), U = list.filter(i => i.tier === 'URGENT'), R = list.filter(i => i.tier !== 'DONE' && i.tier !== 'URGENT')
  const r = rot[s] ||= { page: 0, nextAt: 0 }
  let pinned, pool, free, overflow = false
  if (D.length + U.length <= SLOTS) { pinned = [...D, ...U]; pool = R; free = SLOTS - pinned.length }
  else { overflow = true; pinned = D.length === 1 ? D : D.length ? [{ strip: true, items: D }] : []; pool = U; free = SLOTS - pinned.length }
  const pages = free > 0 && pool.length > free ? Math.ceil(pool.length / free) : 1
  if (r.page >= pages) r.page = 0
  const shownU = overflow ? Math.min(free, U.length) : U.length
  return { pinned, shown: free > 0 ? pool.slice(r.page * free, r.page * free + free) : [], pages, page: r.page, total: list.length, urgent: U.length, urgentBadge: U.length > shownU || (overflow && pages > 1) }
}
function stationHTML(s) {
  const list = (data.stations[s] || []), p = plan(s, list)
  return `<h2>${esc(s)}${p.urgentBadge ? `<span class="ub">${p.urgent} URGENT</span>` : ''}${p.pages > 1 ? `<span class="pg">${p.page + 1}/${p.pages}</span>` : ''}</h2><div class="slots">${list.length ? p.pinned.map(card).join('') + `<div class="rot">${p.shown.map(card).join('')}</div>` : '<div class="clear">All clear</div>'}</div>`
}
function render() {
  if (!data) return
  doneWatch()
  document.getElementById('clk').textContent = new Date(data.clock).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
  document.getElementById('ann').innerHTML = data.announcements.slice(0, 3).map(a => `<span class="${a.kind}">${esc(a.text)}</span>`).join('')
  const m = document.getElementById('m')
  if (m.children.length !== data.stationOrder.length) m.innerHTML = data.stationOrder.map(s => `<section class="stn" data-s="${esc(s)}"></section>`).join('')
  data.stationOrder.forEach((s, k) => { const el = m.children[k], h = stationHTML(s); if (el.innerHTML !== h) el.innerHTML = h })
}
// rotazione: ogni stazione gira per conto suo, sfalsata, con dissolvenza solo sulle schede che cambiano
function tick() {
  if (!data) return
  const t = Date.now(), m = document.getElementById('m')
  data.stationOrder.forEach((s, k) => {
    const r = rot[s] ||= { page: 0, nextAt: 0 }; if (!r.nextAt) r.nextAt = t + ROTATE_MS + k * (ROTATE_MS / 8)
    if (t < r.nextAt) return
    r.nextAt = t + ROTATE_MS
    const p = plan(s, data.stations[s] || []); if (p.pages < 2) return
    const el = m.children[k], box = el.querySelector('.rot'); if (!box) return
    box.querySelectorAll('.c').forEach(c => c.classList.add('fade'))
    setTimeout(() => { r.page = (r.page + 1) % p.pages; const h = stationHTML(s); el.innerHTML = h; el.querySelectorAll('.rot .c').forEach(c => { c.classList.add('fade'); requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove('fade'))) }) }, 450)
  })
}
async function load() { data = await (await fetch('/api/board', { cache: 'no-store' })).json(); ver = data.version; render(); setStatus(true) }
function setStatus(on) { const e = document.getElementById('st'); e.textContent = on ? 'LIVE' : 'RECONNECTING'; e.className = on ? '' : 'off' }
function connect() {
  es && es.close(); es = new EventSource('/api/events')
  es.addEventListener('version', ev => { const v = JSON.parse(ev.data).version; if (v !== ver) load().catch(() => setStatus(false)); else setStatus(true) })
  es.onerror = () => { setStatus(false); es.close(); setTimeout(connect, 3000) }
}
setInterval(async () => { try { const v = await (await fetch('/api/version', { cache: 'no-store' })).json(); if (v.version !== ver) await load(); setStatus(true) } catch { setStatus(false) } }, 10000)
setInterval(tick, 500)
load().catch(() => setStatus(false)); connect()


// scritte lunghe: si rimpiccioliscono quel tanto che basta per stare nella riga (mai sotto l'85%), invece di tagliarsi con «…»
function fit() { document.querySelectorAll('.c .n,.c .s').forEach(e => { if (e.dataset.f || e.scrollWidth <= e.clientWidth + 1) return; e.dataset.f = 1; const f = parseFloat(getComputedStyle(e).fontSize); e.style.fontSize = Math.max(f * .85, f * e.clientWidth / e.scrollWidth * .98) + 'px' }) }
setInterval(fit, 400)
// ---- Suoni: campanella quando una preparazione viene completata; due note un po' più forti per un messaggio urgente nuovo ----
const VOL = +(new URLSearchParams(location.search).get('vol') || 1)
let actx = null, seenDone = null, soundOn = !(new URLSearchParams(location.search).get('sound') === '0')
function audio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx } catch { return null } }
function note(f, t0, dur, g) {
  const c = audio(); if (!c || !soundOn) return
  const o = c.createOscillator(), o2 = c.createOscillator(), v = c.createGain(), t = c.currentTime + t0
  o.type = 'sine'; o.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2.76   // timbro da campanella
  v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(g * VOL, t + 0.012); v.gain.exponentialRampToValueAtTime(0.0001, t + dur)
  o.connect(v); o2.connect(v); v.connect(c.destination); o.start(t); o2.start(t); o.stop(t + dur + .05); o2.stop(t + dur + .05)
}
const bellDone = () => { window.__snd = (window.__snd || 0) + 1; note(1568, 0, 0.9, 0.12) }
const bellUrgent = () => { window.__sndU = (window.__sndU || 0) + 1; note(880, 0, 0.7, 0.28); note(659, 0.28, 1.0, 0.28) }
function sndStatus() { const e = document.getElementById('snd'); const ok = soundOn && actx && actx.state === 'running'; e.textContent = !soundOn ? '' : ok ? '🔔' : '🔇 tap for sound'; e.className = ok || !soundOn ? '' : 'need' }
function unlock() { audio(); sndStatus() }
document.addEventListener('pointerdown', unlock); document.addEventListener('keydown', unlock)
document.getElementById('snd').onclick = e => { e.stopPropagation(); unlock(); bellDone() }
setInterval(sndStatus, 1500)
function doneWatch() {
  const now = new Set(); for (const s of Object.keys(data.stations || {})) for (const i of data.stations[s]) if (i.tier === 'DONE') now.add(s + '|' + i.id)
  if (seenDone) { let n = 0; now.forEach(k => { if (!seenDone.has(k)) n++ }); if (n) bellDone() }
  seenDone = now
}
// ---- Messaggi dello Chef (fascia accanto al titolo + pop-up per gli urgenti) ----
// Fonte in produzione: data.messages = [{id,text,urgent,until}] (scritti da T.E.C. dopo il "sì" di Max). In laboratorio: anche dal pannello (tocca "KITCHEN BOARD").
const POP_EVERY = (+(new URLSearchParams(location.search).get('popevery')) || 300) * 1000, POP_FOR = 10000
const LKEY = 'kb_lab_msgs'
const lget = () => { try { return JSON.parse(localStorage.getItem(LKEY) || '[]') } catch { return [] } }
const lset = v => { try { localStorage.setItem(LKEY, JSON.stringify(v)) } catch { lmem = v } }
let lmem = null, tkSig = '', popLast = {}, popHideAt = 0
const msgs = () => (((data && data.messages) || []).concat(lmem || lget())).filter(m => m && m.text && (!m.until || m.until > Date.now()))
function tkTick() {
  const ms = msgs(), tk = document.getElementById('tk'), sig = ms.map(m => m.id + m.text).join('|') + (document.querySelector('.tk .win') ? document.querySelector('.tk .win').clientWidth : 0)
  if (!ms.length) { tk.className = 'tk'; tkSig = ''; hidePop(); return }
  if (sig !== tkSig) {
    tkSig = sig; tk.className = 'tk on' + (ms.some(m => m.urgent) ? ' urg' : '')
    const t = document.getElementById('tkt'), win = tk.querySelector('.win')
    t.textContent = ms.map(m => m.text).join('      •      ')
    t.style.setProperty('--w0', win.clientWidth + 'px')
    t.style.setProperty('--dur', Math.max(12, (t.scrollWidth + win.clientWidth) / (window.innerWidth * 0.05)) + 's')
    t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''
  }
  const now = Date.now()
  for (const m of ms) if (m.urgent && (!popLast[m.id] || now - popLast[m.id] >= POP_EVERY)) { if (!popLast[m.id]) bellUrgent(); popLast[m.id] = now; showPop(m.text) }
  if (popHideAt && now > popHideAt) hidePop()
}
function showPop(t) { document.getElementById('popm').textContent = t; document.getElementById('pop').className = 'on'; popHideAt = Date.now() + POP_FOR }
function hidePop() { document.getElementById('pop').className = ''; popHideAt = 0 }
document.getElementById('pop').onclick = hidePop
document.querySelector('header h1').onclick = () => document.getElementById('cmp').className = 'on'
document.getElementById('cmc').onclick = () => document.getElementById('cmp').className = ''
document.getElementById('cmx').onclick = () => { lmem = []; lset([]); popLast = {}; document.getElementById('cmp').className = '' ; tkTick() }
document.getElementById('cms').onclick = () => {
  const t = document.getElementById('cmt').value.trim(); if (!t) return
  const v = [{ id: 'l' + Date.now(), text: t, urgent: document.getElementById('cmu').checked, until: Date.now() + 4 * 3600e3 }]
  lmem = v; lset(v); popLast = {}; document.getElementById('cmp').className = ''; document.getElementById('cmt').value = ''; tkTick()
}
{ const q = new URLSearchParams(location.search); if (q.get('msg')) { lmem = [{ id: 'q', text: q.get('msg'), urgent: q.get('urgent') === '1', until: Date.now() + 4 * 3600e3 }] } }
setInterval(tkTick, 1000); window.addEventListener('resize', () => { tkSig = '' })
</script></body></html>
