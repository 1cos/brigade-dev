/* ════════════════════════════════════════════════════════════════════════════
   TIMER PERSISTENCE LAYER
   All timer reads/writes go through these functions.
   localStorage key per step: 'boh_timer_{stepId}'
   ════════════════════════════════════════════════════════════════════════════ */
var _TIMER_PFX = 'boh_timer_';

function _timerSave(stepId, ts){
  try { localStorage.setItem(_TIMER_PFX + stepId, JSON.stringify(ts)); } catch(e){}
}
function _timerLoad(stepId){
  try {
    var raw = localStorage.getItem(_TIMER_PFX + stepId);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function _timerDelete(stepId){
  try { localStorage.removeItem(_TIMER_PFX + stepId); } catch(e){}
}

/* Reconcile a running timer against real clock — call after background/suspend */
function _timerReconcile(stepId){
  var ts = _timerLoad(stepId);
  if(!ts || ts.status !== 'running') return ts;
  var elapsed = (Date.now() - ts.started_at) / 1000;
  ts.remaining_s = Math.max(0, ts.duration_s - elapsed);
  if(ts.remaining_s <= 0){
    ts.remaining_s = 0;
    ts.status = 'done';
    _timerSave(stepId, ts);
  }
  return ts;
}

/* Return timer state for a step, reconciled */
function _ts(stepId){ return _timerReconcile(stepId); }

/* Count active timers (running or paused, not done, across all known steps) */
function _activeTimerCount(){
  var n = 0;
  RECIPE.steps.forEach(function(step){
    if(!step.timer_s) return;
    var ts = _timerLoad(step.id);
    if(ts && (ts.status==='running' || ts.status==='paused')) n++;
  });
  return n;
}

/* Most urgent running timer: lowest remaining_s */
function _urgentTimer(){
  var best = null;
  RECIPE.steps.forEach(function(step){
    if(!step.timer_s) return;
    var ts = _timerReconcile(step.id);
    if(ts && ts.status==='running'){
      if(!best || ts.remaining_s < best.remaining_s)
        best = {step:step, ts:ts};
    }
  });
  return best;
}

/* ════════════════════════════════════════════════════════════════════════════
   GLOBAL TIMER CHIP (topbar) + TAB BADGE
   ════════════════════════════════════════════════════════════════════════════ */
function _updateGlobalTimerUI(){
  /* ── Topbar chip ── */
  var chip = document.getElementById('global-timer-chip');
  var urgent = _urgentTimer();
  var activeN = _activeTimerCount();

  /* Count finished timers (done but not yet dismissed) */
  var finishedN = 0;
  RECIPE.steps.forEach(function(step){
    if(!step.timer_s) return;
    var ts = _timerLoad(step.id);
    if(ts && ts.status==='done') finishedN++;
  });
  var totalVisible = activeN + finishedN;

  if(totalVisible === 0){
    if(chip) chip.style.display = 'none';
  } else {
    if(!chip){
      var tRight = document.querySelector('.t-right');
      if(tRight){
        var el = document.createElement('div');
        el.id = 'global-timer-chip';
        el.className = 'gtimer-chip';
        tRight.insertBefore(el, tRight.firstChild);
        el.addEventListener('click', function(){ _showTimerPanel(); });
        chip = el;
      }
    }
    if(chip){
      chip.style.display = '';
      if(finishedN > 0){
        /* Highlight: show finished count prominently */
        chip.className = 'gtimer-chip has-finished';
        chip.innerHTML = '✅ <strong>'+finishedN+'</strong>' + (activeN > 0 ? ' · ⏱ '+activeN : '');
        chip.title = finishedN + ' timer finiti' + (activeN > 0 ? ' · '+activeN+' attivi' : '');
      } else if(activeN > 1){
        chip.className = 'gtimer-chip';
        chip.innerHTML = '⏱ <strong>'+activeN+'</strong>';
        chip.title = activeN + ' timer attivi';
      } else if(urgent){
        chip.className = 'gtimer-chip';
        chip.innerHTML = '⏱ <strong>'+_fmtTimer(urgent.ts.remaining_s)+'</strong>';
        chip.title = urgent.step.title;
      }
    }
  }

  /* ── Tab badge: ⏱ N on recipe workspace tab ── */
  document.querySelectorAll('.tab').forEach(function(tabEl){
    var tid = tabEl.dataset.tid;
    if(!tid) return;
    var tab = TABS.find(function(x){ return x.id===tid; });
    if(!tab || tab.type !== 'recipe') return;

    /* Remove existing badge */
    var existing = tabEl.querySelector('.tab-timer-badge');
    if(existing) existing.remove();

    if(activeN > 0){
      var badge = document.createElement('span');
      badge.className = 'tab-timer-badge';
      badge.textContent = '⏱ ' + activeN;
      /* Insert before the ✕ close button */
      var closeBtn = tabEl.querySelector('.tab-x');
      if(closeBtn) tabEl.insertBefore(badge, closeBtn);
      else tabEl.appendChild(badge);
    }
  });
}

/* Small floating panel listing all active timers */
function _showTimerPanel(){
  var existing = document.getElementById('timer-panel-overlay');
  if(existing){ existing.remove(); return; }

  var items = [];
  RECIPE.steps.forEach(function(step){
    if(!step.timer_s) return;
    var ts = _timerReconcile(step.id);
    if(ts && (ts.status==='running' || ts.status==='paused')){
      items.push({step:step, ts:ts});
    }
  });
  if(items.length === 0) return;

  var rows = items.map(function(item){
    var cls = item.ts.status==='running' ? 'running' : '';
    return '<div class="tp-row">'
      +'<span class="tp-name">'+item.step.title+'</span>'
      +'<span class="tp-time '+cls+'">'+_fmtTimer(item.ts.remaining_s)+'</span>'
      +'</div>';
  }).join('');

  var ov = document.createElement('div');
  ov.id = 'timer-panel-overlay';
  ov.innerHTML = '<div class="timer-panel">'
    +'<div class="tp-hd"><span>'+t('r_timer_panel_title')+'</span>'
      +'<span class="tp-close">✕</span></div>'
    +rows+'</div>';
  document.body.appendChild(ov);

  ov.querySelector('.tp-close').addEventListener('click', function(){ ov.remove(); });
  ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); });
}

/* ── Periodic UI refresh for topbar chip (every second when timers running) ── */
var _globalTimerInterval = null;
function _startGlobalTick(){
  if(_globalTimerInterval) return;
  _globalTimerInterval = setInterval(function(){
    var active = _activeTimerCount();
    _updateGlobalTimerUI();
    if(active === 0){
      clearInterval(_globalTimerInterval);
      _globalTimerInterval = null;
    }
  }, 1000);
}

/* ════════════════════════════════════════════════════════════════════════════
   visibilitychange: reconcile all running timers when app comes back to foreground
   ════════════════════════════════════════════════════════════════════════════ */
(function(){
  var _visBound = false;
  function _bindVisibility(){
    if(_visBound) return;
    _visBound = true;
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState !== 'visible') return;
      /* Reconcile all recipe timers from real clock */
      RECIPE.steps.forEach(function(step){
        if(!step.timer_s) return;
        var ts = _timerReconcile(step.id);
        if(!ts) return;
        /* Update display if visible */
        var dispEl = document.getElementById('tdisp-'+step.id);
        if(dispEl){
          dispEl.textContent = _fmtTimer(ts.remaining_s);
          dispEl.className = 'r-timer-display ' + (ts.status==='done'?'done':ts.status==='running'?'running':'');
        }
        /* Re-start RAF if still running */
        if(ts.status === 'running' && !_rafHandles[step.id]){
          _rafStart(step);
        }
        /* Trigger completion handler if done — idempotency inside _onTimerDone */
        if(ts.status === 'done'){
          _onTimerDone(step);
        }
      });
      _updateGlobalTimerUI();
    });
  }
  /* Call immediately and also from pageRecipeAfter */
  window._bindVisibility = _bindVisibility;
  _bindVisibility();
})();

/* ════════════════════════════════════════════════════════════════════════════
   CLOSE TAB INTERCEPT: warn if active timers
   ════════════════════════════════════════════════════════════════════════════ */
var _origCloseTab = null;
function _installCloseTabGuard(){
  if(_origCloseTab) return; /* already installed */
  _origCloseTab = closeTab;
  closeTab = function(id){
    var tab = TABS.find(function(x){ return x.id===id; });
    if(!tab || tab.type !== 'recipe'){
      return _origCloseTab(id);
    }
    var activeN = _activeTimerCount();
    if(activeN === 0) return _origCloseTab(id);

    /* Show inline confirmation */
    var existing = document.getElementById('close-guard-overlay');
    if(existing) existing.remove();

    var ov = document.createElement('div');
    ov.id = 'close-guard-overlay';
    ov.innerHTML = '<div class="close-guard-panel">'
      +'<div class="cg-title">'+t('r_close_guard_title')+'</div>'
      +'<div class="cg-body">'+t('r_close_guard_body',{n:activeN})+'</div>'
      +'<div class="cg-btns">'
        +'<button class="cg-btn cg-keep">'+t('r_close_guard_keep')+'</button>'
        +'<button class="cg-btn cg-stop">'+t('r_close_guard_stop')+'</button>'
        +'<button class="cg-btn cg-cancel">'+t('r_close_guard_cancel')+'</button>'
      +'</div></div>';
    document.body.appendChild(ov);

    ov.querySelector('.cg-keep').addEventListener('click', function(){
      ov.remove(); _origCloseTab(id);
    });
    ov.querySelector('.cg-stop').addEventListener('click', function(){
      RECIPE.steps.forEach(function(step){
        if(!step.timer_s) return;
        var ts = _timerLoad(step.id);
        if(ts && ts.status==='running'){
          var raf = _rafHandles[step.id];
          if(raf){ cancelAnimationFrame(raf); delete _rafHandles[step.id]; }
          ts.status = 'paused';
          _timerSave(step.id, ts);
        }
      });
      ov.remove(); _origCloseTab(id);
    });
    ov.querySelector('.cg-cancel').addEventListener('click', function(){ ov.remove(); });
    ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); });
  };
}

/* ════════════════════════════════════════════════════════════════════════════
   RAF TIMER ENGINE
   ════════════════════════════════════════════════════════════════════════════ */
/* ════════════════════════════════════════════════════════════════════════════
   TIMER COMPLETION — foreground handler
   Called exactly once when RAF reaches 0, and on visibilitychange if done state
   found in localStorage. Idempotency via done_notified flag in localStorage.
   ════════════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════════
   AUDIO SYSTEM — v010d2
   Key insight: AudioContext.resume() on iOS is ASYNC (returns Promise).
   Creating oscillators before the Promise resolves plays nothing — the
   context is still suspended when start() is called.
   Fix: schedule oscillators inside .then() callback.
   ══════════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════════════
   KITCHEN ALARM ENGINE — v010d3
   Design: two-beep pattern (1200 Hz), looping every ~1.1s until dismissed.
   AudioBuffer pre-built at Start tap (inside user gesture → iOS unlocked).
   Loop via setInterval — survives brief context suspension better than
   chained AudioBufferSourceNode scheduling.
   ══════════════════════════════════════════════════════════════════════ */

var _audioCtx      = null;   /* shared AudioContext, created on first Start tap */
var _audioReady    = false;  /* true once context.state === 'running'           */
var _alarmBuffer   = null;   /* pre-rendered AudioBuffer of one alarm cycle     */
var _alarmInterval = null;   /* setInterval handle for the alarm loop           */
var _alarmTimeout  = null;   /* safety stop after 60 s                         */
var _alarmActive   = false;  /* prevents double-start                           */
var _audioLog      = [];     /* diagnostic log for LAB panel                   */

function _alog(msg){
  var ts = new Date().toISOString().substr(11,12);
  _audioLog.push('['+ts+'] '+msg);
  if(_audioLog.length > 30) _audioLog.shift();
  var el = document.getElementById('lab-audio-log');
  if(el) el.textContent = _audioLog.join('\n');
}

/* ── Create / resume AudioContext (MUST be called inside user gesture) ──────
   Returns Promise<AudioContext|null>. Oscillators must only be scheduled
   inside .then() — iOS suspends the context by default and resume() is async. */
function _unlockAudio(){
  return new Promise(function(resolve){
    try {
      if(!_audioCtx){
        _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        _alog('AudioContext created, state: ' + _audioCtx.state);
      }
      if(_audioCtx.state === 'running'){
        _audioReady = true;
        resolve(_audioCtx);
        return;
      }
      _alog('resume() called, state before: ' + _audioCtx.state);
      _audioCtx.resume().then(function(){
        _audioReady = _audioCtx.state === 'running';
        _alog('resume() resolved, state: ' + _audioCtx.state);
        resolve(_audioCtx);
      }).catch(function(err){
        _alog('resume() rejected: ' + err);
        resolve(null);
      });
    } catch(err){
      _alog('AudioContext error: ' + err);
      resolve(null);
    }
  });
}

/* ── Build alarm AudioBuffer: two-beep pattern rendered offline ─────────────
   Pattern: beep(80ms) + gap(120ms) + beep(80ms) + silence(820ms) = 1100ms
   Frequency: 1200 Hz — cuts through kitchen noise.
   Gain: 0.8 — loud but not clipping.
   Called once inside user gesture (Start tap), result cached in _alarmBuffer. */
function _buildAlarmBuffer(ctx){
  if(_alarmBuffer) return _alarmBuffer;
  try {
    var sampleRate  = ctx.sampleRate;
    var cycleSecs   = 1.1;
    var bufLen      = Math.floor(sampleRate * cycleSecs);
    var buf         = ctx.createBuffer(1, bufLen, sampleRate);
    var data        = buf.getChannelData(0);
    var freq        = 1200;
    var gain        = 0.8;
    /* Beep 1: 0–80ms */
    var b1end = Math.floor(sampleRate * 0.080);
    /* Beep 2: 200ms–280ms */
    var b2start = Math.floor(sampleRate * 0.200);
    var b2end   = Math.floor(sampleRate * 0.280);

    for(var i = 0; i < bufLen; i++){
      var inBeep1 = i < b1end;
      var inBeep2 = i >= b2start && i < b2end;
      if(inBeep1 || inBeep2){
        /* Sine wave with fast attack/release envelope to avoid click */
        var phase = (2 * Math.PI * freq * i) / sampleRate;
        var env   = 1.0;
        /* 5ms attack */
        if(inBeep1){
          if(i < sampleRate * 0.005)            env = i / (sampleRate * 0.005);
          else if(i > b1end - sampleRate*0.005) env = (b1end - i) / (sampleRate * 0.005);
        }
        if(inBeep2){
          var rel = i - b2start;
          var len = b2end - b2start;
          if(rel < sampleRate * 0.005)         env = rel / (sampleRate * 0.005);
          else if(rel > len - sampleRate*0.005) env = (len - rel) / (sampleRate * 0.005);
        }
        data[i] = Math.sin(phase) * gain * env;
      }
      /* silence: data[i] already 0 */
    }
    _alarmBuffer = buf;
    _alog('AlarmBuffer built: ' + bufLen + ' samples @ ' + sampleRate + 'Hz');
    return buf;
  } catch(err){
    _alog('buildAlarmBuffer error: ' + err);
    return null;
  }
}

/* ── Play one cycle of the alarm ─────────────────────────────────────────── */
function _playOneCycle(){
  if(!_audioCtx || !_alarmBuffer){ _alog('playOneCycle: no ctx or buffer'); return; }
  if(_audioCtx.state === 'suspended'){
    _audioCtx.resume().catch(function(){});  /* best-effort re-activate */
    _alog('playOneCycle: context suspended, attempted resume');
  }
  try {
    var src = _audioCtx.createBufferSource();
    src.buffer = _alarmBuffer;
    src.connect(_audioCtx.destination);
    src.start();
    _alog('cycle played');
  } catch(err){
    _alog('playOneCycle error: ' + err);
  }
}

/* ── Start alarm loop (call from _onTimerDone) ───────────────────────────── */
function _startAlarm(){
  if(_alarmActive){ _alog('alarm already active'); return; }
  _alarmActive = true;
  _alog('alarm START');

  /* Play first cycle immediately */
  _playOneCycle();

  /* Loop every 1100ms */
  _alarmInterval = setInterval(_playOneCycle, 1100);

  /* Safety stop after 60 seconds */
  _alarmTimeout = setTimeout(function(){
    _alog('alarm auto-stop (60s timeout)');
    _stopAlarm();
  }, 60000);
}

/* ── Stop alarm loop ─────────────────────────────────────────────────────── */
function _stopAlarm(){
  if(_alarmInterval){ clearInterval(_alarmInterval); _alarmInterval = null; }
  if(_alarmTimeout){  clearTimeout(_alarmTimeout);   _alarmTimeout  = null; }
  _alarmActive = false;
  _alog('alarm STOP');
  _updateGlobalTimerUI();
}

/* ── Pre-build alarm buffer on Start tap (inside user gesture) ───────────── */
function _unlockAudioAndPreload(){
  return _unlockAudio().then(function(ctx){
    if(ctx) _buildAlarmBuffer(ctx);
    return ctx;
  });
}

/* ── Immediate test: play one cycle now (LAB "Test sound" button) ────────── */
function _labTestSound(){
  _alog('--- LAB sound test triggered ---');
  _alog('vibrate: ' + (!!navigator.vibrate));
  _alog('visibility: ' + document.visibilityState);
  _unlockAudio().then(function(ctx){
    if(ctx){
      _buildAlarmBuffer(ctx);
      _playOneCycle();
      _alog('LAB test: one cycle played');
    } else {
      _alog('LAB test: no audio context');
    }
    _updateLabDiagPanel();
  });
}

/* ── Vibrate (best-effort — Android only, silent fail on iOS) ────────────── */
function _vibrateTimer(){
  try { if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]); } catch(e){}
}


function _onTimerDone(step){
  var ts = _timerLoad(step.id);
  if(!ts) return;

  /* Idempotency: only fire once per completion */
  if(ts.done_notified) return;
  ts.done_notified = true;
  ts.status = 'done';
  ts.remaining_s = 0;
  _timerSave(step.id, ts);

  /* Refresh card state + global chip */
  _refreshCard(step);
  _updateGlobalTimerUI();

  /* Foreground: alarm loop + vibration + banner */
  _startAlarm();        /* kitchen alarm loop — runs until dismissed */
  _vibrateTimer();
  _showTimerDoneBanner(step);
  /* LAB: refresh diag panel */
  setTimeout(_updateLabDiagPanel, 900);
}

/* ── Timer-done banner: slides up from bottom, stays until dismissed ── */
function _showTimerDoneBanner(step){
  /* Remove any existing banner first */
  var existing = document.getElementById('timer-done-banner');
  if(existing) existing.remove();

  /* Count total finished timers for multi-timer message */
  var finCount = 0;
  RECIPE.steps.forEach(function(s){
    if(!s.timer_s) return;
    var ts = _timerLoad(s.id);
    if(ts && ts.status==='done') finCount++;
  });
  var subTitle = finCount > 1
    ? step.title + ' (+' + (finCount-1) + ' altri)'
    : step.title;

  var banner = document.createElement('div');
  banner.id = 'timer-done-banner';
  banner.className = 'timer-done-banner';
  banner.innerHTML =
    '<div class="tdb-inner">'
    +'<div class="tdb-top">'
      +'<span class="tdb-ico">⏰</span>'
      +'<div class="tdb-text">'
        +'<div class="tdb-title">'+t('r_timer_done_title')+'</div>'
        +'<div class="tdb-sub">'+subTitle+'</div>'
      +'</div>'
      +'<span class="tdb-close" id="tdb-close">✕</span>'
    +'</div>'
    +'<div class="tdb-btns">'
      +'<button class="tdb-btn stop-alarm" id="tdb-stop-alarm">'+t('r_timer_stop_alarm')+'</button>'
      +'<button class="tdb-btn primary" id="tdb-goto">'+t('r_timer_done_goto')+'</button>'
      +'<button class="tdb-btn" id="tdb-reset">'+t('r_timer_reset')+'</button>'
      +'<button class="tdb-btn" id="tdb-dismiss">'+t('r_timer_done_dismiss')+'</button>'
    +'</div>'
    +'</div>';
  document.body.appendChild(banner);

  function _dismiss(){ var b=document.getElementById('timer-done-banner'); if(b) b.remove(); }

  /* ✕ and Dismiss: close banner only, alarm keeps running */
  document.getElementById('tdb-close').addEventListener('click', _dismiss);
  document.getElementById('tdb-dismiss').addEventListener('click', _dismiss);

  /* Stop alarm: stop audio + close banner */
  document.getElementById('tdb-stop-alarm').addEventListener('click', function(){
    _stopAlarm(); _dismiss();
  });

  /* Vai allo step: stop alarm + navigate + close banner */
  document.getElementById('tdb-goto').addEventListener('click', function(){
    _stopAlarm(); _dismiss();
    _recipeTab = 'prep';
    _cardOpen[step.id] = true;
    var ws = document.getElementById('workspace');
    var activeTab = TABS.find(function(x){ return x.id===AID; });
    if(activeTab && activeTab.type==='recipe' && ws){
      ws.querySelectorAll('.r-tab').forEach(function(t){
        t.classList.toggle('active', t.dataset.rtab==='prep');
      });
      ws.querySelectorAll('.r-panel').forEach(function(p){ p.classList.add('r-panel-hide'); });
      var pp = ws.querySelector('#rp-prep');
      if(pp) pp.classList.remove('r-panel-hide');
      var body = ws.querySelector('#pbody-'+step.id);
      if(body) body.classList.add('open');
      setTimeout(function(){
        var card = document.getElementById('pcard-'+step.id);
        if(card) card.scrollIntoView({behavior:'smooth',block:'center'});
      }, 80);
    } else { renderAll(); }
  });

  /* Reset: stop alarm + clear timer + close banner */
  document.getElementById('tdb-reset').addEventListener('click', function(){
    _stopAlarm();
    _timerDelete(step.id);
    if(_rafHandles[step.id]){ cancelAnimationFrame(_rafHandles[step.id]); delete _rafHandles[step.id]; }
    _refreshCard(step);
    _updateGlobalTimerUI();
    _dismiss();
  });

  /* Auto-dismiss banner after 60s (alarm auto-stops separately) */
  setTimeout(function(){
    var b = document.getElementById('timer-done-banner');
    if(b) b.remove();
  }, 60000);
}

function _rafStart(step){
  if(_rafHandles[step.id]) cancelAnimationFrame(_rafHandles[step.id]);
  function tick(){
    var ts = _timerLoad(step.id);
    if(!ts || ts.status !== 'running'){ delete _rafHandles[step.id]; return; }
    var elapsed = (Date.now() - ts.started_at) / 1000;
    var remaining = Math.max(0, ts.duration_s - elapsed);

    /* Update display */
    var dispEl = document.getElementById('tdisp-'+step.id);
    if(dispEl) dispEl.textContent = _fmtTimer(remaining);

    if(remaining <= 0){
      ts.status = 'done'; ts.remaining_s = 0;
      _timerSave(step.id, ts);
      delete _rafHandles[step.id];
      _onTimerDone(step);   /* handles card refresh + banner + sound + vibration */
      return;
    }
    _rafHandles[step.id] = requestAnimationFrame(tick);
  }
  _rafHandles[step.id] = requestAnimationFrame(tick);
  _startGlobalTick();
}

/* ════════════════════════════════════════════════════════════════════════════
   UTILITY — shared with recipe rendering
   ════════════════════════════════════════════════════════════════════════════ */
function _qty(v, u, isPiece){
  if(isPiece) return Math.round(v)+' '+(u||'pz');
  if(u==='g'  && v>=1000) return (+(v/1000).toFixed(1))+' kg';
  if(u==='ml' && v>=1000) return (+(v/1000).toFixed(1))+' L';
  return (Number.isInteger(Math.round(v*10)/10)?Math.round(v):+(v).toFixed(1))+' '+u;
}
function _fmtTimer(s){
  s = Math.max(0, Math.round(s));
  var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(h>0) return h+':'+(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
  return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}
function _bomMap(){
  var map={};
  RECIPE.bom.concat(RECIPE.sub_bom).forEach(function(item){ map[item.key]=item; });
  return map;
}
function _renderProc(step, factor){
  var txt=step.proc;
  Object.keys(step.proc_vals).forEach(function(k){
    var v=step.proc_vals[k];
    var scaled = v.isDriver ? _driverQty : v.base*factor;
    var display = _qty(scaled, v.u, v.p);
    txt=txt.replace(new RegExp('\\{'+k+'\\}','g'),
      '<span class="r-proc-qty">'+display+'</span>');
  });
  return txt;
}
function _renderChips(step, factor){
  var bmap=_bomMap(), html='';
  step.bom_refs.forEach(function(k){
    var item=bmap[k]; if(!item) return;
    html+='<span class="r-chip">'+_qty(item.v*factor,item.u,item.p)+' '+item.label+'</span>';
  });
  (step.equip||[]).forEach(function(e){
    html+='<span class="r-chip equip">'+e+'</span>';
  });
  return html;
}

/* ── Timer block HTML ── */
function _timerBlock(step){
  if(!step.timer_s) return '';
  var ts = _ts(step.id);
  var remaining = ts ? ts.remaining_s : step.timer_s;
  var status = ts ? ts.status : 'idle';
  if(remaining === undefined) remaining = step.timer_s;
  var cls = status==='done'?'done':status==='running'?'running':'';
  var btn = status==='done'
    ? '<button class="r-tbtn" data-treset="'+step.id+'">'+t('r_timer_reset')+'</button>'
    : status==='running'
      ? '<button class="r-tbtn danger" data-tstop="'+step.id+'">'+t('r_timer_stop')+'</button>'
      : status==='paused'
        ? '<button class="r-tbtn primary" data-tresume="'+step.id+'" data-tsec="'+step.timer_s+'">'
            +t('r_timer_resume')+'</button>'
          +'<button class="r-tbtn" data-treset="'+step.id+'">'+t('r_timer_reset')+'</button>'
        : '<button class="r-tbtn primary" data-tstart="'+step.id+'" data-tsec="'+step.timer_s+'">'
            +t('r_timer_start')+'</button>';
  return '<div class="r-timer-block" id="tblock-'+step.id+'">'
    +'<div class="r-timer-lbl">'+t('r_timer_lbl')+'</div>'
    +'<div class="r-timer-display '+cls+'" id="tdisp-'+step.id+'">'+_fmtTimer(remaining)+'</div>'
    +'<div class="r-timer-btns">'+btn+'</div>'
    +'</div>';
}

/* ── Card render ── */
function _renderCard(step, factor){
  var ts = _ts(step.id);
  var status = ts ? ts.status : 'idle';
  var state = status==='done'?'done':status==='running'?'active':'todo';
  var chips = _renderChips(step, factor||(_driverQty/RECIPE.driver_base));
  var isOpen = !!_cardOpen[step.id];
  var badgeTxt={todo:t('r_prep_todo'),active:t('r_prep_active'),done:t('r_prep_done')};
  var num = RECIPE.steps.indexOf(step)+1;
  var labClass = step._lab ? ' _lab-step' : '';
  return '<div class="r-pcard '+state+labClass+'" id="pcard-'+step.id+'">'
    +'<div class="r-pcard-hd" data-card="'+step.id+'">'
      +'<span class="r-pcard-num">'+num+'</span>'
      +'<div class="r-pcard-main">'
        +'<div class="r-pcard-title">'+step.title+'</div>'
        +(chips?'<div class="r-pcard-chips">'+chips+'</div>':'')
      +'</div>'
      +'<span class="r-pcard-badge '+state+'">'+badgeTxt[state]+'</span>'
    +'</div>'
    +'<div class="r-pcard-body'+(isOpen?' open':'')+'" id="pbody-'+step.id+'">'
      +'<p class="r-proc-text">'+_renderProc(step, factor||(_driverQty/RECIPE.driver_base))+'</p>'
      +_timerBlock(step)
    +'</div>'
    +'</div>';
}

/* ── Refresh single card DOM ── */
function _refreshCard(step){
  var ws=document.getElementById('workspace');
  if(!ws) return;
  var fac=_driverQty/RECIPE.driver_base;
  var ts=_ts(step.id);
  var status=ts?ts.status:'idle';
  var state=status==='done'?'done':status==='running'?'active':'todo';
  var badgeTxt={todo:t('r_prep_todo'),active:t('r_prep_active'),done:t('r_prep_done')};

  var card=ws.querySelector('#pcard-'+step.id);
  if(card) card.className='r-pcard '+state;
  var badge=ws.querySelector('#pcard-'+step.id+' .r-pcard-badge');
  if(badge){ badge.className='r-pcard-badge '+state; badge.textContent=badgeTxt[state]; }

  /* Re-render timer block */
  var tblock=ws.querySelector('#tblock-'+step.id);
  if(tblock){
    var newHtml=_timerBlock(step);
    tblock.outerHTML=newHtml;
    var nb=ws.querySelector('#tblock-'+step.id);
    if(nb) _wireTimerBlock(nb,step);
  } else if(step.timer_s){
    var bodyEl=ws.querySelector('#pbody-'+step.id);
    if(bodyEl){
      var procEl=bodyEl.querySelector('.r-proc-text');
      if(procEl) procEl.insertAdjacentHTML('afterend',_timerBlock(step));
      var nb2=ws.querySelector('#tblock-'+step.id);
      if(nb2) _wireTimerBlock(nb2,step);
    }
  }
}

/* ── Live update: driver change → BOM + chips + proc ── */
function _updateLive(){
  var ws=document.getElementById('workspace');
  if(!ws) return;
  var fac=_driverQty/RECIPE.driver_base;
  RECIPE.bom.forEach(function(item){
    var el=ws.querySelector('[data-bi="'+item.key+'"]');
    if(el) el.textContent=_qty(item.v*fac,item.u,item.p);
  });
  RECIPE.sub_bom.forEach(function(item){
    var el=ws.querySelector('[data-si="'+item.key+'"]');
    if(el) el.textContent=_qty(item.v*fac,item.u,item.p);
  });
  RECIPE.steps.forEach(function(step){
    var chipsEl=ws.querySelector('#pcard-'+step.id+' .r-pcard-chips');
    if(chipsEl) chipsEl.innerHTML=_renderChips(step,fac);
    var procEl=ws.querySelector('#pbody-'+step.id+' .r-proc-text');
    if(procEl) procEl.innerHTML=_renderProc(step,fac);
  });
  var sub=ws.querySelector('#r-subtitle');
  if(sub) sub.textContent=t('r_produces',{n:_driverQty,u:RECIPE.driver_unit});
}

/* ── Wire timer block buttons ── */
function _wireTimerBlock(container, step){
  var startBtn  = container.querySelector('[data-tstart]');
  var resumeBtn = container.querySelector('[data-tresume]');
  var stopBtn   = container.querySelector('[data-tstop]');
  var resetBtn  = container.querySelector('[data-treset]');

  if(startBtn||resumeBtn){
    var btn = startBtn||resumeBtn;
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      /* iOS: unlock AudioContext AND pre-build alarm buffer in this gesture */
      _unlockAudioAndPreload();
      var ts = _timerLoad(step.id)||{};
      var remaining = (ts.remaining_s !== undefined) ? ts.remaining_s : step.timer_s;
      var newTs = {
        stepId:     step.id,
        label:      step.title,
        duration_s: step.timer_s,
        started_at: Date.now() - ((step.timer_s - remaining)*1000),
        paused_at:  null,
        remaining_s:remaining,
        status:     'running'
      };
      _timerSave(step.id, newTs);
      _rafStart(step);
      _refreshCard(step);
      _updateGlobalTimerUI();
    });
  }
  if(stopBtn){
    stopBtn.addEventListener('click', function(e){
      e.stopPropagation();
      var ts=_timerLoad(step.id)||{};
      /* Calculate current remaining before pausing */
      var elapsed=(Date.now()-ts.started_at)/1000;
      ts.remaining_s=Math.max(0,ts.duration_s-elapsed);
      ts.status='paused'; ts.paused_at=Date.now();
      _timerSave(step.id,ts);
      if(_rafHandles[step.id]){ cancelAnimationFrame(_rafHandles[step.id]); delete _rafHandles[step.id]; }
      _refreshCard(step);
      _updateGlobalTimerUI();
    });
  }
  if(resetBtn){
    resetBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if(_rafHandles[step.id]){ cancelAnimationFrame(_rafHandles[step.id]); delete _rafHandles[step.id]; }
      _timerDelete(step.id);
      _refreshCard(step);
      _updateGlobalTimerUI();
    });
  }
}

     +'<button class="diag-btn" id="diag-test-sound">▶ Test sound now</button>'
     +'<button class="diag-btn" id="diag-refresh">↻ Refresh</button>'
   +'</div>';

  /* Wire buttons */
  var soundBtn = panel.querySelector('#diag-test-sound');
  var refBtn   = panel.querySelector('#diag-refresh');
  if(soundBtn) soundBtn.addEventListener('click', function(e){
    e.stopPropagation();

  });
  if(refBtn) refBtn.addEventListener('click', function(e){
    e.stopPropagation();
    _updateLabDiagPanel();
  });
}

function pageRecipeAfter(){
  var ws=document.getElementById('workspace');
  if(!ws) return;

  /* Install close guard and visibility handler */
  _installCloseTabGuard();
  window._bindVisibility && window._bindVisibility();

  /* Driver */
  var numEl=ws.querySelector('#r-driver-num');
  var inputEl=ws.querySelector('#r-driver-input');
  function _commit(){
    var raw=parseFloat(inputEl.value);
    if(raw&&raw>0) _driverQty=Math.round(raw*10)/10;
    inputEl.style.display='none'; numEl.textContent=_driverQty; numEl.style.display='';
    _updateLive();
  }
  function _startEdit(){
    numEl.style.display='none'; inputEl.style.display='';
    inputEl.value=_driverQty; inputEl.focus(); inputEl.select();
  }
  if(numEl) numEl.addEventListener('click',_startEdit);
  if(inputEl){
    inputEl.addEventListener('input',function(){
      var raw=parseFloat(inputEl.value);
      if(raw&&raw>0){ _driverQty=Math.round(raw*10)/10; _updateLive(); }
    });
    inputEl.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); _commit(); }
      if(e.key==='Escape'){ inputEl.value=_driverQty; _commit(); }
    });
    inputEl.addEventListener('blur',_commit);
  }

  /* Tabs */
  ws.querySelectorAll('.r-tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      var key=tab.dataset.rtab;
      if(key===_recipeTab) return;
      _recipeTab=key;
      ws.querySelectorAll('.r-tab').forEach(function(t){ t.classList.toggle('active',t.dataset.rtab===key); });
      ws.querySelectorAll('.r-panel').forEach(function(p){ p.classList.add('r-panel-hide'); });
      var target=ws.querySelector('#rp-'+key);
      if(target) target.classList.remove('r-panel-hide');
    });
  });

  /* Sub-recipe toggle */
  var subToggle=ws.querySelector('#r-sub-toggle'), subBody=ws.querySelector('#r-sub-body');
  if(subToggle&&subBody){
    subToggle.addEventListener('click',function(){
      subToggle.classList.toggle('open'); subBody.classList.toggle('open');
    });
  }

  /* Card expand/collapse */
  ws.querySelectorAll('[data-card]').forEach(function(hd){
    hd.addEventListener('click',function(){
      var sid=hd.dataset.card;
      var body=ws.querySelector('#pbody-'+sid);
      if(!body) return;
      var isOpen=body.classList.contains('open');
      body.classList.toggle('open',!isOpen);
      _cardOpen[sid]=!isOpen;
    });
  });

  /* Wire timer blocks + restart any running RAF */
  RECIPE.steps.forEach(function(step){
    var tblock=ws.querySelector('#tblock-'+step.id);
    if(tblock) _wireTimerBlock(tblock,step);
    /* Reconcile and restart RAF for running timers */
    var ts=_timerReconcile(step.id);
    if(ts&&ts.status==='running'&&!_rafHandles[step.id]) _rafStart(step);
  });

  /* Update global UI */
  _updateGlobalTimerUI();
  if(_activeTimerCount()>0) _startGlobalTick();

  /* LAB: populate diagnostic panel after render */
  setTimeout(_updateLabDiagPanel, 50);
}

  var ampm=h>=12?'PM':'AM'; h=h%12||12;

  JDATA.unshift({id:Date.now(),date:'today',time:time,cat:cat,vis:vis,
    auth:RNAME[ROLE]||'Chef',sv:'',title:title,body:body});
  J_SHOW_FORM=false;
  /* re-render form + entries */
  var fw=document.getElementById('j-form-wrap'); if(fw) fw.innerHTML='';
  var el=document.getElementById('j-entries');
  if(el) el.innerHTML=jGroupedHTML(jFilteredEntries());
  showYCS('"'+title+'" '+t('fsave').toLowerCase()+'.');
}

/* YES CHEF */
function showYCS(msg){
  var ws=document.getElementById('workspace');
  var el=document.getElementById('ycs');
  if(!el){
    el=document.createElement('div'); el.id='ycs';
    el.innerHTML='<div class="yb" onclick="hideYCS()"></div>'
      +'<div class="yc">'
      +'<div class="yi">✅</div>'
      +'<h2 class="yh" id="yh"></h2>'
      +'<p class="ym" id="ym"></p>'
      +'<button class="btnp" style="margin:0 auto;display:block;min-width:180px;padding:13px" onclick="hideYCS()" id="yb"></button>'
      +'</div>';
    ws.appendChild(el);
  }
  document.getElementById('yh').textContent=t('yct');
  document.getElementById('ym').textContent=msg;
  document.getElementById('yb').textContent=t('ycclose');
  requestAnimationFrame(function(){ el.classList.add('on'); });
}
function hideYCS(){ var el=document.getElementById('ycs'); if(el) el.classList.remove('on'); }

/* ══════════════════════════════════════════════════════════════════════════
   KITCHEN PAGE v012 — Station Flow Demo
   ─────────────────────────────────────
   State model (pure in-memory, zero DB, zero fetch):

   KS = KITCHEN_STATE = {
     relay:    [ {ico, msg, time} ],   ← Chef AI relay messages, newest-last
     stations: { [id]: Station }
   }

   Station = {
     id, label, icon, owner,
     status:  'blocked'|'ready'|'in_progress'|'done'|'idle',
     missions: [ Mission ]
   }

   Mission = {
     id, text, status: 'blocked'|'ready'|'in_progress'|'done',
     blockReason: string|null,   ← why it's blocked (shown below text)
     actions: [ {id, label, cls, event} ]   ← buttons rendered when status matches
   }

   Event graph:
     EVT_FRUGE_RECEIVED  → processazione.proc1 = ready
                         → forno.forno1 = ready (unblocked)
                         → relay: "Rachel avvisata. Salmon Cakes sbloccate."
     EVT_PROC_START      → processazione.proc1 = in_progress
                         → relay: "Processazione avviata."
     EVT_PROC_COMPLETE   → processazione.proc1 = done
                         → forno.forno1 = ready (confirmed)
                         → relay: "Flusso sbloccato. Rachel può iniziare."

   Chef AI hook (future): scan KS.stations for missions with status='blocked'
   → auto-surface to relevant station owner before they notice.
   ══════════════════════════════════════════════════════════════════════════ */

/* ══ EVENT DISPATCHER ══════════════════════════════════════════════════════ */
function _kEvt(evt){
  var now = new Date();
  var hm  = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');

  if(evt==='EVT_FRUGE_RECEIVED'){
    KS.stations.ricezione.missions[0].status  = 'done';
    KS.stations.ricezione.missions[0].actions = [];
    KS.stations.ricezione.status = 'done';
    var proc1 = KS.stations.processazione.missions[0];
    proc1.status = 'ready_to_start'; proc1.blocked_by = null;
    KS.stations.processazione.status = 'ready_to_start';
    /* Chef relay — full context */
    KS.relay.push({
      who:{it:'Sous Chef',en:'Sous Chef',es:'Sous Chef'},
      to:{it:'Tela',en:'Tela',es:'Tela'},
      msg:{it:'Frugé ricevuto. Processazione sbloccata.',
           en:'Frugé received. Processing unblocked.',
           es:'Frugé recibido. Procesado desbloqueado.'},
      time:hm
    });
    /* Forno relay — only what changes Rachel's work */
    KS.relay_forno.push({
      who:{it:'Sous Chef',en:'Sous Chef',es:'Sous Chef'},
      msg:{it:'Salmone arrivato. In attesa della processazione.',
           en:'Salmon has arrived. Waiting for processing.',
           es:'El salmón llegó. Esperando procesado.'},
      time:hm
    });
  }

  else if(evt==='EVT_PROC_START'){
    var m = KS.stations.processazione.missions[0];
    m.status  = 'in_progress';
    m.actions = [{id:'act_proc_done',label:'kp_btn_complete',cls:'kp-btn-success',evt:'EVT_PROC_COMPLETE'}];
    KS.stations.processazione.status = 'in_progress';
    KS.relay.push({
      who:{it:'Sous Chef',en:'Sous Chef',es:'Sous Chef'},
      to:{it:'Tela',en:'Tela',es:'Tela'},
      msg:{it:'Processazione avviata. Il Forno viene avvisato quando è pronto.',
           en:'Processing started. Oven will be notified when ready.',
           es:'Procesado iniciado. El Horno será notificado cuando esté listo.'},
      time:hm
    });
    /* No forno relay — nothing changes for Rachel yet */
  }

  else if(evt==='EVT_PROC_COMPLETE'){
    KS.stations.processazione.missions[0].status  = 'done';
    KS.stations.processazione.missions[0].actions = [];
    KS.stations.processazione.status = 'done';
    var f1    = KS.stations.forno.missions[0];
    f1.status = 'ready_to_start'; f1.blocked_by = null;
    f1.actions = [{id:'act_forno1_start',label:'kp_btn_start',cls:'kp-btn-primary',evt:'EVT_FORNO_START'}];
    KS.stations.forno.status = 'ready_to_start';
    KS.relay.push({
      who:{it:'Sous Chef',en:'Sous Chef',es:'Sous Chef'},
      to:{it:'Rachel',en:'Forno',es:'Horno'},
      msg:{it:'Salmone processato. Forno sbloccato. Rachel può iniziare le Salmon Cakes.',
           en:'Salmon processed. Oven unblocked. Rachel can start Salmon Cakes.',
           es:'Salmón procesado. Horno desbloqueado. Rachel puede iniciar Salmon Cakes.'},
      time:hm
    });
    /* Rachel's relay — direct, personal */
    KS.relay_forno.push({
      who:{it:'Sous Chef',en:'Sous Chef',es:'Sous Chef'},
      msg:{it:'Il salmone è pronto. Puoi iniziare le Salmon Cakes.',
           en:'The salmon is ready. You can start the Salmon Cakes.',
           es:'El salmón está listo. Puedes iniciar las Salmon Cakes.'},
      time:hm
    });
  }

  else if(evt==='EVT_FORNO_START'){
    var fm = KS.stations.forno.missions[0];
    fm.status  = 'in_progress';
    fm.actions = [{id:'act_forno_done',label:'kp_btn_complete',cls:'kp-btn-success',evt:'EVT_FORNO_COMPLETE'}];
    KS.stations.forno.status = 'in_progress';
    KS.relay.push({
      who:{it:'Rachel',en:'Rachel',es:'Rachel'},
      to:null,
      msg:{it:'Salmon Cakes avviate. ~40 minuti.',
           en:'Salmon Cakes started. ~40 minutes.',
           es:'Salmon Cakes iniciadas. ~40 minutos.'},
      time:hm
    });
    KS.relay_forno.push({
      who:{it:'Sous Chef',en:'Sous Chef',es:'Sous Chef'},
      msg:{it:'Salmon Cakes in corso. ~40 minuti al forno.',
           en:'Salmon Cakes in progress. ~40 minutes in the oven.',
           es:'Salmon Cakes en curso. ~40 minutos en el horno.'},
      time:hm
    });
  }

  else if(evt==='EVT_FORNO_COMPLETE'){
    var fdm = KS.stations.forno.missions[0];
    fdm.status = 'ready_for_service'; fdm.actions = [];
    fdm.current_stock = {qty:39,unit:'pz'};
    KS.stations.forno.status = 'in_progress';
    KS.relay.push({
      who:{it:'Rachel',en:'Rachel',es:'Rachel'},
      to:null,
      msg:{it:'Salmon Cakes pronte — 39 pz in frigo.',
           en:'Salmon Cakes done — 39 pz in fridge.',
           es:'Salmon Cakes listas — 39 pz en heladera.'},
      time:hm
    });
    KS.relay_forno.push({
      who:{it:'Sous Chef',en:'Sous Chef',es:'Sous Chef'},
      msg:{it:'Salmon Cakes pronte ✓ — 39 pz in frigo. Ottimo lavoro.',
           en:'Salmon Cakes done ✓ — 39 pz in fridge. Great work.',
           es:'Salmon Cakes listas ✓ — 39 pz en heladera. Buen trabajo.'},
      time:hm
    });
  }

  else if(evt==='EVT_ROMAINE_DONE'){
    var rm = KS.stations.insalata.missions[0];
    rm.status = 'ready_for_service'; rm.actions = [];
    KS.stations.insalata.status = 'ready_for_service';
    KS.relay.push({
      who:{it:'Insalata',en:'Salad',es:'Ensalada'},
      to:null,
      msg:{it:'Romaine chopped — pronta per il servizio.',
           en:'Romaine chopped — ready for service.',
           es:'Romaine cortada — lista para el servicio.'},
      time:hm
    });
  }

  else if(evt==='EVT_OPEN_ARRABBIATA'){ openTab('recipe',{id:'arrabbiata',name:'Arrabbiata'}); return; }
  else if(evt==='EVT_OPEN_TIRAMISU'){   openTab('recipe',{id:'tiramisu',  name:'Tiramisu'}); return; }
  else if(evt==='EVT_SET_VIEW_CHEF'){    _KV = 'chef'; }
  else if(evt==='EVT_SET_VIEW_STATION'){ _KV = 'station'; }

  var ws = document.getElementById('workspace');
  if(ws) ws.innerHTML = pageKitchen();
  kitchenAfterRender();
}

    blocked:           t('kp_st_blocked'),
    ready_to_start:    t('kp_st_ready_to_start'),
    in_progress:       t('kp_st_in_progress'),
    ready_for_service: t('kp_st_ready_for_service'),
    done:              t('kp_st_done'),
    watch:             t('kp_st_watch')
  };
  return map[st]||st;
}

/* Station View labels (sous-chef language + criticality) */
function _kSVLabel(st, crit){
  if(st==='blocked')           return t('sv_lbl_blocked');
  if(st==='in_progress')       return t('sv_lbl_in_progress');
  if(st==='ready_for_service') return t('sv_lbl_rfs');
  if(st==='done')              return t('sv_lbl_done');
  if(st==='watch')             return t('sv_lbl_watch');
  if(st==='ready_to_start')    return (crit==='HIGH') ? t('sv_lbl_fai_ora') : t('sv_lbl_da_fare');
  return st;
}

/* CSS class for status dot / badge */
function _kMCls(st){
  var map={
    blocked:'ms-blocked', ready_to_start:'ms-ready',
    in_progress:'ms-in_progress', ready_for_service:'ms-rfs',
    done:'ms-done', watch:'ms-watch'
  };
  return map[st]||'ms-ready';
}

/* Criticality pill — Chef View only */
function _kCritPill(c){
  var cls={HIGH:'kp-crit-hi',MEDIUM:'kp-crit-md',LOW:'kp-crit-lo'}[c]||'kp-crit-lo';
  var lbl={
    HIGH:  {it:'Alta',  en:'High',  es:'Alta'},
    MEDIUM:{it:'Media', en:'Medium',es:'Media'},
    LOW:   {it:'Bassa', en:'Low',   es:'Baja'}
  }[c];
  return '<span class="kp-crit '+cls+'">'+(lbl?_kl(lbl):c)+'</span>';
}

/* Stock chip — Chef View only */
function _kStockChip(stock, suggested){
  if(!stock || stock.qty===null) return '';
  var s = stock.qty+' '+stock.unit;
  var sugg = (suggested && suggested.qty) ? ' → '+suggested.qty+' '+suggested.unit : '';
  return '<div class="kp-m-stock"><span class="kp-m-stock-lbl">'+t('kp_stock')+'</span>'+s+sugg+'</div>';
}

function _kVirtualBadge(s){
  if(s.station_kind!=='VIRTUAL_FLOW') return '';
  return '<span class="kp-virt-badge">'+t('kp_virtual_flow')+'</span>';
}

function _kFocusItems(){
  var items=[];
  _kOrder.forEach(function(sid){
    var s=KS.stations[sid]; if(!s) return;
    s.missions.forEach(function(m){
      if(m.status==='ready_to_start'||m.status==='in_progress') items.push({mission:m,station:s});
      else if(m.status==='blocked'&&m.operational_criticality==='HIGH') items.push({mission:m,station:s});
    });
  });
  var ord={in_progress:0,ready_to_start:1,blocked:2};
  items.sort(function(a,b){return (ord[a.mission.status]||9)-(ord[b.mission.status]||9);});
  return items;
}

function _kRenderFocus(){
  var items=_kFocusItems();
  if(items.length===0){
    return '<div class="kp-focus">'
      +'<div class="kp-focus-head"><div class="kp-focus-label">'+t('kp_focus_label')+'</div></div>'
      +'<div class="kp-focus-empty">'+t('kp_focus_empty')+'</div></div>';
  }
  var countKey=items.length===1?'kp_focus_count_one':'kp_focus_count_many';
  var html=items.slice(0,4).map(function(fi){
    var m=fi.mission, s=fi.station;
    var dotCls=m.status==='in_progress'?'fi-in_progress':m.status==='blocked'?'fi-blocked':'fi-ready';
    var actHtml='';
    if(m.actions&&m.actions.length&&m.status!=='blocked'&&m.status!=='done'){
      actHtml='<div class="kp-fitem-actions">'+m.actions.map(function(a){
        return '<button class="kp-btn '+a.cls+'" data-kevt="'+a.evt+'">'+t(a.label)+'</button>';
      }).join('')+'</div>';
    }
    var owner=m.assigned_person?' · '+m.assigned_person:'';
    return '<div class="kp-fitem">'
      +'<div class="kp-fitem-dot '+dotCls+'"></div>'
      +'<div class="kp-fitem-body">'
        +'<div class="kp-fitem-text">'+_kl(m.name)+'</div>'
        +'<div class="kp-fitem-station">'+s.icon+' '+_kl(s.label)+owner+'</div>'
        +'<div class="kp-fitem-reason">'+_kl(m.reason_today)+'</div>'
        +actHtml
      +'</div></div>';
  }).join('');
  return '<div class="kp-focus">'
    +'<div class="kp-focus-head">'
      +'<div class="kp-focus-label">'+t('kp_focus_label')+'</div>'
      +'<div class="kp-focus-count">'+t(countKey,{n:items.length})+'</div>'
    +'</div><div class="kp-focus-items">'+html+'</div></div>';
}

function _kStationRow(s){
  if(!s) return '';
  var expanded=(_kExpandedStation===s.id);
  var active=s.missions.filter(function(m){return m.status!=='done';});
  var badgeHtml=active.length>0&&s.status!=='done'
    ? '<span class="kp-sbadge sb-'+s.status+'">'+active.length+'</span>' : '';

  var missionsHtml=s.missions.map(function(m){
    var mstLbl=_kMLabel(m.status);
    var mstCls=_kMCls(m.status);
    var reasonHtml=(m.status!=='done')
      ? '<div class="kp-m-reason'+(m.status==='blocked'?' kp-m-reason-warn':' kp-m-reason-soft')+'">'+_kl(m.reason_today)+'</div>'
      : '';
    var batchHtml=(m.status!=='done'&&m.preferred_batch&&m.preferred_batch.qty)
      ? '<div class="kp-m-batch">'+t('kp_batch')+': '+m.preferred_batch.qty+' '+m.preferred_batch.unit+'</div>' : '';
    var stockHtml=_kStockChip(m.current_stock, m.status==='done'?null:m.suggested_qty);
    var metaHtml=_kCritPill(m.operational_criticality);
    if(m.estimated_duration) metaHtml+='<span class="kp-m-dur">~'+m.estimated_duration+' min</span>';
    var actHtml='';
    if(m.actions&&m.actions.length&&m.status!=='blocked'&&m.status!=='done'){
      actHtml='<div class="kp-m-actions">'+m.actions.map(function(a){
        return '<button class="kp-btn '+a.cls+'" data-kevt="'+a.evt+'">'+t(a.label)+'</button>';
      }).join('')+'</div>';
    }
    return '<div class="kp-mission">'
      +'<div class="kp-m-head"><div class="kp-m-status '+mstCls+'">'+mstLbl+'</div>'+metaHtml+'</div>'
      +'<div class="kp-m-body">'
        +'<div class="kp-m-text'+(m.status==='done'?' ms-done-txt':'')+'">'+_kl(m.name)+'</div>'
        +reasonHtml+batchHtml+stockHtml+actHtml
      +'</div></div>';
  }).join('');

  var ownerLbl=s.owner||t('kp_owner_tbd');
  return '<div class="kp-srow ks-'+s.status+(expanded?' kp-expanded':'')+'\" data-ksrow="'+s.id+'">'
    +'<div class="kp-srow-head">'
      +'<div class="kp-srow-ico">'+s.icon+'</div>'
      +'<div class="kp-srow-info">'
        +'<div class="kp-srow-name">'+_kl(s.label)+_kVirtualBadge(s)+'</div>'
        +'<div class="kp-srow-owner">'+ownerLbl+'</div>'
      +'</div>'
      +'<div class="kp-srow-right">'+badgeHtml+'<span class="kp-srow-chev">▾</span></div>'
    +'</div>'
    +'<div class="kp-srow-missions">'+missionsHtml+'</div>'
    +'</div>';
}

function _kRenderRelay(){
  var msgs=KS.relay;
  var chipSub=msgs.length>0?t('kp_relay_chip_n',{n:msgs.length}):t('kp_relay_chip_0');
  var badgeHtml=msgs.length>0?'<span class="kp-relay-chip-badge">'+msgs.length+'</span>':'';
  var logHtml='';
  if(_kRelayOpen){
    var inner=msgs.length===0
      ? '<div class="kp-relay-empty">'+t('kp_relay_empty')+'</div>'
      : msgs.slice().reverse().map(function(m){
          var toStr=m.to?(' → '+_kl(m.to)):'';
          return '<div class="kp-rmsg">'
            +'<div class="kp-rmsg-who">'+_kl(m.who)+toStr+'</div>'
            +'<div class="kp-rmsg-body">'
              +'<div class="kp-rmsg-text">'+_kl(m.msg)+'</div>'
              +'<div class="kp-rmsg-time">'+m.time+'</div>'
            +'</div></div>';
        }).join('');
    logHtml='<div class="kp-relay-log" id="kp-relay-log">'+inner+'</div>';
  }
  return '<div class="kp-relay-chip'+(_kRelayOpen?' kp-relay-open':'')+'\" id="kp-relay-chip">'
    +'<span class="kp-relay-chip-ico">🤖</span>'
    +'<span class="kp-relay-chip-label">'+t('kp_relay_title')+' · '+chipSub+'</span>'
    +badgeHtml+'<span class="kp-relay-chip-chev">▾</span>'
    +'</div>'+logHtml;
}

/* ══ STATION VIEW ══════════════════════════════════════════════════════════ */

function _kRenderStation(){
  var s=KS.stations[_KV_STATION];
  if(!s) return '<div class="pi"><p>Station not found.</p></div>';

  var msgs=KS['relay_'+_KV_STATION]||[];

  /* "Messaggi per te" — only shown when non-empty */
  var relayHtml='';
  if(msgs.length>0){
    var msgItems=msgs.slice().reverse().map(function(m){
      return '<div class="sv-relay-msg">'
        +'<div class="sv-relay-who">'+_kl(m.who)+' · '+m.time+'</div>'
        +'<div class="sv-relay-text">'+_kl(m.msg)+'</div>'
        +'</div>';
    }).join('');
    relayHtml='<div class="sv-relay">'
      +'<div class="sv-relay-title">'+t('sv_msgs_title')+'</div>'
      +msgItems
      +'</div>';
  }

  /* Mission cards */
  var missionsHtml=s.missions.map(function(m){
    var lbl    = _kSVLabel(m.status, m.operational_criticality);
    var lblCls = _kMCls(m.status)+(m.status==='ready_to_start'&&m.operational_criticality==='HIGH'?' sv-lbl-urgent':'');

    /* qty + duration line — shown for ready_to_start and in_progress */
    var detailHtml='';
    if(m.status!=='done' && m.status!=='ready_for_service' && m.status!=='blocked'){
      var parts=[];
      if(m.preferred_batch&&m.preferred_batch.qty)
        parts.push(t('kp_make')+' '+m.preferred_batch.qty+' '+m.preferred_batch.unit);
      if(m.estimated_duration)
        parts.push(m.estimated_duration+' min');
      if(parts.length) detailHtml='<div class="sv-m-detail">'+parts.join(' · ')+'</div>';
    }

    /* reason: show only when blocked */
    var reasonHtml=(m.status==='blocked')
      ? '<div class="sv-m-block-reason">'+_kl(m.sous_chef_msg)+'</div>' : '';

    /* action — never when blocked */
    var actHtml='';
    if(m.actions&&m.actions.length&&m.status!=='blocked'&&m.status!=='done'){
      actHtml='<div class="sv-m-action">'+m.actions.map(function(a){
        return '<button class="kp-btn sv-btn '+a.cls+'" data-kevt="'+a.evt+'">'+t(a.label)+'</button>';
      }).join('')+'</div>';
    }

    var cardCls='sv-mission'
      +(m.status==='blocked'           ?' sv-m-blocked':'')
      +(m.status==='done'              ?' sv-m-done':'')
      +(m.status==='ready_for_service' ?' sv-m-rfs':'')
      +(m.status==='ready_to_start'&&m.operational_criticality==='HIGH'?' sv-m-urgent':'');

    return '<div class="'+cardCls+'">'
      +'<div class="sv-m-head">'
        +'<div class="sv-m-name'+(m.status==='done'?' sv-m-done-txt':'')+'">'+_kl(m.name)+'</div>'
        +'<div class="sv-lbl '+lblCls+'">'+lbl+'</div>'
      +'</div>'
      +detailHtml+reasonHtml+actHtml
      +'</div>';
  }).join('');

  var ownerLbl=s.owner||t('kp_owner_tbd');
  var phase=_kPhrase();

  return '<div class="sv-wrap">'
    +'<div class="sv-header">'
      +'<div class="sv-station-ico">'+s.icon+'</div>'
      +'<div class="sv-station-info">'
        +'<div class="sv-station-name">'+_kl(s.label)+'</div>'
        +'<div class="sv-station-meta">'+ownerLbl+' · '+phase+'</div>'
      +'</div>'
    +'</div>'
    +relayHtml
    +'<div class="sv-missions">'+missionsHtml+'</div>'
    +'</div>';
}

function _kPhrase(){
  var h=new Date().getHours();
  return h<12?t('kp_phase_morning'):h<16?t('kp_phase_lunch'):t('kp_phase_evening');
}

/* ══ PAGE RENDER ═══════════════════════════════════════════════════════════ */
function pageKitchen(){
  if(!KS){ KS=_kitchenInitState(); _kExpandedStation=null; _kRelayOpen=false; }

  if(_KV==='station'){
    return '<div class="pi kp-wrap">'+_kRenderToggle()+_kRenderStation()+'</div>';
  }

  var stationsHtml=_kOrder.map(function(id){ return _kStationRow(KS.stations[id]); }).join('');
  return '<div class="pi kp-wrap">'
    +_kRenderToggle()
    +'<div class="kp-header">'
      +'<div class="kp-title">'+t('kp_title')+'</div>'
      +'<div class="kp-sub">'+t('kp_sub')+'</div>'
    +'</div>'
    +_kRenderFocus()
    +'<div class="kp-sec-lbl">'+t('kp_sec_stations')+'</div>'
    +'<div class="kp-accordion" id="kp-accordion">'+stationsHtml+'</div>'
    +_kRenderRelay()
    +'</div>';
}

function kitchenAfterRender(){
  var ws=document.getElementById('workspace');
  if(!ws) return;
  ws.querySelectorAll('[data-ksrow]').forEach(function(row){
    var head=row.querySelector('.kp-srow-head');
    if(!head) return;
    head.addEventListener('click',function(e){
      if(e.target.closest('.kp-btn,.kp-vt-btn')) return;
      var sid=row.dataset.ksrow;
      _kExpandedStation=(_kExpandedStation===sid)?null:sid;
      var ws2=document.getElementById('workspace');
      if(ws2) ws2.innerHTML=pageKitchen();
      kitchenAfterRender();
    });
  });
  var chip=document.getElementById('kp-relay-chip');
  if(chip){
    chip.addEventListener('click',function(){
      _kRelayOpen=!_kRelayOpen;
      var ws2=document.getElementById('workspace');
      if(ws2) ws2.innerHTML=pageKitchen();
      kitchenAfterRender();
    });
  }
  ws.querySelectorAll('[data-kevt]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var evt=btn.dataset.kevt;
      if(evt) _kEvt(evt);
    });
  });
}

  return '<div class="pg-card">'

/* ── New-tab quick-menu ─────────────────────────────────────────────────────
   Shows a small floating menu anchored to the + button.
   Lists pages that are NOT already open as a singleton tab.
   If all pages are already open → activates Home.                           */
function _showNewTabMenu(){
  /* remove any existing menu */
  var old = document.getElementById('ntm-menu');
  if(old){
    var oldBd = document.getElementById('ntm-backdrop');
    if(oldBd) oldBd.remove();
    old.remove();
    return;
  }

  var candidates = [
    {type:'bot_center',   label:t('tb'),       ico:'🤖', p:{}},
    {type:'daily_journal',label:t('tj_short'), ico:'📓', p:{}},
    {type:'pos',          label:t('tp'),        ico:'📊', p:{}},
    {type:'kitchen',      label:t('tk'),        ico:'👨‍🍳', p:{}},
    {type:'prep_gallery', label:t('tpg'),       ico:'🗂️', p:{}},
  ].filter(function(c){
    /* v015: only show modules allowed in current MODE, and not already open */
    return modeAllows(c.type) && !TABS.find(function(x){ return x.type===c.type; });
  });

  if(candidates.length===0){
    /* everything is open — just go to Home */
    var homeTab = TABS.find(function(x){ return x.type==='home'; });
    if(homeTab) activateTab(homeTab.id); else openTab('home',{});
    return;
  }

  var btn = document.getElementById('tab-plus');
  if(!btn) return;
  var rect = btn.getBoundingClientRect();

  var menu = document.createElement('div');
  menu.id = 'ntm-menu';
  menu.style.cssText = [
    'position:fixed',
    'left:'+(rect.left)+'px',
    'top:'+(rect.bottom+4)+'px',
    'background:var(--surf)',
    'border:1px solid var(--bd2)',
    'border-radius:var(--r2)',
    'box-shadow:var(--sh2)',
    'z-index:9000',
    'min-width:180px',
    'padding:6px 0',
    'overflow:hidden'
  ].join(';');

  candidates.forEach(function(c){
    var item = document.createElement('button');
    item.style.cssText = [
      'display:flex','align-items:center','gap:10px',
      'width:100%','padding:10px 16px',
      'background:none','border:none',
      'font:15px/1.3 inherit','color:var(--tx)',
      'cursor:pointer','text-align:left',
      '-webkit-tap-highlight-color:transparent'
    ].join(';');
    item.innerHTML = '<span style="font-size:18px">'+c.ico+'</span><span>'+c.label+'</span>';
    item.addEventListener('mouseenter',function(){ item.style.background='var(--bg)'; });
    item.addEventListener('mouseleave',function(){ item.style.background='none'; });
    item.addEventListener('click', function(e){
      e.stopPropagation();
      var bd = document.getElementById('ntm-backdrop');
      if(bd) bd.remove();
      menu.remove();
      openTab(c.type, c.p);
    });
    menu.appendChild(item);
  });

  /* invisible backdrop — cattura tap su tutto il resto della pagina, iOS incluso */
  var backdrop = document.createElement('div');
  backdrop.id = 'ntm-backdrop';
  backdrop.style.cssText = 'position:fixed;inset:0;z-index:8999;-webkit-tap-highlight-color:transparent';
  backdrop.addEventListener('pointerdown', function(e){
    e.preventDefault();
    backdrop.remove();
    menu.remove();
  });
  /* inserisci backdrop PRIMA del menu, così il menu sta sopra */
  document.body.insertBefore(backdrop, document.body.firstChild);
  document.body.appendChild(menu);
}

function renderTabBar(){
  var inner = TABS.map(function(tab){
    var on = tab.id===AID;
    return '<div class="tab'+(on?' on':'')+'" data-tid="'+tab.id+'" role="tab" aria-selected="'+(on?'true':'false')+'">'
      +'<span class="tab-ico">'+(ICO[tab.type]||'📄')+'</span>'
      +'<span class="tab-lbl">'+tab.title+'</span>'
      +(tab.type!=='home'
        ? '<button class="tab-x" data-close="'+tab.id+'" title="Chiudi">✕</button>'
        : '')
      +'</div>';
  }).join('');
  inner += '<button class="tab-plus" id="tab-plus" title="'+t('tnew')+'">+</button>';

  var tbEl=document.getElementById('tabbar');
  tbEl.innerHTML='<div class="tb-inner" id="tb-inner">'+inner+'</div>';

  /* Wire via event delegation — avoids onclick= attribute encoding issues */
  document.getElementById('tb-inner').addEventListener('click', function(e){
    /* close button */
    var closeBtn=e.target.closest('[data-close]');
    if(closeBtn){ e.stopPropagation(); closeTab(closeBtn.dataset.close); return; }
    /* new tab */
    if(e.target.closest('#tab-plus')){ _showNewTabMenu(); return; }
    /* activate tab */
    var tabEl=e.target.closest('[data-tid]');
    if(tabEl) activateTab(tabEl.dataset.tid);
  });

  /* scroll active into view */
  requestAnimationFrame(function(){
    var el=document.querySelector('.tab.on');
    if(el) el.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'});
  });
}

function renderWorkspace(){
  /* guard: if AID is stale or null but tabs exist, recover */
  if((!AID || !TABS.find(function(x){ return x.id===AID; })) && TABS.length>0){
    AID = TABS[0].id;
    _persist();
  }
  var tab=TABS.find(function(x){ return x.id===AID; });
  var ws=document.getElementById('workspace');
  if(!tab){ ws.innerHTML='<div style="padding:60px;text-align:center;color:var(--txm)">—</div>'; return; }

  /* v015 MODE GUARD — tab exists but not available in current mode */
  if(tab.type !== 'home' && !modeAllows(tab.type)){
    ws.innerHTML = pageUnavailable(tab.type, tab.title);
    ws.scrollTop = 0;
    return;
  }

  var page=PAGES[tab.type];
  ws.innerHTML = page ? page.render(tab.params||{}) : '<p style="padding:40px;color:var(--txm)">Pagina non trovata.</p>';
  /* restore scroll */
  ws.scrollTop = tab.scroll || 0;
  /* save scroll on scroll */
  ws.onscroll = function(){
    var cur=TABS.find(function(x){ return x.id===AID; });
    if(cur) cur.scroll=ws.scrollTop;
  };
  /* after-render hooks */
  if(page && page.after) page.after();
  /* dev validator */
  setTimeout(function(){ validatePage(tab.type); }, 200);
}

function renderAll(){
  renderTopBar();
  renderModeBar();
  renderTabBar();
  renderWorkspace();
}

      +sugs.map(function(s){return '<button class="sug">'+s.trim()+'</button>';}).join('')
      +'</div>';
    body.insertAdjacentHTML('beforeend', sugHTML);
    body.querySelectorAll('.sug').forEach(function(b){
      b.addEventListener('click',function(){
        caiSend(b.textContent.trim());
        b.closest('.cai-suggestions')?.remove();
      });
    });
  }
  /* wire close */
  document.getElementById('cai-close-btn').onclick=closeChefAI;
  document.getElementById('cai-backdrop').onclick=closeChefAI;
  /* wire send */
  var inp=document.getElementById('cai-input');
  var snd=document.getElementById('cai-send-btn');
  if(inp){
    inp.placeholder=t('cai_placeholder');
    inp.onkeydown=function(e){
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();caiSendFromInput();}
    };
  }
  if(snd) snd.onclick=caiSendFromInput;
  /* focus input */
  setTimeout(function(){ document.getElementById('cai-input')?.focus(); }, 300);
}

function closeChefAI(){
  CAI_OPEN=false;
  document.getElementById('cai-overlay').classList.remove('open');
  var btn=document.getElementById('cai-topbar-btn');
  if(btn) btn.classList.remove('active');
}

function caiAddMsg(role, text){
  var body=document.getElementById('cai-body');
  if(!body) return;
  CAI_HISTORY.push({role:role,text:text});
  var isAI=(role==='ai');
  var html='<div class="cai-msg'+(isAI?'':' usr')+'">'
    +(isAI?'<div class="cai-msg-av">🤖</div>':'')
    +'<div class="cai-bubble">'+text.replace(/\n/g,'<br>')+'</div>'
    +(isAI?'':'<div class="cai-msg-av" style="background:var(--b6)">'+RINIT[ROLE]+'</div>')
    +'</div>';
  body.insertAdjacentHTML('beforeend', html);
  body.scrollTop=body.scrollHeight;
}

function caiSendFromInput(){
  var inp=document.getElementById('cai-input');
  if(!inp) return;
  var msg=(inp.value||'').trim();
  if(!msg) return;
  inp.value='';
  caiSend(msg);
}

/* Demo responses — no real AI in prototype */
var CAI_DEMO_REPLIES = null;
function caiGetDemoReply(q){
  if(!CAI_DEMO_REPLIES){
    CAI_DEMO_REPLIES = [
      t('cai_r1'), t('cai_r2'), t('cai_r3'), t('cai_r4')
    ];
  }
  /* simple keyword matching */
  q=q.toLowerCase();
  if(q.indexOf('bot')>=0||q.indexOf('pipeline')>=0) return t('cai_r_bots');
  if(q.indexOf('journal')>=0||q.indexOf('diario')>=0) return t('cai_r_journal');
  if(q.indexOf('tiramisu')>=0||q.indexOf('ricett')>=0||q.indexOf('recipe')>=0) return t('cai_r_recipe');
  if(q.indexOf('caesar')>=0||q.indexOf('dispensa')>=0||q.indexOf('pantry')>=0) return t('cai_r_inv');
  /* default cycle */
  var i=CAI_HISTORY.filter(function(m){return m.role==='user';}).length;
  return CAI_DEMO_REPLIES[i % CAI_DEMO_REPLIES.length];
}

function caiSend(msg){
  caiAddMsg('user', msg);
  /* typing indicator */
  var body=document.getElementById('cai-body');
  var typing=document.createElement('div');
  typing.className='cai-msg'; typing.id='cai-typing';
  typing.innerHTML='<div class="cai-msg-av">🤖</div>'
    +'<div class="cai-bubble" style="opacity:.6">'+t('cai_thinking')+'</div>';
  body.appendChild(typing); body.scrollTop=body.scrollHeight;
  /* simulate response */
  setTimeout(function(){
    typing.remove();
    caiAddMsg('ai', caiGetDemoReply(msg));
  }, 900 + Math.random()*600);
}


/* ══ PAGE STANDARD VALIDATOR (dev only — harmless in prod) ══════════════════
   Runs in console after each renderWorkspace().
   Reports: missing i18n keys, hardcoded labels, missing context.
   ════════════════════════════════════════════════════════════════════════ */
function validatePage(type){
  var issues=[];
  var ws=document.getElementById('workspace');
  if(!ws) return;

  /* 1. Check for hardcoded text in visible elements (heuristic) */
  var textEls=ws.querySelectorAll('h1,h2,h3,h4,p,button,label,span,option');
  var suspectPatterns=[
    /^[A-Z][a-z]+ [a-z]+ [a-z]+$/, /* English sentence fragments */
    /Tiramisu|Caesar|Hardie/,        /* data is OK, UI labels should be t() */
  ];
  /* We skip data-derived text by only checking elements with no data-cat, data-tid etc */
  /* This is a lightweight heuristic, not exhaustive */

  /* 2. Check caiContext covers this page type */
  var knownCtx=['home','bot_center','recipe','inventory','daily_journal','pos'];
  if(type && knownCtx.indexOf(type)<0){
    issues.push('⚠️  Page type "'+type+'" not registered in caiContext() — add it');
  }

  /* 3. Check TR keys exist in all 3 langs for this page's namespace */
  var ns=type?type.replace('_',''):null;
  if(ns && ns!=='home'){
    var langs=['it','en','es'];
    var missing=[];
    langs.forEach(function(l){
      if(!TR[l]) missing.push(l);
    });
    if(missing.length) issues.push('⚠️  TR missing language blocks: '+missing.join(', '));
  }

  /* 4. Check no inline styles with hardcoded colors in the rendered HTML */
  var html=ws.innerHTML;
  var hexInStyle=html.match(/style="[^"]*#[0-9a-f]{3,6}/gi);
  if(hexInStyle && hexInStyle.length>3){ /* allow a few for dynamic avatar colors */
    issues.push('⚠️  Possible hardcoded hex colors in rendered HTML ('+hexInStyle.length+' found) — use var(--token)');
  }

  /* 5. Check no onclick= attributes on newly rendered elements */
  var onclickEls=ws.querySelectorAll('[onclick]');
  if(onclickEls.length>0){
    issues.push('❌ VIOLATION: '+onclickEls.length+' element(s) with onclick= attribute — use addEventListener');
  }

  /* 6. Check responsive: at least one element with responsive class or section */
  /* (heuristic — just check pi wrapper exists) */
  if(!ws.querySelector('.pi')){
    issues.push('⚠️  Page does not use .pi wrapper — may not be responsive');
  }

  if(issues.length===0){
    console.log('%c✅ Brigade Page Standard — '+type+' — all checks passed','color:#16a34a;font-weight:700');
  } else {
    console.group('%c🔍 Brigade Page Standard — '+type+' — '+issues.length+' issue(s)','color:#d97706;font-weight:700');
    issues.forEach(function(i){ console.warn(i); });
    console.log('Reference: workspace/WORKSPACE_PAGE_STANDARD.md');
    console.groupEnd();
  }
}


/* ══ GLOBAL SEARCH ════════════════════════════════════════════════════════ */
var _searchIdx = null;

function buildSearchIndex(){
  return [
    {tabType:'bot_center',    params:{},
     ico:'🤖', title:t('tb'),   sub:t('bsub'),
     kw:['bot','pipeline','deduction','bots','centro bot','bot center','modifier','consolidator']},
    {tabType:'daily_journal', params:{},
     ico:'📓', title:t('jtit'), sub:t('jsub'),
     kw:['journal','diario','log','diario operativo','operations journal','maintenance','servizio','service']},
    {tabType:'recipe',        params:{id:'tiramisu',name:'Tiramisu'},
     ico:'📋', title:t('tr',{n:'Tiramisu'}), sub:'Pastry · 10 pz',
     kw:['tiramisu','dessert','pastry','mascarpone','ricetta','recipe','receta','savoiardi']},
    {tabType:'inventory',     params:{id:'caesar',name:'Caesar Dressing'},
     ico:'📦', title:t('ti',{n:'Caesar Dressing'}), sub:'Stock: 2.4 kg · 312 uses/60gg',
     kw:['caesar','dressing','dispensa','pantry','despensa','salad','insalata']},
    {tabType:'pos',           params:{},
     ico:'📊', title:t('tp')||'Vendite', sub:t('bsub')||'Sales dashboard · modifier depletion',
     kw:['vendite','sales','pos','revenue','dashboard','modifier','depletion','modifiers','modifer','cassa','incasso']},
  ];
}

function scoreResult(entry, q){
  q = q.toLowerCase().trim();
  var score = 0;
  entry.kw.forEach(function(k){
    k = k.toLowerCase();
    if(k === q)          score += 100;
    else if(k.startsWith(q)) score += 60;
    else if(k.indexOf(q) >= 0) score += 30;
  });
  var title = entry.title.toLowerCase();
  if(title === q)          score += 80;
  else if(title.startsWith(q)) score += 50;
  else if(title.indexOf(q) >= 0) score += 20;
  return score;
}

function wireSearch(){
  var wrap  = document.getElementById('t-search-wrap');
  var input = document.getElementById('t-search-input');
  var clear = document.getElementById('t-search-clear');
  var drop  = document.getElementById('search-drop');
  if(!wrap || !input || !drop) return;

  _searchIdx = null; /* rebuild on lang change */

  input.addEventListener('focus', function(){ wrap.classList.add('focused'); });

  input.addEventListener('blur', function(){
    setTimeout(function(){ wrap.classList.remove('focused'); hideDrop(); }, 200);
  });

  input.addEventListener('input', function(){
    var q = input.value.trim();
    clear.classList.toggle('vis', q.length > 0);
    if(!q){ hideDrop(); return; }
    showDrop(q);
  });

  input.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      input.value = ''; clear.classList.remove('vis');
      hideDrop(); input.blur();
    }
    if(e.key === 'Enter'){
      var first = drop.querySelector('.search-result');
      if(first) first.click();
    }
  });

  clear.addEventListener('mousedown', function(e){ e.preventDefault(); });
  clear.addEventListener('click', function(){
    input.value = ''; clear.classList.remove('vis'); hideDrop(); input.focus();
  });
}

function showDrop(q){
  if(!_searchIdx) _searchIdx = buildSearchIndex();
  var drop = document.getElementById('search-drop');
  if(!drop) return;

  var seen = {};
  var results = _searchIdx
    .map(function(e){ return {e:e, s:scoreResult(e,q)}; })
    .filter(function(r){ return r.s > 0; })
    .sort(function(a,b){ return b.s - a.s; })
    .filter(function(r){
      var key = r.e.tabType + ':' + (r.e.params.id || '');
      if(seen[key]) return false; seen[key] = true; return true;
    })
    .slice(0, 5);

  if(!results.length){
    drop.innerHTML = '<div class="search-empty">'+t('srch_noResults',{q:q})+'</div>';
    drop.classList.remove('hi'); return;
  }

  drop.innerHTML = results.map(function(r){
    var e = r.e;
    var ps = encodeURIComponent(JSON.stringify(e.params));
    return '<div class="search-result" data-tt="'+e.tabType+'" data-ps="'+ps+'">'
      +'<span class="sr-ico">'+e.ico+'</span>'
      +'<div class="sr-body">'
      +'<div class="sr-title">'+e.title+'</div>'
      +'<div class="sr-sub">'+e.sub+'</div>'
      +'</div>'
      +'<span class="sr-action">'+t('srch_open')+' →</span>'
      +'</div>';
  }).join('');

  drop.querySelectorAll('.search-result').forEach(function(el){
    el.addEventListener('mousedown', function(e){ e.preventDefault(); });
    el.addEventListener('click', function(){
      var tt = el.dataset.tt;
      var ps = JSON.parse(decodeURIComponent(el.dataset.ps||'{}'));
      var inp = document.getElementById('t-search-input');
      if(inp){ inp.value=''; document.getElementById('t-search-clear')?.classList.remove('vis'); }
      hideDrop();
      openTab(tt, ps);
    });
  });

  drop.classList.remove('hi');
}

function hideDrop(){
  var drop = document.getElementById('search-drop');
  if(drop) drop.classList.add('hi');
}

document.addEventListener('DOMContentLoaded', function(){
  LANG = sessionStorage.getItem('ws_lang') || 'it';

});
