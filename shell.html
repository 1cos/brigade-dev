<style>
:root{
  --bg:#eff6ff;--bg2:#dbeafe;--bg3:#e0f2fe;

  --ok:#16a34a;--ok-bg:#f0fdf4;--ok-bd:#bbf7d0;
  --wn:#d97706;--wn-bg:#fffbeb;--wn-bd:#fde68a;

}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--ff);font-size:15px;color:var(--tx);
  background:var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit;

#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  background:linear-gradient(148deg,var(--bg) 0%,var(--bg2) 58%,var(--bg3) 100%);

/* ── TOPBAR ─────────────────────────────────────────────────────────────── */
#topbar{

.t-mark{

#cai-overlay.open{pointer-events:all}
.cai-backdrop{
  position:absolute;inset:0;
  background:rgba(30,58,95,.18);
  opacity:0;transition:opacity .22s;cursor:pointer
}
#cai-overlay.open .cai-backdrop{opacity:1}
.cai-drawer{
  position:relative;width:340px;max-width:90vw;height:100%;
  background:rgba(248,252,255,.97);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border-left:1px solid var(--bd2);
  box-shadow:var(--sh3);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .26s cubic-bezier(.34,1.3,.64,1)
}
#cai-overlay.open .cai-drawer{transform:translateX(0)}
.cai-head{
  display:flex;align-items:center;gap:10px;
  padding:16px 18px;border-bottom:1px solid var(--bd);flex-shrink:0
}
.cai-head-av{
  width:36px;height:36px;border-radius:50%;
  background:var(--b6);display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;box-shadow:0 2px 8px rgba(37,99,235,.3)
}
.cai-head-info{flex:1;min-width:0}
.cai-head-name{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:1px}
.cai-head-ctx{
  font-size:11px;color:var(--txm);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.cai-close{
  width:28px;height:28px;border-radius:50%;
  background:var(--bg2);color:var(--txm);font-size:12px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .12s;flex-shrink:0
}
.cai-close:hover{background:var(--er-bg);color:var(--er)}
.cai-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.cai-status-card{
  background:var(--surf-g);border:1px solid var(--b2);
  border-radius:var(--r2);padding:13px 15px
}
.cai-st-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cai-st-dot{
  width:8px;height:8px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px rgba(22,163,74,.2);flex-shrink:0
}
.cai-st-lbl{font-size:13px;font-weight:600;color:var(--tx)}
.cai-st-sub{font-size:12px;color:var(--txm);line-height:1.5}
.cai-msg{display:flex;gap:8px;align-items:flex-start}
.cai-msg-av{
  width:26px;height:26px;border-radius:50%;
  background:var(--b6);display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;margin-top:2px
}
.cai-bubble{
  background:var(--surf);border:1px solid var(--bd);
  border-radius:0 var(--r2) var(--r2) var(--r2);
  padding:10px 13px;font-size:13px;color:var(--tx);
  line-height:1.55;max-width:calc(100% - 38px)
}
.cai-msg.usr{flex-direction:row-reverse}
.cai-msg.usr .cai-bubble{
  background:var(--b6);color:#fff;
  border-radius:var(--r2) 0 var(--r2) var(--r2);border-color:var(--b7)
}
.cai-foot{
  padding:12px 14px;border-top:1px solid var(--bd);flex-shrink:0;
  display:flex;gap:7px;align-items:flex-end
}
.cai-input{
  flex:1;background:var(--bg);border:1px solid var(--bd2);
  border-radius:var(--r2);padding:9px 11px;
  font-size:13px;color:var(--tx);outline:none;resize:none;
  max-height:100px;overflow-y:auto;
  transition:border-color .13s,box-shadow .13s;font-family:var(--ff)
}
.cai-input:focus{border-color:var(--b5);box-shadow:0 0 0 3px rgba(59,130,246,.13)}
.cai-send{
  width:38px;height:38px;border-radius:var(--r2);
  background:var(--b6);color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .12s;flex-shrink:0
}
.cai-send:hover{background:var(--b7);transform:scale(1.05)}
.cai-send:active{transform:scale(.97)}
.cai-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.sug{
  font-size:11px;padding:5px 11px;border-radius:var(--rp);
  border:1px solid var(--b2);background:var(--b0);color:var(--b6);
  cursor:pointer;transition:all .12s;font-weight:500
}
.sug:hover{background:var(--b1);border-color:var(--b4)}

/* ══════════════════════════════════════════════════════════════
   MOBILE OVERRIDES  ≤ 640px
   Goal: [B] Brigade | Search | 🤖 | MZ
   ══════════════════════════════════════════════════════════════ */
@media(max-width:640px){
  /* Topbar padding tighter */
  #topbar{gap:6px;padding:0 10px}

  /* Brand: hide word + subtitle, keep only B mark */
  .t-sub{display:none}
  .t-name{display:none}
  .t-words{display:none}
  .t-brand{gap:0}

  /* Search: narrower pill, flex shrinks */
  .t-search{max-width:none;flex:1;min-width:0;padding:6px 10px;font-size:12px}

  /* Chef AI: icon-only — .cai-text already hidden by .cai-text CSS below */
  .chef-ai-btn{padding:5px 7px}

  /* Online: hide desktop pills, show compact badge */
  .online-pills{display:none}
  .online-n{display:flex}

  /* Demo badge: hide on mobile (footer note is enough) */
  .demo-tag{display:none}

  /* User name: hide text on narrow screens, keep avatar */
  .usr-name{display:none}
  .usr-arr{display:none}
  .usr-btn{padding:3px 3px}

  /* CAI drawer: bottom sheet on mobile */
  #cai-overlay{align-items:flex-end;justify-content:center}
  .cai-drawer{
    width:100%;max-width:100%;
    /* 65% height — half-ish, feels like assistant not full page */
    height:65dvh;
    border-left:none;border-top:1px solid var(--bd2);
    border-radius:var(--r3) var(--r3) 0 0;
    transform:translateY(100%)
  }
  #cai-overlay.open .cai-drawer{transform:translateY(0)}
}

/* cai-text hidden on <640px: already in chef-ai-btn rule, make explicit */
@media(max-width:640px){
  .cai-text{display:none}
}

/* ══ Tablet 641-900px: show online pills, hide demo ══ */
@media(min-width:641px) and (max-width:900px){
  .demo-tag{display:none}
  .t-sub{display:none}
  .online-n{display:none}
}

/* ══ Desktop 901px+: full topbar ══ */
@media(min-width:901px){
  .online-n{display:none}   /* show pills instead */
  .online-pills{display:flex}
}

/* ── END TOPBAR CSS ──────────────────────────────────────────── */
/* ── TAB BAR ─────────────────────────────────────────────────────────────── */
#tabbar{
  flex-shrink:0;height:var(--tbh);
  background:rgba(235,244,255,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bd);
  overflow:hidden;position:relative
}
/* fade right edge so + button has clean space */
#tabbar::after{
  content:'';position:absolute;right:44px;top:0;bottom:0;
  width:28px;background:linear-gradient(to right,transparent,rgba(235,244,255,.9));
  pointer-events:none;z-index:1
}
.tb-inner{
  display:flex;align-items:stretch;height:100%;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;padding:0 4px;gap:2px
}
.tb-inner::-webkit-scrollbar{display:none}

/* individual tab */
.tab{
  display:flex;align-items:center;gap:5px;
  padding:0 11px;min-width:90px;max-width:195px;
  height:100%;flex-shrink:0;
  color:var(--tx2);font-size:13px;
  cursor:pointer;user-select:none;
  border-bottom:2px solid transparent;
  border-radius:var(--r1) var(--r1) 0 0;
  transition:background .13s,color .13s,border-color .13s;
  position:relative;
  -webkit-tap-highlight-color:transparent
}
.tab:hover{background:rgba(255,255,255,.5);color:var(--tx)}
.tab:active{background:rgba(255,255,255,.7)}

/* ACTIVE TAB — more glass, stronger signal */
.tab.on{
  background:rgba(255,255,255,.96);
  color:var(--b9);font-weight:600;
  border-bottom-color:var(--b6);
  box-shadow:
    0 -2px 12px rgba(37,99,235,.08),
    0 1px 0 0 rgba(255,255,255,.95),
    inset 0 1px 0 rgba(255,255,255,1);
  z-index:2
}
.tab-ico{font-size:14px;flex-shrink:0;opacity:.8}
.tab.on .tab-ico{opacity:1}
.tab-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tab-x{
  /* Larger touch target — minimum 28px, visual 18px icon centered */
  flex-shrink:0;width:28px;height:28px;
  border-radius:50%;font-size:10px;
  color:var(--txm);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:all .13s;margin-left:1px;
  -webkit-tap-highlight-color:transparent
}
.tab:hover .tab-x,.tab.on .tab-x{opacity:.65}
.tab-x:hover{opacity:1!important;background:var(--er-bg);color:var(--er)}
/* On mobile: always show close X on active tab (no hover state) */
@media(max-width:640px){
  .tab.on .tab-x{opacity:.55}
  .tab-x:active{opacity:1!important;background:var(--er-bg);color:var(--er)}
}
.tab-plus{
  flex-shrink:0;width:42px;height:100%;
  font-size:21px;font-weight:300;color:var(--txm);
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--r1);
  transition:all .13s;z-index:2;position:relative;
  -webkit-tap-highlight-color:transparent
}
.tab-plus:hover{color:var(--b6);background:rgba(255,255,255,.6)}
.tab-plus:active{color:var(--b6);background:rgba(255,255,255,.8)}

.r-driver{
  background:var(--surf-g);backdrop-filter:blur(10px);
  border:1.5px solid var(--bd2);border-radius:var(--r3);
  padding:20px 22px 16px;margin-bottom:16px}
.r-driver-lbl{
  font-size:11px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.r-driver-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.r-driver-num{
  font-size:44px;font-weight:800;color:var(--tx);
  font-family:var(--fm);line-height:1;cursor:pointer;
  border-bottom:2px dashed transparent;transition:border-color .15s;
  -webkit-tap-highlight-color:transparent}
.r-driver-num:hover,.r-driver-num:active{border-bottom-color:var(--bd2)}
.r-driver-input{
  font-size:44px;font-weight:800;color:var(--b6);
  font-family:var(--fm);line-height:1;
  width:3ch;min-width:60px;max-width:180px;
  border:none;border-bottom:2px solid var(--b6);
  background:transparent;outline:none;padding:0;
  -webkit-appearance:none;appearance:none;
  -moz-appearance:textfield}
.r-driver-input::-webkit-inner-spin-button,
.r-driver-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.r-driver-unit{font-size:22px;font-weight:600;color:var(--tx2)}

/* ── Meta strip ── */
.r-meta{
  display:flex;gap:0;flex-wrap:wrap;
  border:1px solid var(--bd);border-radius:var(--r2);
  overflow:hidden;margin-bottom:16px}
.r-meta-item{
  flex:1;min-width:110px;
  padding:10px 16px;border-right:1px solid var(--bd)}
.r-meta-item:last-child{border-right:none}
.r-meta-lbl{font-size:10px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.r-meta-val{font-size:14px;font-weight:600;color:var(--tx)}

/* ── Tab bar (3 tabs: Ingredienti | Prep | Storico) ── */
.r-tabs{
  display:flex;gap:0;border-bottom:1px solid var(--bd);
  margin-bottom:18px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.r-tabs::-webkit-scrollbar{display:none}
.r-tab{
  padding:10px 18px;font-size:14px;font-weight:600;color:var(--tx2);
  border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
  transition:color .15s,border-color .15s;
  -webkit-tap-highlight-color:transparent;
  min-height:44px;display:flex;align-items:center}
.r-tab.active{color:var(--b6);border-bottom-color:var(--b6)}
.r-tab:hover:not(.active){color:var(--tx)}
@media(max-width:480px){.r-tab{padding:10px 13px;font-size:13px}}

/* ── Ingredienti tab: BOM ── */
.r-bom{display:flex;flex-direction:column}
.r-brow{
  display:grid;grid-template-columns:1fr auto;gap:14px;
  padding:11px 2px;border-bottom:1px solid var(--bd);align-items:center}
.r-brow:last-child{border-bottom:none}
.r-bitem{font-size:15px;color:var(--tx)}
.r-bqty{font-size:15px;font-weight:700;font-family:var(--fm);
  color:var(--b6);white-space:nowrap}
.r-sub-toggle{
  display:flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--tx2);
  cursor:pointer;padding:12px 2px;border-top:1px solid var(--bd);
  -webkit-tap-highlight-color:transparent}
.r-sub-toggle svg{transition:transform .2s;flex-shrink:0}
.r-sub-toggle.open svg{transform:rotate(90deg)}
.r-sub-body{display:none}
.r-sub-body.open{display:block}

/* ── Prep tab: operational step cards ── */
.r-prep-list{display:flex;flex-direction:column;gap:10px}

/* Card shell */
.r-pcard{
  background:var(--surf-g);backdrop-filter:blur(8px);
  border:1px solid var(--bd);border-radius:var(--r2);
  overflow:hidden;transition:border-color .2s}
.r-pcard.active{border-color:var(--b6)}
.r-pcard.done{opacity:.65}

/* Card header — always visible */
.r-pcard-hd{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.r-pcard-num{
  width:26px;height:26px;border-radius:50%;
  background:var(--b6);color:#fff;
  font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center}
.r-pcard.done .r-pcard-num{background:var(--txm)}
.r-pcard-main{flex:1;min-width:0}
.r-pcard-title{font-size:15px;font-weight:700;color:var(--tx);
  margin-bottom:5px;line-height:1.3}
/* Inline ingredient chips in header */
.r-pcard-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.r-chip{
  padding:3px 9px;border-radius:20px;
  font-size:12px;font-weight:600;font-family:var(--fm);
  background:rgba(37,99,235,.09);color:var(--b6);
  white-space:nowrap}
.r-chip.equip{background:rgba(100,116,139,.09);color:var(--txm)}
/* Status badge */
.r-pcard-badge{
  padding:4px 10px;border-radius:20px;
  font-size:11px;font-weight:700;flex-shrink:0;
  align-self:flex-start;margin-top:1px}
.r-pcard-badge.todo{background:rgba(37,99,235,.10);color:var(--b6)}
.r-pcard-badge.active{background:rgba(22,163,74,.12);color:var(--ok)}
.r-pcard-badge.done{background:rgba(100,116,139,.10);color:var(--txm)}

/* Card body — expands on tap */
.r-pcard-body{
  display:none;
  border-top:1px solid var(--bd);
  padding:14px 16px 16px}
.r-pcard-body.open{display:block}

/* Procedure text inside body */
.r-proc-text{
  font-size:14px;line-height:1.7;color:var(--tx);
  margin-bottom:14px}
.r-proc-qty{font-weight:700;color:var(--b6);font-family:var(--fm)}

/* Timer inside body */
.r-timer-block{
  padding:12px 14px;
  background:rgba(37,99,235,.05);
  border:1px solid var(--bd);border-radius:12px}
.r-timer-lbl{
  font-size:10px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.r-timer-display{
  font-size:34px;font-weight:800;font-family:var(--fm);
  color:var(--tx);letter-spacing:.02em;margin-bottom:10px;line-height:1}
.r-timer-display.running{color:var(--ok)}
.r-timer-display.done{color:var(--txm)}
.r-timer-btns{display:flex;gap:8px;flex-wrap:wrap}
.r-tbtn{
  padding:9px 20px;border-radius:20px;
  font-size:13px;font-weight:700;
  border:1.5px solid var(--bd2);color:var(--tx2);background:var(--surf);
  cursor:pointer;transition:all .15s;
  -webkit-tap-highlight-color:transparent;min-height:42px}
.r-tbtn.primary{background:var(--b6);border-color:var(--b6);color:#fff}
.r-tbtn.danger{border-color:var(--er);color:var(--er)}

/* ── Storico v011a — Recipe as living memory ── */
.r-hist{padding:4px 0 32px}
.r-hist-empty{
  padding:40px 16px;text-align:center;
  color:var(--txm);font-size:14px;line-height:1.6}
.r-hist-empty-ico{font-size:30px;margin-bottom:12px}
/* section label */
.r-hsec{
  font-size:11px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.06em;
  padding:0 2px 10px;margin-top:4px}
/* entry card */
.r-hentry{
  border:1px solid var(--bd);border-radius:var(--r2);
  overflow:hidden;margin-bottom:12px;background:var(--surf)}
.r-hentry.rh-great{border-left:3px solid #22c55e}
.r-hentry.rh-problem{border-left:3px solid #f97316}
.r-hentry.rh-note{border-left:3px solid var(--b6)}
/* header row: date + person */
.r-hhead{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px 9px;
  border-bottom:1px solid var(--bd)}
.r-hdate{font-size:13px;font-weight:700;color:var(--tx);flex:1}
.r-hperson{
  font-size:12px;font-weight:600;color:var(--b6);
  background:rgba(37,99,235,.09);border-radius:10px;
  padding:3px 9px}
/* stat row */
.r-hstats{display:flex;flex-wrap:wrap;gap:0}
.r-hstat{
  flex:1;min-width:80px;
  padding:9px 14px;border-right:1px solid var(--bd)}
.r-hstat:last-child{border-right:none}
.r-hstats.rh-has-below{border-bottom:1px solid var(--bd)}
.r-hstat-lbl{
  font-size:10px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.r-hstat-val{font-size:15px;font-weight:700;color:var(--tx)}
.r-hstat-val.rh-zero{color:var(--txm);font-weight:500}
.r-hstat-val.rh-warn{color:#ea580c}
/* observation block */
.r-hobs{padding:11px 14px;border-bottom:1px solid var(--bd)}
.r-hobs:last-child{border-bottom:none}
.r-hobs-lbl{
  display:flex;align-items:center;gap:5px;
  font-size:10px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.r-hobs-txt{font-size:14px;color:var(--tx);line-height:1.5;font-weight:500}
/* decision block */
.r-hdec{padding:11px 14px;border-bottom:1px solid var(--bd)}
.r-hdec:last-child{border-bottom:none}
.r-hdec-lbl{
  display:flex;align-items:center;gap:5px;
  font-size:10px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.r-hdec-txt{font-size:14px;color:var(--tx);line-height:1.5;font-weight:500}
/* decision status row */
.r-hstatus{
  display:flex;align-items:flex-start;gap:7px;
  padding:9px 14px;font-size:12px;font-weight:600}
.r-hstatus.rh-pending{color:#92400e;background:rgba(251,191,36,.10)}
.r-hstatus.rh-approved{color:#15803d;background:rgba(34,197,94,.08)}
.r-hstatus.rh-rejected{color:#b91c1c;background:rgba(239,68,68,.07)}
.rh-status-ico{font-size:14px;flex-shrink:0;margin-top:1px}
.r-hstatus-body{flex:1;line-height:1.4}
.r-hstatus-sub{
  font-size:11px;font-weight:400;opacity:.75;margin-top:2px}

/* ══ KITCHEN PAGE v014 ═════════════════════════════════════════════════════ */
.kp-wrap{padding:0 0 40px}
/* page header */
.kp-header{padding:16px 0 10px}
.kp-title{font-size:22px;font-weight:800;color:var(--tx);margin-bottom:2px}
.kp-sub{font-size:13px;color:var(--txm);line-height:1.4}

/* ── 1. Focus layer ── */
.kp-focus{
  border:1px solid var(--bd);border-radius:var(--r2);
  background:var(--surf);overflow:hidden;margin-bottom:16px}
.kp-focus-head{
  padding:11px 14px 9px;border-bottom:1px solid var(--bd)}
.kp-focus-label{
  font-size:10px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.06em}
.kp-focus-count{
  font-size:14px;font-weight:700;color:var(--tx);margin-top:2px}
.kp-focus-items{padding:10px 14px 12px;display:flex;flex-direction:column;gap:10px}
.kp-fitem{display:flex;align-items:flex-start;gap:10px}
.kp-fitem-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.kp-fitem-dot.fi-ready{background:#22c55e}
.kp-fitem-dot.fi-in_progress{background:#2563eb}
.kp-fitem-dot.fi-unblocked{background:#f97316}
.kp-fitem-body{flex:1}
.kp-fitem-text{font-size:14px;font-weight:600;color:var(--tx);line-height:1.35}
.kp-fitem-station{font-size:11px;color:var(--txm);margin-top:2px}
.kp-fitem-actions{margin-top:6px;display:flex;gap:7px}
/* no focus items */
.kp-focus-empty{padding:14px;font-size:13px;color:var(--txm)}

/* ── 2. Station accordion ── */
.kp-sec-lbl{
  font-size:10px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.06em;
  padding:0 2px 8px;margin-top:4px}
.kp-accordion{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
/* station row — collapsed (default) */
.kp-srow{
  border:1px solid var(--bd);border-radius:var(--r2);
  background:var(--surf);overflow:hidden;cursor:pointer}
/* idle stations: muted */
.kp-srow.ks-idle{opacity:.55}
/* left accent only on non-idle */
.kp-srow.ks-blocked{border-left:3px solid #f97316}
.kp-srow.ks-ready{border-left:3px solid #22c55e}
.kp-srow.ks-in_progress{border-left:3px solid #2563eb}
.kp-srow.ks-done{border-left:3px solid var(--txm)}
/* v013a — new status CSS aliases */
.kp-srow.ks-ready_to_start{border-left:3px solid #22c55e}
.kp-srow.ks-ready_for_service{border-left:3px solid #22c55e}
.kp-srow.ks-watch{border-left:3px solid #d97706}
.kp-sbadge.sb-ready_to_start{background:#22c55e;color:#fff}
.kp-sbadge.sb-ready_for_service{background:#22c55e;color:#fff}
.kp-sbadge.sb-in_progress{background:#2563eb;color:#fff}
.kp-sbadge.sb-watch{background:#d97706;color:#fff}

/* ══ KITCHEN v013 — mission detail CSS ══════════════════════════════════════ */
.kp-virt-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txm);border:1px solid var(--bd);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;opacity:.75}
.kp-m-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.kp-crit{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 6px}
.kp-crit-hi{background:#fee2e2;color:#b91c1c}
.kp-crit-md{background:#fef3c7;color:#92400e}
.kp-crit-lo{background:#f0fdf4;color:#166534}
.kp-m-dur{font-size:11px;color:var(--txm);margin-left:2px}
.kp-m-reason{font-size:12px;color:#d97706;margin-top:4px;line-height:1.4}
.kp-m-reason-soft{color:var(--txm);font-size:12px;margin-top:4px;line-height:1.4}
.kp-m-batch{font-size:11px;color:#2563eb;font-weight:600;margin-top:3px}
.kp-m-stock{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:11px;color:var(--txm)}
.kp-m-stock-lbl{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:9px}
.kp-fitem-dot.fi-blocked{background:#f97316}
.kp-fitem-reason{font-size:11px;color:var(--txm);margin-top:2px;line-height:1.35}
/* ══ KITCHEN v013a — Station View CSS ═══════════════════════════════════════ */

/* View toggle */
.kp-view-toggle{
  display:flex;gap:6px;padding:12px 0 4px;
}
.kp-vt-btn{
  flex:1;padding:9px 12px;border-radius:var(--r1);border:1.5px solid var(--bd);
  background:var(--surf);color:var(--txm);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.kp-vt-btn.kp-vt-active{
  background:var(--b6,#2563eb);border-color:var(--b6,#2563eb);color:#fff;
}

/* Station View header */
.sv-wrap{padding-bottom:48px}
.sv-header{
  display:flex;align-items:center;gap:14px;
  padding:16px 0 12px;border-bottom:1px solid var(--bd);margin-bottom:14px;
}
.sv-station-ico{font-size:32px;line-height:1}
.sv-station-name{font-size:20px;font-weight:800;color:var(--tx);line-height:1.2}
.sv-station-owner{font-size:13px;color:var(--txm);margin-top:2px}

/* Incoming relay for station */
.sv-relay{
  background:var(--bg2,#dbeafe);border-radius:var(--r1);
  padding:10px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;
}
.sv-relay-msg{display:flex;align-items:flex-start;gap:10px}
.sv-relay-ico{font-size:16px;flex-shrink:0;margin-top:1px}
.sv-relay-body{flex:1}
.sv-relay-text{font-size:13px;color:var(--tx);line-height:1.4;font-weight:500}
.sv-relay-time{font-size:10px;color:var(--txm);margin-top:2px}

/* Mission cards — Station View */
.sv-missions{display:flex;flex-direction:column;gap:10px}
.sv-mission{
  border:1px solid var(--bd);border-radius:var(--r2);
  background:var(--surf);padding:14px 16px;
}
.sv-m-blocked{border-left:3px solid #f97316;opacity:.85}
.sv-m-done{opacity:.4}
.sv-m-rfs{border-left:3px solid #22c55e}

.sv-m-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;margin-bottom:6px;
}
.sv-m-name{font-size:17px;font-weight:700;color:var(--tx);line-height:1.2;flex:1}
.sv-m-done-txt{color:var(--txm)}
.sv-m-status{font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px}

/* reason in station view */
.sv-mission-reason{font-size:13px;color:var(--txm);margin-bottom:6px;line-height:1.4}
.sv-reason-blocked{color:#d97706;font-weight:500}

/* batch in station view — plain language */
.sv-mission-batch{
  font-size:14px;font-weight:700;color:var(--b6,#2563eb);
  margin-bottom:8px;
}

/* action button in station view — full width */
.sv-mission-actions{margin-top:8px}
.sv-btn{width:100%;justify-content:center;padding:12px;font-size:15px}

/* status colours reused from chef view */
.ms-ready{color:#15803d}
.ms-blocked{color:#c2410c}
.ms-in_progress{color:#1d4ed8}
.ms-rfs{color:#15803d}
.ms-done{color:var(--txm)}
.ms-done-txt{color:var(--txm)}
.ms-watch{color:#92400e}

/* collapsed header */
.kp-srow-head{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;user-select:none}
.kp-srow-ico{font-size:17px;flex-shrink:0}
.kp-srow-info{flex:1}
.kp-srow-name{font-size:14px;font-weight:700;color:var(--tx)}
.kp-srow-owner{font-size:11px;color:var(--txm);margin-top:1px}
.kp-srow-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
/* mission count badge */
.kp-sbadge{
  font-size:11px;font-weight:700;min-width:20px;height:20px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  padding:0 6px}
.kp-sbadge.sb-blocked{background:rgba(249,115,22,.15);color:#c2410c}
.kp-sbadge.sb-ready{background:rgba(34,197,94,.15);color:#15803d}
.kp-sbadge.sb-in_progress{background:rgba(37,99,235,.12);color:#1d4ed8}
.kp-sbadge.sb-done{background:rgba(0,0,0,.06);color:var(--txm)}
.kp-sbadge.sb-idle{display:none}
/* chevron */
.kp-srow-chev{font-size:12px;color:var(--txm);transition:transform .2s}
.kp-srow.kp-expanded .kp-srow-chev{transform:rotate(180deg)}
/* expanded missions panel */
.kp-srow-missions{
  display:none;border-top:1px solid var(--bd);
  padding:10px 14px 12px;flex-direction:column;gap:8px}
.kp-srow.kp-expanded .kp-srow-missions{display:flex}
/* mission item inside accordion */
.kp-mission{display:flex;align-items:flex-start;gap:10px}
.kp-m-status{
  font-size:11px;font-weight:700;flex-shrink:0;min-width:72px;
  padding-top:1px;color:var(--txm)}
.kp-m-status.ms-blocked{color:#c2410c}
.kp-m-status.ms-ready{color:#15803d}
.kp-m-status.ms-in_progress{color:#1d4ed8}
.kp-m-status.ms-done{color:var(--txm)}
.kp-m-body{flex:1}
.kp-m-text{font-size:14px;color:var(--tx);line-height:1.4;font-weight:500}
.kp-m-text.ms-done{text-decoration:line-through;color:var(--txm);font-weight:400}
.kp-m-text.ms-blocked{color:var(--txm)}
.kp-m-reason{font-size:12px;color:var(--txm);margin-top:2px}
.kp-m-actions{margin-top:7px;display:flex;gap:7px;flex-wrap:wrap}

/* ── 3. Relay chip ── */
.kp-relay-chip{
  display:flex;align-items:center;gap:8px;
  border:1px solid var(--bd);border-radius:var(--r2);
  background:var(--surf);padding:11px 14px;
  cursor:pointer;user-select:none;margin-bottom:0}
.kp-relay-chip-ico{font-size:16px;flex-shrink:0}
.kp-relay-chip-label{font-size:13px;font-weight:600;color:var(--tx);flex:1}
.kp-relay-chip-badge{
  font-size:11px;font-weight:700;
  background:rgba(37,99,235,.12);color:var(--b6);
  border-radius:8px;padding:3px 8px}
.kp-relay-chip-chev{font-size:12px;color:var(--txm);transition:transform .2s}
/* relay expanded */
.kp-relay-open .kp-relay-chip-chev{transform:rotate(180deg)}
.kp-relay-log{
  display:none;border:1px solid var(--bd);border-top:none;
  border-radius:0 0 var(--r2) var(--r2);

/* shared button style */

/* ── Global timer chip (topbar) ── */

/* ── Timer panel (floating active-timers list) ── */
.timer-panel-overlay,.close-guard-overlay,#timer-panel-overlay,#close-guard-overlay{

.timer-panel{

.tp-hd{display:flex;justify-content:space-between;align-items:center;

.tp-close:hover{color:var(--tx);background:var(--bd)}
.tp-row{display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;border-bottom:1px solid var(--bd)}
.tp-row:last-child{border-bottom:none}
.tp-name{font-size:13px;color:var(--tx);flex:1;margin-right:12px}
.tp-time{font-size:13px;font-weight:700;font-family:var(--fm);color:var(--txm)}
.tp-time.running{color:var(--ok)}

/* ── Tab timer badge ── */
.tab-timer-badge{
  font-size:10px;font-weight:700;color:var(--b6);
  background:rgba(37,99,235,.12);border-radius:20px;
  padding:2px 6px;margin-right:4px;white-space:nowrap}

/* ── Close guard panel ── */
.close-guard-panel{
  background:var(--surf);border:1px solid var(--bd2);
  border-radius:var(--r3);padding:24px 24px 20px;

.cg-title{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:8px}
.cg-body{font-size:13px;color:var(--txm);line-height:1.55;margin-bottom:18px}
.cg-btns{display:flex;flex-direction:column;gap:8px}
.cg-btn{
  padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;

.cg-keep{border-color:var(--b6);color:var(--b6)}
.cg-keep:hover{background:rgba(37,99,235,.07)}
.cg-stop{border-color:var(--er);color:var(--er)}

/* ── Timer finished banner ── */
.timer-done-banner{

  -webkit-tap-highlight-color:transparent}
@keyframes tdb-slide-up{
  from{transform:translateY(100%);opacity:0}
  to{transform:translateY(0);opacity:1}}
.tdb-inner{
  max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;gap:10px}
.tdb-top{
  display:flex;align-items:flex-start;gap:12px}
.tdb-ico{font-size:24px;flex-shrink:0;line-height:1.2}
.tdb-text{flex:1;min-width:0}
.tdb-title{font-size:15px;font-weight:700;line-height:1.3}
.tdb-sub{font-size:13px;opacity:.88;margin-top:2px;line-height:1.4}
.tdb-close{
  font-size:18px;opacity:.8;cursor:pointer;

.tdb-btns{display:flex;gap:8px;flex-wrap:wrap}
.tdb-btn{

.tdb-btn:hover,.tdb-btn:active{background:rgba(255,255,255,.28)}
.tdb-btn.primary{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.8)}
.tdb-btn.stop-alarm{
  background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.8);

/* Finished state on global chip */
.gtimer-chip.has-finished{
  background:rgba(22,163,74,.12);border-color:rgba(22,163,74,.35);color:var(--ok)}

/* ── LAB diagnostic panel ── */
.lab-diag-wrap{
  border:1.5px dashed #f59e0b;border-radius:12px;
  padding:12px 14px;margin-bottom:14px;
  background:rgba(245,158,11,.05)}

.lab-diag-panel{display:flex;flex-direction:column;gap:0}
.diag-row{

.diag-k{color:#78716c;font-weight:600}
.diag-v{color:var(--tx);font-family:var(--fm);font-size:11px}
.diag-log-hd{font-size:10px;font-weight:700;color:#92400e;

.diag-log{

.diag-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.diag-btn{
  padding:7px 14px;border-radius:20px;

.diag-btn:active{background:rgba(245,158,11,.25)}

/* ── LAB prep banner ── */
.lab-prep-banner{
  display:flex;align-items:center;gap:8px;

.lab-prep-ico{font-size:14px}
/* ── LAB test step card ── */
.r-pcard._lab-step{ border:1.5px dashed #f59e0b;background:rgba(245,158,11,.06) }

/* Panel visibility */
.r-panel-hide{display:none}


/* ════ INVENTORY ════════════════════════════════════════════════════════ */

@media(max-width:560px){.istats{grid-template-columns:1fr 1fr}}
.istat{background:var(--surf-g);backdrop-filter:blur(10px);

.ival{font-size:20px;font-weight:700;color:var(--tx)}

.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:90px 62px 1fr;

.md{font-size:11px;color:var(--txm);font-family:var(--fm)}
.mq{font-weight:700;font-family:var(--fm)}
.qp{color:var(--ok)}.qn{color:var(--er)}
.mm{display:flex;flex-direction:column;gap:1px;min-width:0}
.ms{font-weight:500;font-size:13px;color:var(--tx)}

/* ════ JOURNAL ══════════════════════════════════════════════════════════ */
.frow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-size:12px;font-weight:500;padding:5px 13px;
  border-radius:var(--rp);border:1px solid var(--bd);

.chip:hover{border-color:var(--b4);color:var(--b6)}
.chip.on{background:var(--b6);color:#fff;border-color:var(--b6)}

/* v008 — entry cards */
.jent{
  background:var(--surf-g);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--bd);border-radius:var(--r2);
  border-left:3px solid var(--bd);

  margin-bottom:8px;transition:box-shadow .13s,border-color .13s;
  -webkit-tap-highlight-color:transparent
}
.jent:hover{box-shadow:var(--sh1)}
.jent.sv-ok{border-left-color:var(--ok)}
.jent.sv-wn{border-left-color:var(--wn)}
.jent.sv-er{border-left-color:var(--er)}
/* top row: time + cat pill + author */
.jmeta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:nowrap;overflow:hidden}
.jtime{font-size:11px;color:var(--txm);font-family:var(--fm);white-space:nowrap;flex-shrink:0}
.jdot{font-size:9px;color:var(--bd2);flex-shrink:0}
.jcat-pill{

}

}
.jauth{font-size:11px;color:var(--txm);margin-left:auto;white-space:nowrap;flex-shrink:0}

.jbod{font-size:12px;color:var(--tx2);line-height:1.5;margin:0}

/* ════ MODAL ════════════════════════════════════════════════════════════ */
.mbk{
  position:absolute;inset:0;
  background:rgba(30,58,95,.3);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  display:flex;align-items:flex-end;justify-content:center;

}
.mbk.hi{display:none}
@media(min-width:600px){.mbk{align-items:center;padding:24px}}
.msh{background:var(--surf);border-radius:var(--r3) var(--r3) 0 0;
  width:100%;max-width:520px;box-shadow:var(--sh3);
  animation:sUp .26s cubic-bezier(.34,1.45,.64,1)}
@media(min-width:600px){.msh{border-radius:var(--r3);animation:pIn .22s cubic-bezier(.34,1.45,.64,1)}}
@keyframes sUp{from{transform:translateY(56px);opacity:0}to{transform:none;opacity:1}}
@keyframes pIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.mhd{display:flex;align-items:center;justify-content:space-between;

.mt{font-size:16px;font-weight:600}
.mx{width:28px;height:28px;border-radius:50%;

.mx:hover{background:var(--er-bg);color:var(--er)}
.mbody{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;

.flbl{font-size:11px;font-weight:700;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.fin{width:100%;background:var(--bg);border:1px solid var(--bd2);

/* ════ YES CHEF ═════════════════════════════════════════════════════════ */
#ycs{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;

}

.yb{position:absolute;inset:0;background:rgba(30,58,95,.42);

.yc{

.yi{font-size:54px;margin-bottom:14px}
.yh{font-size:25px;font-weight:700;color:var(--tx);margin-bottom:10px}
.ym{font-size:14px;color:var(--tx2);margin-bottom:28px;line-height:1.55}

/* ════ JOURNAL PAGE ══════════════════════════════════════════════════════ */

.jmeta{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.jtime{font-size:11px;color:var(--txm);font-family:var(--fm)}
.jdot{font-size:9px;color:var(--bd2)}
.jcat-pill{
  font-size:10px;font-weight:700;letter-spacing:.05em;

.jtit{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:4px;line-height:1.3}
.jbod{font-size:13px;color:var(--tx2);line-height:1.55}

/* Inline add-entry form panel — v008 glass */
.j-form-panel{
  background:var(--surf-g);

.j-form-row{display:flex;flex-direction:column;gap:4px}

.flbl2{font-size:11px;font-weight:600;color:var(--tx2);

.fin2{background:var(--bg);border:1px solid var(--bd2);

/* ── SEARCH ──────────────────────────────────────────────────────────────── */
/* Override static .t-search from topbar block with input-capable version */
.t-search{position:relative}
.t-search-ico{opacity:.5;font-size:14px;flex-shrink:0;color:var(--txm)}
.t-search-input{

  font-size:13px;color:var(--tx);font-family:var(--ff);
  min-width:0;padding:0
}
.t-search-input::placeholder{color:var(--txm)}
.t-search-clear{
  font-size:11px;color:var(--txm);cursor:pointer;
  /* Larger touch target on mobile */
  width:24px;height:24px;border-radius:50%;

  align-items:center;justify-content:center;flex-shrink:0;
  transition:all .12s;

  animation:pIn .15s cubic-bezier(.34,1.4,.64,1)

  padding:11px 14px;cursor:pointer;transition:background .1s;
  -webkit-tap-highlight-color:transparent

.search-result:hover{background:var(--b0)}
.search-result:active{background:var(--b1)}
.search-result+.search-result{border-top:1px solid var(--bd)}
.sr-ico{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.sr-body{flex:1;min-width:0}
.sr-title{font-size:13px;font-weight:600;color:var(--tx)}
.sr-sub{font-size:11px;color:var(--txm)}
.sr-action{font-size:11px;color:var(--b6);font-weight:500;flex-shrink:0}
.search-empty{

/* ══ KITCHEN v013b — Station View refined CSS ══════════════════════════════ */

/* Station header */
.sv-wrap{padding-bottom:48px}
.sv-header{
  display:flex;align-items:center;gap:14px;
  padding:16px 0 14px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.sv-station-ico{font-size:34px;line-height:1}
.sv-station-name{font-size:21px;font-weight:800;color:var(--tx);line-height:1.2}
.sv-station-meta{font-size:13px;color:var(--txm);margin-top:3px}

/* "Messaggi per te" — only rendered when non-empty */
.sv-relay{
  background:var(--bg2,#dbeafe);border-radius:var(--r2);
  padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.sv-relay-title{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--b6,#2563eb);margin-bottom:2px}
.sv-relay-msg{display:flex;flex-direction:column;gap:2px}
.sv-relay-who{font-size:11px;font-weight:700;color:var(--txm);text-transform:uppercase;letter-spacing:.05em}
.sv-relay-text{font-size:14px;color:var(--tx);line-height:1.45;font-weight:500}

/* Mission card grid */
.sv-missions{display:flex;flex-direction:column;gap:10px}

/* Base card */
.sv-mission{
  border:1px solid var(--bd);border-radius:var(--r2);
  background:var(--surf);padding:14px 16px}

/* Urgent — HIGH + ready_to_start */
.sv-m-urgent{
  border-left:3px solid #16a34a;
  background:var(--surf)}
/* Blocked */
.sv-m-blocked{border-left:3px solid #ea580c;opacity:.9}
/* Done */
.sv-m-done{opacity:.35}
/* Ready for service */
.sv-m-rfs{border-left:3px solid #22c55e}

/* Card head: name left, label right */
.sv-m-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:10px;margin-bottom:4px}
.sv-m-name{font-size:17px;font-weight:700;color:var(--tx);line-height:1.2;flex:1}
.sv-m-done-txt{color:var(--txm)}

/* Status label — right side of head */
.sv-lbl{font-size:12px;font-weight:800;flex-shrink:0;margin-top:2px;letter-spacing:.02em}
.sv-lbl-urgent{color:#15803d;font-size:13px}  /* FAI ORA */
.ms-blocked{color:#c2410c}
.ms-ready{color:#15803d}
.ms-in_progress{color:#1d4ed8}
.ms-rfs{color:#15803d}
.ms-done{color:var(--txm)}
.ms-watch{color:#92400e}

/* Detail line: "Fai 39 pz · 40 min" */
.sv-m-detail{font-size:13px;color:var(--txm);margin-bottom:6px;line-height:1.3}

/* Block reason — only when blocked, sous-chef voice */
.sv-m-block-reason{font-size:13px;color:#c2410c;margin-bottom:6px;line-height:1.4;font-weight:500}

/* Action button — full width */
.sv-m-action{margin-top:10px}
.sv-btn{width:100%;justify-content:center;padding:13px;font-size:15px;font-weight:700}

/* Chef View relay — updated to person format */
.kp-rmsg{display:flex;flex-direction:column;gap:3px;padding:8px 0;border-bottom:1px solid var(--bd)}
.kp-rmsg:last-child{border-bottom:none}
.kp-rmsg-who{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txm)}
.kp-rmsg-text{font-size:13px;color:var(--tx);line-height:1.4}
.kp-rmsg-time{font-size:10px;color:var(--txm);margin-top:1px}

/* ══ PREP CARD GALLERY v014 ════════════════════════════════════════════════ */

.pg-wrap{padding-bottom:48px}
.pg-header{padding:16px 0 6px}
.pg-title{font-size:22px;font-weight:800;color:var(--tx);margin-bottom:3px}
.pg-sub{font-size:13px;color:var(--txm);line-height:1.4;margin-bottom:4px}
.pg-note-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bg2);color:var(--txm);
  border-radius:4px;padding:2px 7px;margin-bottom:16px}

/* ── 4-component label bar ── */
.pg-comp-bar{
  display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;padding:12px 14px;
  background:var(--bg2);border-radius:var(--r2)}
.pg-comp-bar-title{
  width:100%;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--txm);margin-bottom:6px}
.pg-comp-pill{
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;
  border:1.5px solid var(--bd);background:var(--surf);color:var(--tx)}
.pg-comp-pill.pa{border-color:#2563eb;color:#2563eb}
.pg-comp-pill.pb{border-color:#7c3aed;color:#7c3aed}
.pg-comp-pill.pc{border-color:#0891b2;color:#0891b2}
.pg-comp-pill.pd{border-color:#d97706;color:#d97706}

/* ── Diff callout (PRODUCI vs PREPARA) ── */
.pg-diff{
  border-left:3px solid #2563eb;background:var(--bg2);
  border-radius:0 var(--r1) var(--r1) 0;
  padding:10px 14px;margin:0 0 20px;font-size:13px;
  color:var(--tx);line-height:1.5}

/* ── Section separator ── */
.pg-section{margin-bottom:28px}
.pg-section-comp{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--txm);margin-bottom:8px;padding:0 2px}

/* ── Family card ── */
.pg-card{
  border:1px solid var(--bd);border-radius:var(--r2);
  background:var(--surf);overflow:hidden;margin-bottom:10px}

/* Family header stripe */
.pg-card-head{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px 12px}
.pg-card-ico{font-size:26px;line-height:1;flex-shrink:0}
.pg-card-fam{flex:1}
.pg-card-fam-name{
  font-size:15px;font-weight:800;color:var(--tx);
  text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.pg-card-fam-sub{font-size:12px;color:var(--txm);margin-top:2px;line-height:1.3}
.pg-card-comp-badge{
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;
  border:1.5px solid;flex-shrink:0}
.pg-card-comp-badge.pa{border-color:#2563eb;color:#2563eb}
.pg-card-comp-badge.pb{border-color:#7c3aed;color:#7c3aed}
.pg-card-comp-badge.pc{border-color:#0891b2;color:#0891b2}
.pg-card-comp-badge.pd{border-color:#d97706;color:#d97706}

/* Divider */
.pg-card-div{height:1px;background:var(--bd);margin:0 16px}

/* Card body */
.pg-card-body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}

/* Example block — looks like a real mission preview */
.pg-example{
  background:var(--bg);border-radius:var(--r1);padding:10px 13px;
  border:1px solid var(--bd)}
.pg-ex-name{font-size:17px;font-weight:700;color:var(--tx);margin-bottom:2px}
.pg-ex-detail{font-size:13px;color:var(--txm);line-height:1.35}
.pg-ex-status{
  display:inline-block;font-size:11px;font-weight:800;letter-spacing:.03em;
  margin-top:6px;padding:3px 8px;border-radius:4px}
.pg-ex-status.s-do-now{background:#dcfce7;color:#15803d}
.pg-ex-status.s-to-do{background:#f1f5f9;color:#475569}
.pg-ex-status.s-blocked{background:#fff7ed;color:#c2410c}
.pg-ex-status.s-check{background:#e0f2fe;color:#0369a1}
.pg-ex-status.s-setup{background:#fef3c7;color:#92400e}

/* Meta row: opens recipe, primary action */
.pg-meta{display:flex;flex-direction:column;gap:5px}
.pg-meta-row{display:flex;align-items:baseline;gap:6px;font-size:12px}
.pg-meta-lbl{font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--txm);flex-shrink:0;width:110px}
.pg-meta-val{color:var(--tx);line-height:1.35}
.pg-meta-val.recipe-yes{color:#2563eb;font-weight:600}
.pg-meta-val.recipe-no{color:var(--txm)}

/* Action button mock */
.pg-card-action{padding:0 16px 14px}
.pg-act-btn{
  display:block;width:100%;padding:11px;border-radius:var(--r1);
  font-size:14px;font-weight:700;text-align:center;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.pg-act-btn.primary{background:#2563eb;color:#fff}
.pg-act-btn.success{background:#16a34a;color:#fff}
.pg-act-btn.neutral{background:var(--bg2);color:var(--tx);border:1.5px solid var(--bd)}
.pg-act-btn.warn{background:#d97706;color:#fff}

/* Not-contains chips */
.pg-notcontains{display:flex;flex-wrap:wrap;gap:5px;padding:0 16px 14px}
.pg-nc-chip{
  font-size:10px;color:var(--txm);background:var(--bg);
  border:1px solid var(--bd);border-radius:4px;padding:2px 7px;
  text-decoration:line-through;opacity:.7}

/* ── Summary table ── */
.pg-table-wrap{overflow-x:auto;margin-top:24px;margin-bottom:8px;border-radius:var(--r1);border:1px solid var(--bd)}
.pg-table{width:100%;border-collapse:collapse;font-size:12px}
.pg-table th{
  background:var(--bg2);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--txm);padding:8px 12px;text-align:left;
  border-bottom:1px solid var(--bd)}
.pg-table td{
  padding:9px 12px;border-bottom:1px solid var(--bd);color:var(--tx);vertical-align:top}
.pg-table tr:last-child td{border-bottom:none}
.pg-table tr:hover td{background:var(--bg)}
.pg-td-fam{font-weight:700}
.pg-td-comp{font-weight:600}
.pg-td-comp.pa{color:#2563eb}
.pg-td-comp.pb{color:#7c3aed}
.pg-td-comp.pc{color:#0891b2}
.pg-td-comp.pd{color:#d97706}

/* ══ KITCHEN FLOW STUDIO HOME v016 ════════════════════════════════════════ */

/* Hero — Flow Planner */
.kfs-hero{
  margin:16px 16px 0;
  background:linear-gradient(135deg,rgba(79,70,229,.18) 0%,rgba(99,102,241,.08) 100%);
  border:1px solid rgba(99,102,241,.3);
  border-radius:18px;
  padding:20px 20px 18px;
  position:relative;
  overflow:hidden;
}
.kfs-hero::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 80% 20%, rgba(129,140,248,.12) 0%, transparent 60%);
  pointer-events:none;
}
.kfs-hero-eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:#818cf8;margin-bottom:10px;
}
.kfs-hero-eyebrow-dot{
  width:6px;height:6px;border-radius:50%;
  background:#818cf8;
  box-shadow:0 0 6px rgba(129,140,248,.7);
  animation:kfs-pulse 2.4s ease-in-out infinite;
}
@keyframes kfs-pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.7)}
}
.kfs-hero-title{
  font-size:20px;font-weight:800;color:#e2e8f0;
  letter-spacing:-.04em;line-height:1.15;
  margin-bottom:6px;
}
.kfs-hero-desc{
  font-size:13px;color:#94a3b8;line-height:1.5;
  margin-bottom:16px;
}
.kfs-hero-cta{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#4f46e5,#6366f1);
  color:#fff;font-size:13px;font-weight:700;
  padding:10px 18px;border-radius:10px;border:none;cursor:pointer;
  box-shadow:0 4px 14px rgba(79,70,229,.4);
  -webkit-tap-highlight-color:transparent;
  transition:opacity .15s, transform .1s;
}
.kfs-hero-cta:active{opacity:.85;transform:scale(.98)}
.kfs-hero-cta-ico{font-size:16px}
.kfs-hero-preview-tag{
  display:inline-flex;align-items:center;
  margin-left:12px;
  font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);
  padding:3px 7px;border-radius:5px;
}
/* Nodes preview strip inside hero */
.kfs-hero-nodes{
  display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;
}
.kfs-node{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:600;color:#94a3b8;
  background:rgba(15,23,42,.5);border:1px solid rgba(99,102,241,.2);
  padding:4px 9px;border-radius:7px;
}
.kfs-node-dot{
  width:5px;height:5px;border-radius:50%;flex-shrink:0;
}

/* ── Section label */
.kfs-section{padding:18px 16px 0}
.kfs-section-lbl{
  font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:#475569;margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.kfs-section-lbl::after{
  content:'';flex:1;height:1px;background:rgba(99,102,241,.15);
}

/* ── Tools grid (3 columns) */
.kfs-tools{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  padding:0 16px;
}
.kfs-tool{
  background:rgba(30,41,59,.7);border:1px solid rgba(99,102,241,.18);
  border-radius:14px;padding:13px 12px 11px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .15s,border-color .15s,transform .1s;
  display:flex;flex-direction:column;gap:3px;
  text-align:left;
}
.kfs-tool:active{transform:scale(.97)}
.kfs-tool:hover{background:rgba(49,46,129,.45);border-color:rgba(99,102,241,.35)}
.kfs-tool.live{border-color:rgba(99,102,241,.35)}
.kfs-tool.placeholder{opacity:.48;cursor:default}
.kfs-tool.placeholder:hover{background:rgba(30,41,59,.7);border-color:rgba(99,102,241,.18);transform:none}
.kfs-tool-ico{font-size:20px;margin-bottom:3px}
.kfs-tool-name{font-size:12px;font-weight:700;color:#e2e8f0;line-height:1.25}
.kfs-tool-desc{font-size:10px;color:#64748b;line-height:1.35}
.kfs-tool-tag{
  margin-top:5px;
  display:inline-flex;align-items:center;
  font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;
}
.kfs-tool-tag.live{background:rgba(99,102,241,.2);color:#818cf8}
.kfs-tool-tag.soon{background:rgba(71,85,105,.3);color:#64748b}

/* ── System row (2 columns) */
.kfs-system{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  padding:0 16px;
}
.kfs-sys{
  background:rgba(15,23,42,.6);border:1px solid rgba(71,85,105,.25);
  border-radius:12px;padding:12px 12px 10px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .15s,border-color .15s;
  display:flex;flex-direction:column;gap:3px;text-align:left;
}
.kfs-sys:hover{background:rgba(30,41,59,.8);border-color:rgba(99,102,241,.25)}
.kfs-sys.placeholder{opacity:.4;cursor:default}
.kfs-sys.placeholder:hover{background:rgba(15,23,42,.6);border-color:rgba(71,85,105,.25)}
.kfs-sys-ico{font-size:17px;margin-bottom:2px}
.kfs-sys-name{font-size:11px;font-weight:700;color:#cbd5e1}
.kfs-sys-desc{font-size:10px;color:#475569;line-height:1.3}

/* ── Recenti / LAB log */
.kfs-log{margin:16px 16px 0;border:1px solid rgba(99,102,241,.15);border-radius:14px;overflow:hidden}
.kfs-log-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;
  background:rgba(15,23,42,.5);border-bottom:1px solid rgba(99,102,241,.12);
}
.kfs-log-lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#475569;flex:1}
.kfs-log-badge{
  font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(245,158,11,.15);color:#d97706;
  padding:2px 7px;border-radius:4px;
}
.kfs-log-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 14px;border-bottom:1px solid rgba(99,102,241,.08);
}
.kfs-log-row:last-child{border-bottom:none}
.kfs-log-ico{font-size:13px;flex-shrink:0;margin-top:1px;opacity:.6}
.kfs-log-body{flex:1}
.kfs-log-text{font-size:12px;color:#94a3b8;line-height:1.4}
.kfs-log-time{font-size:10px;color:#475569;margin-top:1px}

/* ── Footer note */
.kfs-footer{padding:12px 16px 20px;text-align:center}
.kfs-footer-note{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10px;color:#334155;
  background:rgba(15,23,42,.4);border:1px solid rgba(71,85,105,.2);
  padding:5px 12px;border-radius:7px;
}

  chef:   {it:'Chef Mode',            en:'Chef Mode',            es:'Modo Chef'},
  admin:  {it:'Kitchen Flow Studio',  en:'Kitchen Flow Studio',  es:'Kitchen Flow Studio'}

/* Modules allowed per mode. 'home' is always allowed. */
var MODE_MODULES = {
  station: ['home','kitchen','recipe'],
  chef:    ['home','kitchen','recipe','bot_center','daily_journal','pos'],
  admin:   ['home','prep_gallery','bot_center','recipe','inventory','pos']
};

let MODE = (function(){
  var v = localStorage.getItem(MODE_KEY);
  return MODES.indexOf(v) >= 0 ? v : 'chef';
})();

function setMode(m){
  if(MODES.indexOf(m) < 0) return;
  MODE = m;
  localStorage.setItem(MODE_KEY, m);
  _applyModeClass();
  renderAll();
}

function modeAllows(type){
  return (MODE_MODULES[MODE] || []).indexOf(type) >= 0;
}

function _applyModeClass(){
  var body = document.body;
  body.classList.remove('mode-station','mode-chef','mode-admin');
  body.classList.add('mode-'+MODE);
}

function renderModeBar(){
  var tabs = MODES.map(function(m){
    var lbl = MODE_LABELS[m][LANG] || MODE_LABELS[m].en;
    var ico = m==='station'?'🔪':m==='chef'?'👨‍🍳':'⚙️';
    return '<button class="mb-tab'+(m===MODE?' on':'')+'" data-mode="'+m+'" title="'+MODE_DESCS[m][LANG]+'">'      +'<span>'+ico+'</span><span>'+lbl+'</span></button>';
  }).join('');
  var el = document.getElementById('mb-tabs');
  if(el) el.innerHTML = tabs;

  var lbl = document.getElementById('mb-label');
  if(lbl){
    var ml = MODE==='station'?'ml-station':MODE==='chef'?'ml-chef':'ml-admin';
    lbl.className = 'mb-label '+ml;
    lbl.textContent = MODE_LABELS[MODE][LANG] || MODE_LABELS[MODE].en;
  }
  var bar = document.getElementById('modebar');
  if(bar){
    bar.className = '';
    bar.classList.add('mode-'+MODE);
  }
  /* Wire buttons */
  var tabsEl = document.getElementById('mb-tabs');
  if(tabsEl){
    tabsEl.addEventListener('click', function(e){
      var btn = e.target.closest('[data-mode]');
      if(btn){ setMode(btn.dataset.mode); }
    });
  }
}

/* ── Unavailable screen ───────────────────────────────────────────────────── */
function pageUnavailable(tabType, tabTitle){
  var modeLbl = MODE_LABELS[MODE][LANG] || MODE_LABELS[MODE].en;
  /* Find which modes DO allow this module */
  var allowedModes = MODES.filter(function(m){ return modeAllows(tabType); });
  /* For simplicity, suggest the first mode that allows it */
  var suggestMode = null;
  for(var i=0;i<MODES.length;i++){
    if(MODES[i]!==MODE && modeAllows_in(tabType, MODES[i])){ suggestMode=MODES[i]; break; }
  }
  var btnHtml = suggestMode
    ? '<button class="mode-unavail-btn" onclick="setMode(\''+suggestMode+'\')">'
      + '→ ' + (MODE_LABELS[suggestMode][LANG]||MODE_LABELS[suggestMode].en) + '</button>'
    : '';

  var title = LANG==='it' ? 'Non disponibile in '+modeLbl
             : LANG==='es' ? 'No disponible en '+modeLbl
             : 'Not available in '+modeLbl;
  var sub   = LANG==='it' ? tabTitle+' non è accessibile in questa modalità.'
             : LANG==='es' ? tabTitle+' no es accesible en este modo.'
             : tabTitle+' is not available in this mode.';

  return '<div class="pi"><div class="mode-unavail">'
    +'<div class="mode-unavail-ico">🔒</div>'
    +'<div class="mode-unavail-title">'+title+'</div>'
    +'<div class="mode-unavail-sub">'+sub+'</div>'
    +btnHtml
    +'</div></div>';
}

function modeAllows_in(type, m){
  return (MODE_MODULES[m]||[]).indexOf(type)>=0;
}


/* ══ TAB MANAGER ══════════════════════════════════════════════════════════ */
/*
  Singleton tabs (one per type): home, bot_center, daily_journal
  Entity tabs (keyed by id):     recipe:X, inventory:X
  Clicking a card that is already open → activates existing tab (no duplicate)
*/
let TABS=[], AID=null;

function _tabKey(type, params){
  if(type==='home')         return 'home';
  if(type==='bot_center')   return 'bot_center';
  if(type==='daily_journal') return 'daily_journal';
  if(type==='kitchen')      return 'kitchen';
  if(type==='prep_gallery')  return 'prep_gallery';
  /* entity types: keyed by id or name */
  return type + ':' + (params.id || params.name || '');
}

function openTab(type, params){
  params = params || {};
  /* reset kitchen state when opening a fresh kitchen tab */
  if(type==='kitchen') KS = null;
  const key = _tabKey(type, params);
  const existing = TABS.find(function(x){ return _tabKey(x.type,x.params)===key; });
  if(existing){
    /* save current scroll before switching */
    _saveScroll();
    AID = existing.id;
    _persist();
    renderAll();
    return existing.id;
  }
  /* evict oldest non-home if at limit */
  if(TABS.length >= 10){
    var old = TABS.find(function(x){ return x.type!=='home'; });
    if(old) TABS.splice(TABS.indexOf(old),1);
  }
  _saveScroll();
  var id = 't' + Date.now();
  var title = _tabTitle(type, params);
  TABS.push({id:id, type:type, title:title, params:params, scroll:0});
  AID = id;
  _persist();
  renderAll();
  return id;
}

function closeTab(id){
  var i = TABS.findIndex(function(x){ return x.id===id; });
  if(i<0) return;
  /* debounce: ignore rapid double-tap on mobile */
  var now = Date.now();
  var tab = TABS[i];
  if(tab._closing) return;
  tab._closing = true;
  if(AID===id){
    /* prefer tab to the right, then left */
    var next = TABS[i+1] || null;
    var prev = i>0 ? TABS[i-1] : null;
    var fallback = next || prev || null;
    AID = fallback ? fallback.id : null;
  }
  TABS.splice(i,1);
  /* if no tabs remain, open Home */
  if(TABS.length===0){
    _persist();
    openTab('home',{});
    return;
  }
  /* if AID points to nothing (shouldn't happen but guard), go to first */
  if(AID && !TABS.find(function(x){ return x.id===AID; })){
    AID = TABS[0].id;
  }
  _persist();
  renderAll();
}

function activateTab(id){
  if(!TABS.find(function(x){ return x.id===id; })) return;
  _saveScroll();
  AID = id;
  _persist();
  renderAll();
}

function _saveScroll(){
  var cur = TABS.find(function(x){ return x.id===AID; });
  if(cur){
    var ws = document.getElementById('workspace');
    if(ws) cur.scroll = ws.scrollTop;
  }
}

function _tabTitle(type, p){
  if(type==='home')          return t('th');
  if(type==='bot_center')    return t('tb');
  if(type==='daily_journal') return t('tj_short');
  if(type==='kitchen')       return t('tk');
  if(type==='recipe')        return t('tr',{n:p.name||''});
  if(type==='inventory')     return t('ti',{n:p.name||''});
  if(type==='pos')           return t('tp');
  if(type==='prep_gallery')  return t('tpg');
  return type;
}

function _persist(){
  try{
    sessionStorage.setItem('ws_tabs', JSON.stringify(TABS));
    sessionStorage.setItem('ws_aid', AID||'');
  }catch(e){}
}

function _restoreTabs(){
  try{
    var raw = sessionStorage.getItem('ws_tabs');
    var aid = sessionStorage.getItem('ws_aid') || null;
    var parsed = raw ? JSON.parse(raw) : [];
    /* validate: must be array, every item must have id/type/title */
    if(!Array.isArray(parsed)) throw new Error('not array');
    parsed.forEach(function(t){ if(!t.id||!t.type||!t.title) throw new Error('corrupt tab'); });
    TABS = parsed;
    AID  = aid;
    if(AID && !TABS.find(function(x){ return x.id===AID; })){
      AID = TABS.length ? TABS[0].id : null;
    }
  }catch(e){
    /* corrupted storage — clean slate */
    try{ sessionStorage.removeItem('ws_tabs'); sessionStorage.removeItem('ws_aid'); }catch(e2){}
    TABS=[]; AID=null;
  }
}

/* status in DB → internal status code */
function _mapStatus(s){
  if(s==='success') return 'ok';
  if(s==='warning') return 'warn';
  if(s==='running') return 'running';
  if(s==='error'||s==='failed') return 'error';
  return 'idle';
}

/* Convert UTC ISO string → CDT time string "HH:MM CDT" */
function _toCDT(iso){
  if(!iso) return '—';
  try{
    var d = new Date(iso);
    /* CDT = UTC-5 (summer: UTC-5 when DST active, else UTC-6; we use fixed -5 for CDT display) */
    var cdt = new Date(d.getTime() - 5*60*60*1000);
    var h = cdt.getUTCHours(), m = cdt.getUTCMinutes();
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+' CDT';
  }catch(e){ return '—'; }
}

/* Duration: seconds → human "Xs" or "Xm Ys" */
function _dur(started, finished){
  if(!started||!finished) return '—';
  try{
    var secs = Math.round((new Date(finished) - new Date(started))/1000);
    if(secs<60) return secs+'s';
    return Math.floor(secs/60)+'m '+(secs%60)+'s';
  }catch(e){ return '—'; }
}

function botsAfterRender(){
  var ws = document.getElementById('workspace');

  /* ── 1. Wire expand/collapse (always, regardless of live data) ── */
  ws.querySelectorAll('.bc-card').forEach(function(card){
    var main = card.querySelector('.bc-card-main');
    var det  = card.querySelector('.bc-details');
    if(!main || !det) return;
    main.addEventListener('click', function(){
      if(det.open) det.removeAttribute('open');
      else         det.setAttribute('open','');
    });
    main.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); main.click(); }
    });
  });

  /* ── 2. Fetch live bot_runs from Supabase (read-only, anon) ── */
  /* Query: last run per nightly bot, ordered by bot_name + started_at DESC   */
  var botNames = Object.keys(NIGHTLY_BOT_MAP);
  var inClause = botNames.map(function(n){ return '"'+n+'"'; }).join(',');
  var q = SUPABASE_URL
    + '/rest/v1/bot_runs'
    + '?select=bot_name,status,started_at,finished_at,rows_written,warnings_count,errors_count,summary'
    + '&bot_name=in.(' + botNames.join(',') + ')'
    + '&order=bot_name.asc,started_at.desc';

  fetch(q, {
    headers:{
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Accept': 'application/json',
      'Prefer': 'return=representation'
    }
  })
  .then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  })
  .then(function(rows){
    /* Keep only the most recent run per bot_name */
    var latest = {};
    rows.forEach(function(row){
      if(!latest[row.bot_name]) latest[row.bot_name] = row;
    });

    /* Patch each card */
    botNames.forEach(function(dbName){
      var cardId = NIGHTLY_BOT_MAP[dbName];
      var card   = ws.querySelector('[data-botid="'+cardId+'"]');
      if(!card) return;

      var row = latest[dbName];
      var s   = row ? _mapStatus(row.status) : 'idle';
      var sKey = s==='ok'?'bok': s==='warn'?'bwn': s==='error'?'ber': s==='idle'?'bidle':'bpd';
      var sCls = s==='ok'?'b-ok': s==='warn'?'b-wn': s==='error'?'b-er':'b-in';

      /* Update badge */
      var badge = card.querySelector('.bdg');
      if(badge){ badge.className='bdg '+sCls; badge.textContent=t(sKey); }

      /* Update meta line */
      var meta = card.querySelector('.bc-card-meta');
      if(meta && row){
        var time = _toCDT(row.started_at);
        var dur  = _dur(row.started_at, row.finished_at);
        var rows = (row.rows_written||0);
        var warnPill = row.warnings_count>0
          ? '<span class="bc-warn-pill">⚠️ '+row.warnings_count+'</span>'
          : '';
        meta.innerHTML = '<span>'
          + time + ' · ' + dur + ' · ' + rows + ' ' + t('brows')
          + '</span>'
          + (warnPill ? ' ' + warnPill : '');
      } else if(meta && !row){
        meta.textContent = t('bidle');
      }

      /* Update detail — input/output cells */
      var cells = card.querySelectorAll('.bc-detail-val');
      if(cells.length>=2 && row){
        cells[0].textContent = (row.rows_written||0) + ' rows read → written';
        cells[1].textContent = row.summary
          ? row.summary.slice(0,120)+(row.summary.length>120?'…':'')
          : '—';
      }
    });

    /* ── 3. Patch header status ── */
    var statuses = botNames.map(function(n){
      var r=latest[n]; return r?_mapStatus(r.status):'idle';
    });
    var anyErr  = statuses.some(function(s){ return s==='error'; });
    var anyWarn = statuses.some(function(s){ return s==='warn'; });
    var allIdle = statuses.every(function(s){ return s==='idle'; });
    var hCls    = anyErr?'err': anyWarn?'warn': allIdle?'idle':'ok';
    var hKey    = anyErr?'bstatus_err': anyWarn?'bstatus_warn': allIdle?'bstatus_idle':'bstatus_ok';

    var dot = ws.querySelector('.bc-status-dot');
    var lbl = ws.querySelector('.bc-status-label');
    if(dot){ dot.className='bc-status-dot '+hCls; }
    if(lbl){ lbl.textContent=t(hKey); }

    /* Last run time */
    var allRows = botNames.map(function(n){ return latest[n]; }).filter(Boolean);
    if(allRows.length){
      var lastRow = allRows.sort(function(a,b){
        return new Date(b.started_at)-new Date(a.started_at);
      })[0];
      var timeEl = ws.querySelector('.bc-times .bc-time-val');
      if(timeEl) timeEl.textContent = _toCDT(lastRow.started_at);
    }

    /* ── 4. Patch observations from summaries ── */
    _patchObservations(ws, latest);

    /* ── 5. Remove demo note, show live indicator ── */
    var noteEl = ws.querySelector('.note');
    if(noteEl){
      noteEl.innerHTML='<span class="bc-live-dot"></span>'
        +'<span style="font-size:11px;color:var(--ok)">'+t('blive')+'</span>'
        +'<span style="font-size:10px;color:var(--txm);margin-left:8px">'+SHELL_VERSION+'</span>';
    }
  })
  .catch(function(err){
    /* Graceful fallback — mock stays, soft note */
    console.warn('[v007] bot_runs fetch failed:', err);
    var noteEl = ws.querySelector('.note');
    if(noteEl){
      noteEl.innerHTML='<span class="nd"></span>'
        +'<span style="font-size:11px;color:var(--txm)">'
        +t('blive_fail')+'</span>'
        +'<span style="font-size:10px;color:var(--txm);margin-left:8px">'+SHELL_VERSION+'</span>';
    }
  });
}

function _patchObservations(ws, latest){
  /* Build obs from real summaries where available, fallback to mock */
  var obsList = ws.querySelector('.obslist');
  if(!obsList) return;

  var liveObs = [];
  Object.keys(latest).forEach(function(dbName){
    var row = latest[dbName];
    if(!row) return;
    if(row.warnings_count>0){
      liveObs.push({tp:'wn', text:row.summary ? row.summary.slice(0,140) : dbName+': '+row.warnings_count+' warnings'});
    }
    if(row.errors_count>0){
      liveObs.push({tp:'er', text:dbName+': '+row.errors_count+' error(s)'});
    }
  });

  /* Always add a pipeline-ok line if all good */
  var anyIssue = liveObs.length>0;
  if(!anyIssue){
    liveObs.push({tp:'ok', text:t('bobs_allok')});
  }

  var obsIco = {ok:'✅',wn:'⚠️',er:'🔴','in':'ℹ️'};
  obsList.innerHTML = liveObs.map(function(o){
    return '<div class="obs obs-'+(o.tp==='er'?'er':o.tp==='ok'?'in':o.tp)+'">'
      +'<span style="flex-shrink:0">'+(obsIco[o.tp]||'ℹ️')+'</span>'
      +'<span>'+o.text+'</span>'
      +'</div>';
  }).join('');
}
