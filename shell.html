<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<title>Brigade — New Shell Lab</title>
<style>
:root{
  --bg:#eff6ff;--bg2:#dbeafe;--bg3:#e0f2fe;
  --surf:#fff;--surf-g:rgba(255,255,255,.75);--surf-r:rgba(255,255,255,.95);
  --tx:#1e3a5f;--tx2:#3b6ea8;--txm:#7a9cc4;--txi:#fff;
  --b9:#1e3a5f;--b7:#1d4ed8;--b6:#2563eb;--b5:#3b82f6;--b4:#60a5fa;
  --b2:#bfdbfe;--b1:#dbeafe;--b0:#eff6ff;
  --ok:#16a34a;--ok-bg:#f0fdf4;--ok-bd:#bbf7d0;
  --wn:#d97706;--wn-bg:#fffbeb;--wn-bd:#fde68a;
  --er:#dc2626;--er-bg:#fef2f2;--er-bd:#fecaca;
  --in:#2563eb;--in-bg:#eff6ff;--in-bd:#bfdbfe;
  --bd:rgba(37,99,235,.11);--bd2:rgba(37,99,235,.22);--bd-tab:rgba(37,99,235,.14);
  --sh0:0 1px 3px rgba(30,58,95,.06);
  --sh1:0 2px 8px rgba(30,58,95,.09);
  --sh2:0 6px 24px rgba(30,58,95,.12);
  --sh3:0 14px 48px rgba(30,58,95,.17);
  --shg:0 4px 24px rgba(30,58,95,.07),inset 0 1px 0 rgba(255,255,255,.8);
  --r1:8px;--r2:14px;--r3:20px;--rp:999px;
  --ff:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
  --fm:'SF Mono','Fira Code',monospace;
  --th:56px;--tbh:46px;
  --sab:env(safe-area-inset-bottom,0px);
  --sat:env(safe-area-inset-top,0px)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--ff);font-size:15px;color:var(--tx);
  background:var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit;
  -webkit-tap-highlight-color:transparent}
input,select,textarea{font-family:inherit}

/* ── Shell ────────────────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  background:linear-gradient(148deg,var(--bg) 0%,var(--bg2) 58%,var(--bg3) 100%);
  /* Safe area: push content inside notch/Dynamic Island zones */
  padding-top:var(--sat);
  padding-bottom:var(--sab)}

/* ── TOPBAR ─────────────────────────────────────────────────────────────── */
#topbar{
  flex-shrink:0;height:var(--th);
  display:flex;align-items:center;gap:8px;padding:0 14px;
  background:rgba(239,246,255,.85);
  backdrop-filter:blur(28px) saturate(1.9);
  -webkit-backdrop-filter:blur(28px) saturate(1.9);
  border-bottom:1px solid var(--bd);box-shadow:var(--sh1);z-index:100
}

/* ── Brand ── */
.t-brand{display:flex;align-items:center;gap:7px;flex-shrink:0}
.t-mark{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(135deg,var(--b6) 0%,var(--b4) 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;color:#fff;
  box-shadow:0 2px 8px rgba(37,99,235,.35);flex-shrink:0
}
.t-words{display:flex;flex-direction:column;line-height:1}
.t-name{font-size:14px;font-weight:700;color:var(--b7);letter-spacing:-.03em}
.t-sub{font-size:9px;font-weight:500;color:var(--txm);letter-spacing:.05em}

/* ── Search ── */
.t-search{
  flex:1;
  display:flex;align-items:center;gap:6px;
  background:var(--surf-r);border:1px solid var(--bd);border-radius:var(--rp);
  padding:6px 12px;color:var(--txm);font-size:13px;cursor:text;
  transition:border-color .15s,box-shadow .15s,max-width .2s;
  max-width:300px
}
.t-search:hover{border-color:var(--bd2);box-shadow:var(--sh0)}

/* ── Right cluster ── */
.t-right{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:auto}

/* ── Chef AI button ── */
.chef-ai-btn{
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,rgba(37,99,235,.11),rgba(96,165,250,.11));
  border:1px solid rgba(37,99,235,.22);border-radius:var(--rp);
  padding:5px 11px 5px 7px;cursor:pointer;
  transition:all .15s;flex-shrink:0
}
.chef-ai-btn:hover{
  background:linear-gradient(135deg,rgba(37,99,235,.2),rgba(96,165,250,.18));
  border-color:var(--b5);box-shadow:0 0 0 3px rgba(37,99,235,.1)
}
.chef-ai-btn.active{
  background:var(--b6);border-color:var(--b7);
  box-shadow:0 2px 12px rgba(37,99,235,.35)
}
.chef-ai-btn.active .cai-label,.chef-ai-btn.active .cai-status{color:#fff}
.cai-av{
  width:24px;height:24px;border-radius:50%;
  background:var(--b6);display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;border:1.5px solid rgba(255,255,255,.5)
}
.chef-ai-btn.active .cai-av{background:#fff;border-color:rgba(37,99,235,.3)}
.cai-text{display:flex;flex-direction:column;line-height:1.1}
.cai-label{font-size:12px;font-weight:700;color:var(--b7);letter-spacing:-.01em}
.cai-status{font-size:10px;color:var(--txm)}

/* ── Online pills (desktop) ── */
.online-pills{display:flex;align-items:center;flex-shrink:0}
.op-av{
  width:26px;height:26px;border-radius:50%;
  border:2px solid rgba(239,246,255,.95);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;
  cursor:default;position:relative;transition:transform .12s;flex-shrink:0
}
.op-av:hover{transform:scale(1.15);z-index:10}
.op-av+.op-av{margin-left:-6px}
.op-tooltip{
  position:absolute;bottom:calc(100% + 6px);left:50%;
  transform:translateX(-50%);white-space:nowrap;
  background:var(--b9);color:#fff;font-size:10px;font-weight:500;
  padding:3px 8px;border-radius:var(--r1);
  pointer-events:none;opacity:0;transition:opacity .15s;z-index:20
}
.op-av:hover .op-tooltip{opacity:1}

/* Online count — compact badge, mobile only */
.online-n{
  display:none;/* shown on mobile via media query */
  align-items:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--b6);
  background:var(--b0);border:1px solid var(--b2);
  border-radius:var(--r-pill);padding:3px 8px;cursor:default;flex-shrink:0
}

/* ── Demo badge — desktop only ── */
.demo-tag{
  font-size:9px;font-weight:800;letter-spacing:.1em;
  color:var(--wn);background:var(--wn-bg);
  border:1px solid var(--wn-bd);border-radius:var(--rp);
  padding:2px 8px;flex-shrink:0
}

/* ── User menu button ── */
.usr-wrap{position:relative}
.usr-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--b0);border:1px solid var(--b2);border-radius:var(--rp);
  padding:4px 9px 4px 5px;cursor:pointer;transition:all .13s
}
.usr-btn:hover{background:var(--b1);border-color:var(--b4)}
.usr-av{
  width:26px;height:26px;border-radius:50%;
  background:var(--b6);color:#fff;
  font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.usr-name{font-size:12px;font-weight:600;color:var(--b7)}
.usr-arr{font-size:10px;color:var(--txm);margin-left:1px;transition:transform .13s}
.usr-wrap.open .usr-arr{transform:rotate(180deg)}

/* ── User dropdown ── */
.usr-menu{
  position:absolute;top:calc(100% + 6px);right:0;
  background:var(--surf);border:1px solid var(--bd2);
  border-radius:var(--r2);box-shadow:var(--sh3);
  min-width:220px;z-index:300;
  animation:pIn .18s cubic-bezier(.34,1.4,.64,1);overflow:hidden
}
.usr-menu.hi{display:none}
.um-section{padding:6px 0;border-bottom:1px solid var(--bd)}
.um-section:last-child{border-bottom:none}
.um-lbl{
  font-size:10px;font-weight:700;color:var(--txm);
  letter-spacing:.07em;text-transform:uppercase;padding:6px 14px 2px
}
.um-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 14px;font-size:13px;color:var(--tx);
  cursor:pointer;transition:background .1s;text-align:left;width:100%
}
.um-item:hover{background:var(--b0)}
.um-item-ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.um-lang{display:flex;gap:4px;padding:8px 14px}
.um-lbtn{
  flex:1;font-size:12px;font-weight:600;padding:5px 8px;
  border-radius:var(--r1);border:1px solid var(--bd);
  color:var(--txm);text-align:center;cursor:pointer;transition:all .12s
}
.um-lbtn:hover{border-color:var(--b4);color:var(--b6)}
.um-lbtn.on{background:var(--b6);color:#fff;border-color:var(--b6)}
.um-role-sel{
  margin:4px 14px 8px;width:calc(100% - 28px);
  background:var(--bg);border:1px solid var(--bd2);border-radius:var(--r1);
  padding:7px 10px;font-size:12px;color:var(--tx);outline:none
}

/* ── Chef AI Drawer ── */
#cai-overlay{
  position:fixed;inset:0;z-index:400;
  pointer-events:none;display:flex;justify-content:flex-end
}
#cai-overlay.open{pointer-events:all}
.cai-backdrop{
  position:absolute;inset:0;
  background:rgba(30,58,95,.18);
  opacity:0;transition:opacity .22s;cursor:pointer
}
#cai-overlay.open .cai-backdrop{opacity:1}
.cai-drawer{
  position:relative;width:340px;max-width:90vw;height:100%;
  background:rgba(248,252,255,.97);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border-left:1px solid var(--bd2);
  box-shadow:var(--sh3);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .26s cubic-bezier(.34,1.3,.64,1)
}
#cai-overlay.open .cai-drawer{transform:translateX(0)}
.cai-head{
  display:flex;align-items:center;gap:10px;
  padding:16px 18px;border-bottom:1px solid var(--bd);flex-shrink:0
}
.cai-head-av{
  width:36px;height:36px;border-radius:50%;
  background:var(--b6);display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;box-shadow:0 2px 8px rgba(37,99,235,.3)
}
.cai-head-info{flex:1;min-width:0}
.cai-head-name{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:1px}
.cai-head-ctx{
  font-size:11px;color:var(--txm);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.cai-close{
  width:28px;height:28px;border-radius:50%;
  background:var(--bg2);color:var(--txm);font-size:12px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .12s;flex-shrink:0
}
.cai-close:hover{background:var(--er-bg);color:var(--er)}
.cai-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.cai-status-card{
  background:var(--surf-g);border:1px solid var(--b2);
  border-radius:var(--r2);padding:13px 15px
}
.cai-st-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cai-st-dot{
  width:8px;height:8px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px rgba(22,163,74,.2);flex-shrink:0
}
.cai-st-lbl{font-size:13px;font-weight:600;color:var(--tx)}
.cai-st-sub{font-size:12px;color:var(--txm);line-height:1.5}
.cai-msg{display:flex;gap:8px;align-items:flex-start}
.cai-msg-av{
  width:26px;height:26px;border-radius:50%;
  background:var(--b6);display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;margin-top:2px
}
.cai-bubble{
  background:var(--surf);border:1px solid var(--bd);
  border-radius:0 var(--r2) var(--r2) var(--r2);
  padding:10px 13px;font-size:13px;color:var(--tx);
  line-height:1.55;max-width:calc(100% - 38px)
}
.cai-msg.usr{flex-direction:row-reverse}
.cai-msg.usr .cai-bubble{
  background:var(--b6);color:#fff;
  border-radius:var(--r2) 0 var(--r2) var(--r2);border-color:var(--b7)
}
.cai-foot{
  padding:12px 14px;border-top:1px solid var(--bd);flex-shrink:0;
  display:flex;gap:7px;align-items:flex-end
}
.cai-input{
  flex:1;background:var(--bg);border:1px solid var(--bd2);
  border-radius:var(--r2);padding:9px 11px;
  font-size:13px;color:var(--tx);outline:none;resize:none;
  max-height:100px;overflow-y:auto;
  transition:border-color .13s,box-shadow .13s;font-family:var(--ff)
}
.cai-input:focus{border-color:var(--b5);box-shadow:0 0 0 3px rgba(59,130,246,.13)}
.cai-send{
  width:38px;height:38px;border-radius:var(--r2);
  background:var(--b6);color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .12s;flex-shrink:0
}
.cai-send:hover{background:var(--b7);transform:scale(1.05)}
.cai-send:active{transform:scale(.97)}
.cai-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.sug{
  font-size:11px;padding:5px 11px;border-radius:var(--rp);
  border:1px solid var(--b2);background:var(--b0);color:var(--b6);
  cursor:pointer;transition:all .12s;font-weight:500
}
.sug:hover{background:var(--b1);border-color:var(--b4)}

/* ══════════════════════════════════════════════════════════════
   MOBILE OVERRIDES  ≤ 640px
   Goal: [B] Brigade | Search | 🤖 | MZ
   ══════════════════════════════════════════════════════════════ */
@media(max-width:640px){
  /* Topbar padding tighter */
  #topbar{gap:6px;padding:0 10px}

  /* Brand: hide word + subtitle, keep only B mark */
  .t-sub{display:none}
  .t-name{display:none}
  .t-words{display:none}
  .t-brand{gap:0}

  /* Search: narrower pill, flex shrinks */
  .t-search{max-width:none;flex:1;min-width:0;padding:6px 10px;font-size:12px}

  /* Chef AI: icon-only — .cai-text already hidden by .cai-text CSS below */
  .chef-ai-btn{padding:5px 7px}

  /* Online: hide desktop pills, show compact badge */
  .online-pills{display:none}
  .online-n{display:flex}

  /* Demo badge: hide on mobile (footer note is enough) */
  .demo-tag{display:none}

  /* User name: hide text on narrow screens, keep avatar */
  .usr-name{display:none}
  .usr-arr{display:none}
  .usr-btn{padding:3px 3px}

  /* CAI drawer: bottom sheet on mobile */
  #cai-overlay{align-items:flex-end;justify-content:center}
  .cai-drawer{
    width:100%;max-width:100%;
    /* 65% height — half-ish, feels like assistant not full page */
    height:65dvh;
    border-left:none;border-top:1px solid var(--bd2);
    border-radius:var(--r3) var(--r3) 0 0;
    transform:translateY(100%)
  }
  #cai-overlay.open .cai-drawer{transform:translateY(0)}
}

/* cai-text hidden on <640px: already in chef-ai-btn rule, make explicit */
@media(max-width:640px){
  .cai-text{display:none}
}

/* ══ Tablet 641-900px: show online pills, hide demo ══ */
@media(min-width:641px) and (max-width:900px){
  .demo-tag{display:none}
  .t-sub{display:none}
  .online-n{display:none}
}

/* ══ Desktop 901px+: full topbar ══ */
@media(min-width:901px){
  .online-n{display:none}   /* show pills instead */
  .online-pills{display:flex}
}

/* ── END TOPBAR CSS ──────────────────────────────────────────── */
/* ── TAB BAR ─────────────────────────────────────────────────────────────── */
#tabbar{
  flex-shrink:0;height:var(--tbh);
  background:rgba(235,244,255,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bd);
  overflow:hidden;position:relative
}
/* fade right edge so + button has clean space */
#tabbar::after{
  content:'';position:absolute;right:44px;top:0;bottom:0;
  width:28px;background:linear-gradient(to right,transparent,rgba(235,244,255,.9));
  pointer-events:none;z-index:1
}
.tb-inner{
  display:flex;align-items:stretch;height:100%;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;padding:0 4px;gap:2px
}
.tb-inner::-webkit-scrollbar{display:none}

/* individual tab */
.tab{
  display:flex;align-items:center;gap:5px;
  padding:0 11px;min-width:90px;max-width:195px;
  height:100%;flex-shrink:0;
  color:var(--tx2);font-size:13px;
  cursor:pointer;user-select:none;
  border-bottom:2px solid transparent;
  border-radius:var(--r1) var(--r1) 0 0;
  transition:background .13s,color .13s,border-color .13s;
  position:relative;
  -webkit-tap-highlight-color:transparent
}
.tab:hover{background:rgba(255,255,255,.5);color:var(--tx)}
.tab:active{background:rgba(255,255,255,.7)}

/* ACTIVE TAB — more glass, stronger signal */
.tab.on{
  background:rgba(255,255,255,.96);
  color:var(--b9);font-weight:600;
  border-bottom-color:var(--b6);
  box-shadow:
    0 -2px 12px rgba(37,99,235,.08),
    0 1px 0 0 rgba(255,255,255,.95),
    inset 0 1px 0 rgba(255,255,255,1);
  z-index:2
}
.tab-ico{font-size:14px;flex-shrink:0;opacity:.8}
.tab.on .tab-ico{opacity:1}
.tab-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tab-x{
  /* Larger touch target — minimum 28px, visual 18px icon centered */
  flex-shrink:0;width:28px;height:28px;
  border-radius:50%;font-size:10px;
  color:var(--txm);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:all .13s;margin-left:1px;
  -webkit-tap-highlight-color:transparent
}
.tab:hover .tab-x,.tab.on .tab-x{opacity:.65}
.tab-x:hover{opacity:1!important;background:var(--er-bg);color:var(--er)}
/* On mobile: always show close X on active tab (no hover state) */
@media(max-width:640px){
  .tab.on .tab-x{opacity:.55}
  .tab-x:active{opacity:1!important;background:var(--er-bg);color:var(--er)}
}
.tab-plus{
  flex-shrink:0;width:42px;height:100%;
  font-size:21px;font-weight:300;color:var(--txm);
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--r1);
  transition:all .13s;z-index:2;position:relative;
  -webkit-tap-highlight-color:transparent
}
.tab-plus:hover{color:var(--b6);background:rgba(255,255,255,.6)}
.tab-plus:active{color:var(--b6);background:rgba(255,255,255,.8)}

/* ── WORKSPACE ────────────────────────────────────────────────────────────── */
#workspace{
  flex:1;overflow-y:auto;
  padding:24px 28px 52px;
  scroll-behavior:smooth;position:relative;
  /* ensure content is never hidden behind bottom nav/home-bar */
  -webkit-overflow-scrolling:touch
}
@media(max-width:640px){#workspace{padding:14px 14px 48px}}
.pi{width:100%;max-width:1100px;margin:0 auto}

/* ── Shared ───────────────────────────────────────────────────────────────── */
.ph{margin-bottom:28px}
.ph-row{display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:4px}
.ptitle{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.psub{font-size:13px;color:var(--tx2);margin-top:4px}

.sec{
  background:var(--surf-g);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--bd);border-radius:var(--r3);
  padding:22px 24px;margin-bottom:14px;box-shadow:var(--shg)
}
.sec-h{font-size:11px;font-weight:700;color:var(--txm);
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:16px}

.note{display:flex;align-items:center;gap:7px;
  font-size:11px;color:var(--txm);padding:6px 0}
.nd{width:5px;height:5px;border-radius:50%;background:var(--wn);flex-shrink:0}

/* Badge */
.bdg{display:inline-flex;align-items:center;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:var(--rp);white-space:nowrap}
.b-ok  {background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.b-wn  {background:var(--wn-bg);color:var(--wn);border:1px solid var(--wn-bd)}
.b-er  {background:var(--er-bg);color:var(--er);border:1px solid var(--er-bd)}
.b-in  {background:var(--in-bg);color:var(--in);border:1px solid var(--in-bd)}

/* Buttons */
.btnp{background:var(--b6);color:#fff;font-size:13px;font-weight:600;
  padding:9px 18px;border-radius:var(--r2);transition:all .12s;white-space:nowrap}
.btnp:hover{background:var(--b7);transform:translateY(-1px);box-shadow:var(--sh2)}
.btnp:active{transform:none;box-shadow:none}
.btns{background:var(--surf-r);color:var(--tx2);font-size:13px;font-weight:500;
  padding:9px 16px;border-radius:var(--r2);border:1px solid var(--bd);transition:all .12s}
.btns:hover{background:var(--b1);color:var(--b6)}

/* ════ HOME ═══════════════════════════════════════════════════════════════ */
.greet{margin-bottom:24px}
.greet-ey{font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--txm);margin-bottom:9px}
.greet-h{font-size:33px;font-weight:700;color:var(--b9);
  letter-spacing:-.04em;line-height:1.12}
.greet-s{font-size:15px;color:var(--tx2);margin-top:6px}

.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
@media(max-width:920px){.hgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.hgrid{grid-template-columns:1fr}}

.hcard{
  display:flex;flex-direction:column;
  background:var(--surf-g);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--bd);border-radius:var(--r3);
  text-align:left;cursor:pointer;overflow:hidden;
  box-shadow:var(--shg);
  transition:transform .22s cubic-bezier(.34,1.3,.64,1),
             box-shadow .22s,border-color .22s
}
.hcard:hover{transform:translateY(-3px);box-shadow:var(--sh3);border-color:var(--b4)}
.hcard:active{transform:translateY(0);box-shadow:var(--sh1)}

.hcard-top{padding:16px 18px 10px;display:flex;align-items:flex-start;justify-content:space-between}
.hcard-ico{font-size:26px;width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;
  background:var(--b0);border:1px solid var(--b1);border-radius:var(--r2)}
.hcard-arr{font-size:17px;color:var(--txm);transition:transform .15s,color .15s}
.hcard:hover .hcard-arr{transform:translate(2px,-2px);color:var(--b5)}
.hcard-body{padding:0 18px 14px;flex:1}
.hcard-title{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:4px}
.hcard-desc{font-size:12px;color:var(--txm);line-height:1.5}
.hcard-foot{
  border-top:1px solid var(--bd);padding:8px 18px;
  font-size:11px;font-weight:500;color:var(--txm);
  display:flex;align-items:center;gap:6px;
  background:rgba(239,246,255,.38)
}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.s-ok{background:var(--ok)}.s-wn{background:var(--wn)}.s-in{background:var(--in)}

/* ════ BOTS ═══════════════════════════════════════════════════════════════ */
.pipelist{display:flex;flex-direction:column;gap:8px}

/* Bot Center v006 — operativo layout */
.bc-header{
  background:var(--surf-g);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--bd);border-radius:var(--r3);
  padding:18px 22px;margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;box-shadow:var(--shg)
}
.bc-status{display:flex;align-items:center;gap:10px}
.bc-status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.bc-live-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0;display:inline-block;margin-right:5px}
.bc-status-dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.bc-status-dot.warn{background:var(--wn);box-shadow:0 0 0 3px var(--wn-bg)}
.bc-status-dot.err{background:var(--er);box-shadow:0 0 0 3px var(--er-bg)}
.bc-status-label{font-size:15px;font-weight:700;color:var(--tx)}
.bc-times{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.bc-time-row{font-size:11px;color:var(--txm)}
.bc-time-val{font-weight:600;color:var(--tx2)}

.bc-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}

.bc-card{
  background:var(--surf-g);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--bd);border-radius:var(--r2);
  overflow:hidden;transition:border-color .15s,box-shadow .15s
}
.bc-card:has(.bc-details[open]){border-color:var(--b2);box-shadow:0 0 0 3px rgba(37,99,235,.08),var(--sh1)}

.bc-card-main{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;gap:0;
  padding:10px 14px;cursor:pointer;
  -webkit-tap-highlight-color:transparent
}
.bc-card-main:hover{background:rgba(239,246,255,.4)}

.bc-card-num{
  width:26px;height:26px;border-radius:50%;
  background:var(--b1);color:var(--b7);
  font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-right:10px
}
.bc-card-num.cat-pos{background:var(--b1);color:var(--b7)}
.bc-card-num.cat-deduction{background:#ede9fe;color:#6d28d9}
.bc-card-num.cat-prep{background:#d1fae5;color:#065f46}
.bc-card-num.cat-ai{background:#fef3c7;color:#92400e}

.bc-card-body{min-width:0}
.bc-card-name{font-size:13px;font-weight:600;color:var(--tx);
  white-space:normal;overflow:visible;line-height:1.35;margin-bottom:2px}
.bc-card-meta{font-size:11px;color:var(--txm);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bc-meta-sep{color:var(--bd2)}

.bc-card-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;margin-left:10px}

.bc-details{border:none;background:none}
.bc-details summary{display:none}  /* trigger is bc-card-main via JS */
.bc-detail-body{
  padding:0 16px 14px;
  border-top:1px solid var(--bd);
  margin-top:2px
}
.bc-detail-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin:12px 0 10px
}
@media(max-width:560px){.bc-detail-grid{grid-template-columns:1fr}}
.bc-detail-cell{background:var(--bg);border-radius:var(--r2);padding:10px 12px}
.bc-detail-lbl{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--txm);margin-bottom:4px}
.bc-detail-val{font-size:12px;color:var(--tx);line-height:1.45}
.bc-next{
  margin-top:8px;padding:8px 12px;
  background:var(--b0);border:1px solid var(--b2);border-radius:var(--r2);
  font-size:11px;color:var(--b7);line-height:1.45
}
.bc-next::before{content:'→ ';font-weight:700}
.bc-cat-pill{
  display:inline-flex;align-items:center;
  font-size:10px;font-weight:600;letter-spacing:.04em;
  padding:2px 7px;border-radius:999px;
  background:var(--b1);color:var(--b7)
}
.bc-cat-pill.cat-deduction{background:#ede9fe;color:#6d28d9}
.bc-cat-pill.cat-prep{background:#d1fae5;color:#065f46}
.bc-cat-pill.cat-ai{background:#fef3c7;color:#92400e}
.bc-warn-pill{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:999px;
  background:var(--wn-bg);color:var(--wn);
  border:1px solid var(--wn-bd);
  white-space:nowrap
}
/* ── Page placeholder (Sales, future pages not yet implemented) ── */
.pg-placeholder{display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:32px 24px 40px;text-align:center;gap:8px}
.pgp-ico{font-size:44px;line-height:1;margin-bottom:2px}
.pgp-title{font-size:22px;font-weight:800;color:var(--tx);letter-spacing:-.02em}
.pgp-sub{font-size:13px;color:var(--tx2);margin-bottom:2px}
.pgp-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 14px}
.pgp-chip{font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;
  background:var(--bg2);border:1px solid var(--bd2);color:var(--tx2);
  line-height:1.3}
.pgp-note{font-size:12px;color:var(--tx2);max-width:300px;
  line-height:1.55;opacity:.7}
.pitem{display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:var(--surf-r);
  border:1px solid var(--bd);border-radius:var(--r2)}
.pstep{width:26px;height:26px;border-radius:50%;
  background:var(--b1);color:var(--b7);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pbody{flex:1;min-width:0}
.pname{display:block;font-size:13px;font-weight:500;
  color:var(--tx);font-family:var(--fm);margin-bottom:1px}
.pmeta{font-size:11px;color:var(--txm)}

.obslist{display:flex;flex-direction:column;gap:8px}
.obs{display:flex;align-items:flex-start;gap:10px;
  padding:11px 14px;border-radius:var(--r2);
  border:1px solid var(--bd);background:var(--surf-r);
  font-size:13px;line-height:1.5}
.obs-wn{border-color:var(--wn-bd);background:var(--wn-bg)}
.obs-in{border-color:var(--in-bd);background:var(--in-bg)}

/* ════ RECIPE v010 — chef's workbench ═══════════════════════════════════ */

/* ── Driver block: the one number the chef touches ── */
.r-driver{
  background:var(--surf-g);backdrop-filter:blur(10px);
  border:1.5px solid var(--bd2);border-radius:var(--r3);
  padding:20px 22px 18px;margin-bottom:18px}
.r-driver-lbl{
  font-size:11px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.r-driver-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.r-driver-num{
  font-size:42px;font-weight:800;color:var(--tx);
  font-family:var(--fm);line-height:1;cursor:pointer;
  border-bottom:2px dashed transparent;transition:border-color .15s;
  -webkit-tap-highlight-color:transparent}
.r-driver-num:hover{border-bottom-color:var(--bd2)}
.r-driver-num.editing{border-bottom-color:var(--b6)}
.r-driver-input{
  font-size:42px;font-weight:800;color:var(--b6);
  font-family:var(--fm);line-height:1;
  width:3ch;min-width:60px;max-width:160px;
  border:none;border-bottom:2px solid var(--b6);
  background:transparent;outline:none;
  -webkit-appearance:none;appearance:none;padding:0;
  -moz-appearance:textfield}
.r-driver-input::-webkit-inner-spin-button,
.r-driver-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.r-driver-unit{font-size:20px;font-weight:600;color:var(--tx2)}
.r-driver-hint{
  font-size:12px;color:var(--txm);margin-top:8px;line-height:1.5}
.r-driver-hint.visible{display:block}
.r-driver-hint{display:none}

/* ── Meta strip: shelf life + last production ── */
.r-meta{
  display:flex;gap:0;flex-wrap:wrap;
  border:1px solid var(--bd);border-radius:var(--r2);
  overflow:hidden;margin-bottom:20px}
.r-meta-item{
  flex:1;min-width:120px;
  padding:11px 16px;
  border-right:1px solid var(--bd)}
.r-meta-item:last-child{border-right:none}
.r-meta-lbl{
  font-size:11px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.r-meta-val{font-size:14px;font-weight:600;color:var(--tx)}

/* ── Section headers ── */
.r-sec-hd{
  font-size:11px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.06em;
  padding-bottom:10px;border-bottom:1px solid var(--bd);
  margin-bottom:0}

/* ── BOM list ── */
.r-bom{display:flex;flex-direction:column;margin-bottom:24px}
.r-brow{
  display:grid;grid-template-columns:1fr auto;gap:14px;
  padding:11px 2px;border-bottom:1px solid var(--bd);
  align-items:center}
.r-brow:last-child{border-bottom:none}
.r-bitem{font-size:15px;color:var(--tx)}
.r-bqty{
  font-size:15px;font-weight:700;
  font-family:var(--fm);color:var(--b6);white-space:nowrap}

/* Sub-recipe (derived ingredients) */
.r-sub-toggle{
  display:flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--tx2);
  cursor:pointer;padding:11px 2px;
  border-top:1px solid var(--bd);
  -webkit-tap-highlight-color:transparent}
.r-sub-toggle svg{transition:transform .2s;flex-shrink:0}
.r-sub-toggle.open svg{transform:rotate(90deg)}
.r-sub-body{display:none}
.r-sub-body.open{display:block}

/* ── Constraining ingredient notice ── */
.r-constraint{
  margin-top:10px;padding:10px 14px;
  background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.22);
  border-radius:12px;font-size:13px;color:var(--tx);line-height:1.55;
  display:none}
.r-constraint.visible{display:block}

/* ── Steps list ── */
.r-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.r-step{
  display:flex;align-items:flex-start;gap:14px;
  font-size:15px;line-height:1.6;color:var(--tx);
  padding:14px 16px;
  background:var(--surf-g);border:1px solid var(--bd);border-radius:var(--r2)}
.r-snum{
  width:26px;height:26px;border-radius:50%;
  background:var(--b6);color:#fff;
  font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:2px}

/* ── History placeholder ── */
.r-hist{
  padding:40px 16px;text-align:center;
  color:var(--txm);font-size:14px;line-height:1.6}
.r-hist-ico{font-size:30px;margin-bottom:12px}

/* ── Panel visibility ── */
.r-panel-hide{display:none}

/* ════ INVENTORY ════════════════════════════════════════════════════════ */
.istats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
@media(max-width:560px){.istats{grid-template-columns:1fr 1fr}}
.istat{background:var(--surf-g);backdrop-filter:blur(10px);
  border:1px solid var(--bd);border-radius:var(--r2);
  padding:16px 18px;box-shadow:var(--shg)}
.ilbl{font-size:10px;color:var(--txm);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:5px;display:block}
.ival{font-size:20px;font-weight:700;color:var(--tx)}
.v-ok{color:var(--ok)}.v-er{color:var(--er);font-size:13px!important}

.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:90px 62px 1fr;
  align-items:center;gap:12px;
  padding:10px 14px;background:var(--surf-r);
  border:1px solid var(--bd);border-radius:var(--r2);font-size:13px}
@media(max-width:480px){.mrow{grid-template-columns:70px 52px 1fr;gap:8px}}
.md{font-size:11px;color:var(--txm);font-family:var(--fm)}
.mq{font-weight:700;font-family:var(--fm)}
.qp{color:var(--ok)}.qn{color:var(--er)}
.mm{display:flex;flex-direction:column;gap:1px;min-width:0}
.ms{font-weight:500;font-size:13px;color:var(--tx)}
.mn{font-size:11px;color:var(--txm)}

/* ════ JOURNAL ══════════════════════════════════════════════════════════ */
.frow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-size:12px;font-weight:500;padding:5px 13px;
  border-radius:var(--rp);border:1px solid var(--bd);
  color:var(--tx2);background:var(--surf-r);cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--b4);color:var(--b6)}
.chip.on{background:var(--b6);color:#fff;border-color:var(--b6)}

/* v008 — entry cards */
.jent{
  background:var(--surf-g);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--bd);border-radius:var(--r2);
  border-left:3px solid var(--bd);
  padding:11px 14px;
  margin-bottom:8px;transition:box-shadow .13s,border-color .13s;
  -webkit-tap-highlight-color:transparent
}
.jent:hover{box-shadow:var(--sh1)}
.jent.sv-ok{border-left-color:var(--ok)}
.jent.sv-wn{border-left-color:var(--wn)}
.jent.sv-er{border-left-color:var(--er)}
/* top row: time + cat pill + author */
.jmeta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:nowrap;overflow:hidden}
.jtime{font-size:11px;color:var(--txm);font-family:var(--fm);white-space:nowrap;flex-shrink:0}
.jdot{font-size:9px;color:var(--bd2);flex-shrink:0}
.jcat-pill{
  font-size:10px;font-weight:700;letter-spacing:.04em;white-space:nowrap;
  padding:2px 7px;border-radius:var(--rp);
  background:var(--b0);border:1px solid var(--b2);color:var(--b6);flex-shrink:0
}
.jvis{
  font-size:10px;color:var(--txm);background:rgba(37,99,235,.07);
  padding:2px 6px;border-radius:var(--rp);white-space:nowrap;flex-shrink:0
}
.jauth{font-size:11px;color:var(--txm);margin-left:auto;white-space:nowrap;flex-shrink:0}
/* title + body */
.jtit{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:3px;line-height:1.3}
.jbod{font-size:12px;color:var(--tx2);line-height:1.5;margin:0}

/* ════ MODAL ════════════════════════════════════════════════════════════ */
.mbk{
  position:absolute;inset:0;
  background:rgba(30,58,95,.3);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:200;min-height:240px
}
.mbk.hi{display:none}
@media(min-width:600px){.mbk{align-items:center;padding:24px}}
.msh{background:var(--surf);border-radius:var(--r3) var(--r3) 0 0;
  width:100%;max-width:520px;box-shadow:var(--sh3);
  animation:sUp .26s cubic-bezier(.34,1.45,.64,1)}
@media(min-width:600px){.msh{border-radius:var(--r3);animation:pIn .22s cubic-bezier(.34,1.45,.64,1)}}
@keyframes sUp{from{transform:translateY(56px);opacity:0}to{transform:none;opacity:1}}
@keyframes pIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.mhd{display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px 14px;border-bottom:1px solid var(--bd)}
.mt{font-size:16px;font-weight:600}
.mx{width:28px;height:28px;border-radius:50%;
  background:var(--bg2);color:var(--txm);font-size:12px;
  display:flex;align-items:center;justify-content:center;transition:all .12s}
.mx:hover{background:var(--er-bg);color:var(--er)}
.mbody{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;
  padding:14px 22px 22px;border-top:1px solid var(--bd)}
.flbl{font-size:11px;font-weight:700;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.fin{width:100%;background:var(--bg);border:1px solid var(--bd2);
  border-radius:var(--r1);padding:9px 12px;font-size:13px;color:var(--tx);
  outline:none;transition:border-color .13s,box-shadow .13s}
.fin:focus{border-color:var(--b5);box-shadow:0 0 0 3px rgba(59,130,246,.14)}
.fta{resize:vertical;min-height:80px}

/* ════ YES CHEF ═════════════════════════════════════════════════════════ */
#ycs{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  z-index:300;pointer-events:none;opacity:0;transition:opacity .2s
}
#ycs.on{pointer-events:all;opacity:1}
.yb{position:absolute;inset:0;background:rgba(30,58,95,.42);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.yc{
  position:relative;background:var(--surf);border-radius:var(--r3);
  width:88%;max-width:360px;
  padding:46px 36px 50px;text-align:center;box-shadow:var(--sh3);
  transform:scale(.86) translateY(18px);
  transition:transform .3s cubic-bezier(.34,1.5,.64,1)
}
#ycs.on .yc{transform:scale(1) translateY(0)}
.yi{font-size:54px;margin-bottom:14px}
.yh{font-size:25px;font-weight:700;color:var(--tx);margin-bottom:10px}
.ym{font-size:14px;color:var(--tx2);margin-bottom:28px;line-height:1.55}

/* ════ JOURNAL PAGE ══════════════════════════════════════════════════════ */
.j-page{display:flex;flex-direction:column;gap:0}

/* Day section headers */
.j-day-hd{
  display:flex;align-items:center;gap:10px;
  padding:4px 0 8px;margin-top:8px
}
.j-day-lbl{
  font-size:11px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.07em;white-space:nowrap
}
.j-day-count{
  font-size:10px;font-weight:600;color:var(--txm);
  background:rgba(37,99,235,.07);padding:1px 6px;
  border-radius:999px;border:1px solid var(--bd);white-space:nowrap
}
.j-day-line{flex:1;height:1px;background:var(--bd)}

/* Entry cards */
.jent{
  background:var(--surf-g);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--bd);border-radius:var(--r2);
  padding:14px 18px;margin-bottom:10px;
  transition:box-shadow .13s;cursor:default
}
.jent:hover{box-shadow:var(--sh2)}
.jent.sv-ok{border-left:3px solid var(--ok)}
.jent.sv-wn{border-left:3px solid var(--wn)}
.jent.sv-er{border-left:3px solid var(--er)}
.jmeta{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.jtime{font-size:11px;color:var(--txm);font-family:var(--fm)}
.jdot{font-size:9px;color:var(--bd2)}
.jcat-pill{
  font-size:10px;font-weight:700;letter-spacing:.05em;
  padding:2px 8px;border-radius:var(--rp);
  background:var(--b0);border:1px solid var(--b2);color:var(--b6)
}
.jvis{font-size:10px;color:var(--txm);background:rgba(37,99,235,.07);
  padding:2px 7px;border-radius:var(--rp)}
.jauth{font-size:11px;color:var(--txm);margin-left:auto}
.jtit{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:4px;line-height:1.3}
.jbod{font-size:13px;color:var(--tx2);line-height:1.55}

/* Inline add-entry form panel — v008 glass */
.j-form-panel{
  background:var(--surf-g);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--b2);border-radius:var(--r3);
  padding:18px 20px;margin-bottom:14px;
  box-shadow:var(--sh2);
  animation:slideDown .2s cubic-bezier(.34,1.3,.64,1)
}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.j-form-title{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:16px}
.j-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.j-form-grid{grid-template-columns:1fr}}
.j-form-row{display:flex;flex-direction:column;gap:4px}
.j-form-row.full{grid-column:1/-1}
.flbl2{font-size:11px;font-weight:600;color:var(--tx2);
  letter-spacing:.04em;text-transform:uppercase}
.fin2{background:var(--bg);border:1px solid var(--bd2);
  border-radius:var(--r1);padding:8px 11px;
  font-size:13px;color:var(--tx);outline:none;
  transition:border-color .13s,box-shadow .13s;width:100%}
.fin2:focus{border-color:var(--b5);box-shadow:0 0 0 3px rgba(59,130,246,.13)}
.fta2{resize:vertical;min-height:72px}
.j-form-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--bd)}

/* Filter bar */
.j-filter-bar{
  display:flex;align-items:center;gap:6px;
  flex-wrap:wrap;margin-bottom:16px
}
.j-filter-lbl{font-size:11px;font-weight:600;color:var(--txm);
  text-transform:uppercase;letter-spacing:.05em;margin-right:2px}

/* Header row */
.j-hrow{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;margin-bottom:6px
}
.j-date-str{font-size:13px;color:var(--tx2)}

/* Empty state */
.j-empty{
  text-align:center;padding:52px 20px;color:var(--txm);
  font-size:14px;border:1px dashed var(--bd2);
  border-radius:var(--r2);margin-top:8px
}
.j-empty-ico{font-size:36px;margin-bottom:10px}


/* ── SEARCH ──────────────────────────────────────────────────────────────── */
/* Override static .t-search from topbar block with input-capable version */
.t-search{position:relative}
.t-search-ico{opacity:.5;font-size:14px;flex-shrink:0;color:var(--txm)}
.t-search-input{
  flex:1;border:none;outline:none;background:transparent;
  font-size:13px;color:var(--tx);font-family:var(--ff);
  min-width:0;padding:0
}
.t-search-input::placeholder{color:var(--txm)}
.t-search-clear{
  font-size:11px;color:var(--txm);cursor:pointer;
  /* Larger touch target on mobile */
  width:24px;height:24px;border-radius:50%;
  background:var(--bg2);display:none;
  align-items:center;justify-content:center;flex-shrink:0;
  transition:all .12s;
  -webkit-tap-highlight-color:transparent
}
.t-search-clear:hover{background:var(--er-bg);color:var(--er)}
.t-search-clear:active{background:var(--er-bg);color:var(--er)}
.t-search-clear.vis{display:flex}
.t-search.focused{
  border-color:var(--b5);
  box-shadow:0 0 0 3px rgba(59,130,246,.15);
  max-width:360px;
  background:var(--surf)
}
/* Dropdown */
.search-drop{
  position:absolute;top:calc(100% + 7px);left:0;right:0;
  background:var(--surf);border:1px solid var(--bd2);
  border-radius:var(--r2);box-shadow:var(--sh3);
  z-index:500;overflow:hidden;
  animation:pIn .15s cubic-bezier(.34,1.4,.64,1)
}
.search-drop.hi{display:none}
.search-result{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;cursor:pointer;transition:background .1s;
  -webkit-tap-highlight-color:transparent
}
.search-result:hover{background:var(--b0)}
.search-result:active{background:var(--b1)}
.search-result+.search-result{border-top:1px solid var(--bd)}
.sr-ico{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.sr-body{flex:1;min-width:0}
.sr-title{font-size:13px;font-weight:600;color:var(--tx)}
.sr-sub{font-size:11px;color:var(--txm)}
.sr-action{font-size:11px;color:var(--b6);font-weight:500;flex-shrink:0}
.search-empty{
  padding:16px 14px;font-size:13px;color:var(--txm);text-align:center
}
@media(max-width:640px){
  .t-search{padding:6px 10px}
  .t-search.focused{max-width:none}
  .t-search-input{font-size:12px}
}

</style>

/* ══ TAB MANAGER ══════════════════════════════════════════════════════════ */
/*
  Singleton tabs (one per type): home, bot_center, daily_journal
  Entity tabs (keyed by id):     recipe:X, inventory:X
  Clicking a card that is already open → activates existing tab (no duplicate)
*/
let TABS=[], AID=null;

function _tabKey(type, params){
  if(type==='home')         return 'home';
  if(type==='bot_center')   return 'bot_center';
  if(type==='daily_journal') return 'daily_journal';
  /* entity types: keyed by id or name */
  return type + ':' + (params.id || params.name || '');
}

function openTab(type, params){
  params = params || {};
  const key = _tabKey(type, params);
  const existing = TABS.find(function(x){ return _tabKey(x.type,x.params)===key; });
  if(existing){
    /* save current scroll before switching */
    _saveScroll();
    AID = existing.id;
    _persist();
    renderAll();
    return existing.id;
  }
  /* evict oldest non-home if at limit */
  if(TABS.length >= 10){
    var old = TABS.find(function(x){ return x.type!=='home'; });
    if(old) TABS.splice(TABS.indexOf(old),1);
  }
  _saveScroll();
  var id = 't' + Date.now();
  var title = _tabTitle(type, params);
  TABS.push({id:id, type:type, title:title, params:params, scroll:0});
  AID = id;
  _persist();
  renderAll();
  return id;
}

function closeTab(id){
  var i = TABS.findIndex(function(x){ return x.id===id; });
  if(i<0) return;
  /* debounce: ignore rapid double-tap on mobile */
  var now = Date.now();
  var tab = TABS[i];
  if(tab._closing) return;
  tab._closing = true;
  if(AID===id){
    /* prefer tab to the right, then left */
    var next = TABS[i+1] || null;
    var prev = i>0 ? TABS[i-1] : null;
    var fallback = next || prev || null;
    AID = fallback ? fallback.id : null;
  }
  TABS.splice(i,1);
  /* if no tabs remain, open Home */
  if(TABS.length===0){
    _persist();
    openTab('home',{});
    return;
  }
  /* if AID points to nothing (shouldn't happen but guard), go to first */
  if(AID && !TABS.find(function(x){ return x.id===AID; })){
    AID = TABS[0].id;
  }
  _persist();
  renderAll();
}

function activateTab(id){
  if(!TABS.find(function(x){ return x.id===id; })) return;
  _saveScroll();
  AID = id;
  _persist();
  renderAll();
}

function _saveScroll(){
  var cur = TABS.find(function(x){ return x.id===AID; });
  if(cur){
    var ws = document.getElementById('workspace');
    if(ws) cur.scroll = ws.scrollTop;
  }
}

function _tabTitle(type, p){
  if(type==='home')          return t('th');
  if(type==='bot_center')    return t('tb');
  if(type==='daily_journal') return t('tj_short');
  if(type==='recipe')        return t('tr',{n:p.name||''});
  if(type==='inventory')     return t('ti',{n:p.name||''});
  if(type==='pos')           return t('tp');
  return type;
}

function _persist(){
  try{
    sessionStorage.setItem('ws_tabs', JSON.stringify(TABS));
    sessionStorage.setItem('ws_aid', AID||'');
  }catch(e){}
}

function _restoreTabs(){
  try{
    var raw = sessionStorage.getItem('ws_tabs');
    var aid = sessionStorage.getItem('ws_aid') || null;
    var parsed = raw ? JSON.parse(raw) : [];
    /* validate: must be array, every item must have id/type/title */
    if(!Array.isArray(parsed)) throw new Error('not array');
    parsed.forEach(function(t){ if(!t.id||!t.type||!t.title) throw new Error('corrupt tab'); });
    TABS = parsed;
    AID  = aid;
    if(AID && !TABS.find(function(x){ return x.id===AID; })){
      AID = TABS.length ? TABS[0].id : null;
    }
  }catch(e){
    /* corrupted storage — clean slate */
    try{ sessionStorage.removeItem('ws_tabs'); sessionStorage.removeItem('ws_aid'); }catch(e2){}
    TABS=[]; AID=null;
  }
}

/* status in DB → internal status code */
function _mapStatus(s){
  if(s==='success') return 'ok';
  if(s==='warning') return 'warn';
  if(s==='running') return 'running';
  if(s==='error'||s==='failed') return 'error';
  return 'idle';
}

/* Convert UTC ISO string → CDT time string "HH:MM CDT" */
function _toCDT(iso){
  if(!iso) return '—';
  try{
    var d = new Date(iso);
    /* CDT = UTC-5 (summer: UTC-5 when DST active, else UTC-6; we use fixed -5 for CDT display) */
    var cdt = new Date(d.getTime() - 5*60*60*1000);
    var h = cdt.getUTCHours(), m = cdt.getUTCMinutes();
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+' CDT';
  }catch(e){ return '—'; }
}

/* Duration: seconds → human "Xs" or "Xm Ys" */
function _dur(started, finished){
  if(!started||!finished) return '—';
  try{
    var secs = Math.round((new Date(finished) - new Date(started))/1000);
    if(secs<60) return secs+'s';
    return Math.floor(secs/60)+'m '+(secs%60)+'s';
  }catch(e){ return '—'; }
}

function botsAfterRender(){
  var ws = document.getElementById('workspace');

  /* ── 1. Wire expand/collapse (always, regardless of live data) ── */
  ws.querySelectorAll('.bc-card').forEach(function(card){
    var main = card.querySelector('.bc-card-main');
    var det  = card.querySelector('.bc-details');
    if(!main || !det) return;
    main.addEventListener('click', function(){
      if(det.open) det.removeAttribute('open');
      else         det.setAttribute('open','');
    });
    main.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); main.click(); }
    });
  });

  /* ── 2. Fetch live bot_runs from Supabase (read-only, anon) ── */
  /* Query: last run per nightly bot, ordered by bot_name + started_at DESC   */
  var botNames = Object.keys(NIGHTLY_BOT_MAP);
  var inClause = botNames.map(function(n){ return '"'+n+'"'; }).join(',');
  var q = SUPABASE_URL
    + '/rest/v1/bot_runs'
    + '?select=bot_name,status,started_at,finished_at,rows_written,warnings_count,errors_count,summary'
    + '&bot_name=in.(' + botNames.join(',') + ')'
    + '&order=bot_name.asc,started_at.desc';

  fetch(q, {
    headers:{
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Accept': 'application/json',
      'Prefer': 'return=representation'
    }
  })
  .then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  })
  .then(function(rows){
    /* Keep only the most recent run per bot_name */
    var latest = {};
    rows.forEach(function(row){
      if(!latest[row.bot_name]) latest[row.bot_name] = row;
    });

    /* Patch each card */
    botNames.forEach(function(dbName){
      var cardId = NIGHTLY_BOT_MAP[dbName];
      var card   = ws.querySelector('[data-botid="'+cardId+'"]');
      if(!card) return;

      var row = latest[dbName];
      var s   = row ? _mapStatus(row.status) : 'idle';
      var sKey = s==='ok'?'bok': s==='warn'?'bwn': s==='error'?'ber': s==='idle'?'bidle':'bpd';
      var sCls = s==='ok'?'b-ok': s==='warn'?'b-wn': s==='error'?'b-er':'b-in';

      /* Update badge */
      var badge = card.querySelector('.bdg');
      if(badge){ badge.className='bdg '+sCls; badge.textContent=t(sKey); }

      /* Update meta line */
      var meta = card.querySelector('.bc-card-meta');
      if(meta && row){
        var time = _toCDT(row.started_at);
        var dur  = _dur(row.started_at, row.finished_at);
        var rows = (row.rows_written||0);
        var warnPill = row.warnings_count>0
          ? '<span class="bc-warn-pill">⚠️ '+row.warnings_count+'</span>'
          : '';
        meta.innerHTML = '<span>'
          + time + ' · ' + dur + ' · ' + rows + ' ' + t('brows')
          + '</span>'
          + (warnPill ? ' ' + warnPill : '');
      } else if(meta && !row){
        meta.textContent = t('bidle');
      }

      /* Update detail — input/output cells */
      var cells = card.querySelectorAll('.bc-detail-val');
      if(cells.length>=2 && row){
        cells[0].textContent = (row.rows_written||0) + ' rows read → written';
        cells[1].textContent = row.summary
          ? row.summary.slice(0,120)+(row.summary.length>120?'…':'')
          : '—';
      }
    });

    /* ── 3. Patch header status ── */
    var statuses = botNames.map(function(n){
      var r=latest[n]; return r?_mapStatus(r.status):'idle';
    });
    var anyErr  = statuses.some(function(s){ return s==='error'; });
    var anyWarn = statuses.some(function(s){ return s==='warn'; });
    var allIdle = statuses.every(function(s){ return s==='idle'; });
    var hCls    = anyErr?'err': anyWarn?'warn': allIdle?'idle':'ok';
    var hKey    = anyErr?'bstatus_err': anyWarn?'bstatus_warn': allIdle?'bstatus_idle':'bstatus_ok';

    var dot = ws.querySelector('.bc-status-dot');
    var lbl = ws.querySelector('.bc-status-label');
    if(dot){ dot.className='bc-status-dot '+hCls; }
    if(lbl){ lbl.textContent=t(hKey); }

    /* Last run time */
    var allRows = botNames.map(function(n){ return latest[n]; }).filter(Boolean);
    if(allRows.length){
      var lastRow = allRows.sort(function(a,b){
        return new Date(b.started_at)-new Date(a.started_at);
      })[0];
      var timeEl = ws.querySelector('.bc-times .bc-time-val');
      if(timeEl) timeEl.textContent = _toCDT(lastRow.started_at);
    }

    /* ── 4. Patch observations from summaries ── */
    _patchObservations(ws, latest);

    /* ── 5. Remove demo note, show live indicator ── */
    var noteEl = ws.querySelector('.note');
    if(noteEl){
      noteEl.innerHTML='<span class="bc-live-dot"></span>'
        +'<span style="font-size:11px;color:var(--ok)">'+t('blive')+'</span>'
        +'<span style="font-size:10px;color:var(--txm);margin-left:8px">'+SHELL_VERSION+'</span>';
    }
  })
  .catch(function(err){
    /* Graceful fallback — mock stays, soft note */
    console.warn('[v007] bot_runs fetch failed:', err);
    var noteEl = ws.querySelector('.note');
    if(noteEl){
      noteEl.innerHTML='<span class="nd"></span>'
        +'<span style="font-size:11px;color:var(--txm)">'
        +t('blive_fail')+'</span>'
        +'<span style="font-size:10px;color:var(--txm);margin-left:8px">'+SHELL_VERSION+'</span>';
    }
  });
}

function _patchObservations(ws, latest){
  /* Build obs from real summaries where available, fallback to mock */
  var obsList = ws.querySelector('.obslist');
  if(!obsList) return;

  var liveObs = [];
  Object.keys(latest).forEach(function(dbName){
    var row = latest[dbName];
    if(!row) return;
    if(row.warnings_count>0){
      liveObs.push({tp:'wn', text:row.summary ? row.summary.slice(0,140) : dbName+': '+row.warnings_count+' warnings'});
    }
    if(row.errors_count>0){
      liveObs.push({tp:'er', text:dbName+': '+row.errors_count+' error(s)'});
    }
  });

  /* Always add a pipeline-ok line if all good */
  var anyIssue = liveObs.length>0;
  if(!anyIssue){
    liveObs.push({tp:'ok', text:t('bobs_allok')});
  }

  var obsIco = {ok:'✅',wn:'⚠️',er:'🔴','in':'ℹ️'};
  obsList.innerHTML = liveObs.map(function(o){
    return '<div class="obs obs-'+(o.tp==='er'?'er':o.tp==='ok'?'in':o.tp)+'">'
      +'<span style="flex-shrink:0">'+(obsIco[o.tp]||'ℹ️')+'</span>'
      +'<span>'+o.text+'</span>'
      +'</div>';
  }).join('');
}

/* ── Quantity formatting ── */
function _qty(v, u, isPiece){
  if(isPiece) return Math.round(v) + ' pz';
  if(u === 'g'  && v >= 1000) return +(v/1000).toFixed(1) + ' kg';
  if(u === 'ml' && v >= 1000) return +(v/1000).toFixed(1) + ' L';
  return (Number.isInteger(v) ? v : +v.toFixed(1)) + u;
}

/* ── Current driver quantity (in-memory state) ── */
var _driverQty = RECIPE.driver_base;  /* chef's target */

/* ── Compute factor ── */
function _factor(){ return _driverQty / RECIPE.driver_base; }

/* ── Update all live BOM cells without full re-render ── */
function _updateBOM(){
  var ws  = document.getElementById('workspace');
  if(!ws) return;
  var fac = _factor();
  RECIPE.bom.forEach(function(item){
    var el = ws.querySelector('[data-bi="'+item.i+'"]');
    if(el) el.textContent = _qty(item.v * fac, item.u, item.p);
  });
  RECIPE.sub_bom.forEach(function(item){
    var el = ws.querySelector('[data-si="'+item.i+'"]');
    if(el) el.textContent = _qty(item.v * fac, item.u, item.p);
  });
  /* Update page subtitle */
  var sub = ws.querySelector('#r-subtitle');
  if(sub) sub.textContent = t('r_produces', {n: _driverQty, u: RECIPE.driver_unit});
}

/* ── Render ── */
function pageRecipe(){
  RECIPE.steps = RECIPE.steps || STEPS;
  var fac = _factor();

  /* BOM rows */
  var bomRows = RECIPE.bom.map(function(item){
    return '<div class="r-brow">'
      +'<span class="r-bitem">'+item.i+'</span>'
      +'<span class="r-bqty" data-bi="'+item.i+'">'+_qty(item.v*fac, item.u, item.p)+'</span>'
      +'</div>';
  }).join('');

  /* Sub-recipe rows */
  var subRows = RECIPE.sub_bom.map(function(item){
    return '<div class="r-brow">'
      +'<span class="r-bitem">'+item.i+'</span>'
      +'<span class="r-bqty" data-si="'+item.i+'">'+_qty(item.v*fac, item.u, item.p)+'</span>'
      +'</div>';
  }).join('');

function pageRecipeAfter(){
  var ws = document.getElementById('workspace');
  if(!ws) return;

  var numEl   = ws.querySelector('#r-driver-num');
  var inputEl = ws.querySelector('#r-driver-input');
  var hintEl  = ws.querySelector('#r-driver-hint');

  function _commit(){
    var raw = parseFloat(inputEl.value);
    if(raw && raw > 0){
      _driverQty = Math.round(raw * 10) / 10;
    }
    /* Swap back to display */
    inputEl.style.display = 'none';
    numEl.textContent = _driverQty;
    numEl.style.display = '';
    numEl.classList.remove('editing');
    if(hintEl) hintEl.classList.remove('visible');
    _updateBOM();
  }

  function _startEdit(){
    numEl.style.display = 'none';
    inputEl.style.display = '';
    inputEl.classList.add('editing');
    if(hintEl) hintEl.classList.add('visible');
    inputEl.value = _driverQty;
    inputEl.focus();
    inputEl.select();
  }

  /* Tap number → edit */
  if(numEl) numEl.addEventListener('click', _startEdit);

  /* Live update while typing */
  if(inputEl){
    inputEl.addEventListener('input', function(){
      var raw = parseFloat(inputEl.value);
      if(raw && raw > 0){
        _driverQty = Math.round(raw * 10) / 10;
        _updateBOM();
      }
    });
    /* Enter or blur → commit */
    inputEl.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); _commit(); }
      if(e.key === 'Escape'){ inputEl.value = _driverQty; _commit(); }
    });
    inputEl.addEventListener('blur', _commit);
  }

  /* Sub-recipe toggle */
  var subToggle = ws.querySelector('#r-sub-toggle');
  var subBody   = ws.querySelector('#r-sub-body');
  if(subToggle && subBody){
    subToggle.addEventListener('click', function(){
      subToggle.classList.toggle('open');
      subBody.classList.toggle('open');
    });
  }
}

function jGroupedHTML(entries){

    return '<div class="j-empty">'
      +'<div class="j-empty-ico">📓</div>'

      +'<p style="font-size:12px;margin-top:4px">'+t('jempty_sub')+'</p>'
      +'</div>';
  }
  var today=[], yest=[], older=[];
  entries.forEach(function(e){
    if(e.date==='today')      today.push(e);
    else if(e.date==='yesterday') yest.push(e);
    else                      older.push(e);
  });
  function section(lbl, list){
    if(!list.length) return '';
    return '<div class="j-day-hd">'
      + '<span class="j-day-lbl">'+lbl+'</span>'
      + '<span class="j-day-count">'+list.length+'</span>'

      + '</div>'
      + list.map(jEntryHTML).join('');
  }
  return section(t('jtoday'),today)
       + section(t('jyest'),yest)
       + section(t('jolder'),older);
}

function journalAfterRender(){
  var ws=document.getElementById('workspace');

  /* category filter chips — event delegation */
  ws.addEventListener('click', function jcat_handler(ev){
    var chip=ev.target.closest('[data-jf-cat]');
    if(!chip) return;
    J_FILTER_CAT=chip.dataset.jfCat;
    /* update chip active state */
    ws.querySelectorAll('[data-jf-cat]').forEach(function(c){
      c.classList.toggle('on', c.dataset.jfCat===J_FILTER_CAT);
    });
    /* re-render entries only */
    var el=document.getElementById('j-entries');
    if(el) el.innerHTML=jGroupedHTML(jFilteredEntries());
    ws._j_chip_handler=jcat_handler; /* store ref for cleanup */
  },false);

  /* vis filter */
  var vsel=ws.querySelector('#j-vis-filter');
  if(vsel) vsel.addEventListener('change',function(){
    J_FILTER_VIS=vsel.value;
    var el=document.getElementById('j-entries');
    if(el) el.innerHTML=jGroupedHTML(jFilteredEntries());
  });

  /* add button */
  var addBtn=ws.querySelector('#j-add-btn');
  if(addBtn) addBtn.addEventListener('click', function(){
    J_SHOW_FORM=!J_SHOW_FORM;
    var fw=document.getElementById('j-form-wrap');

/* ── New-tab quick-menu ─────────────────────────────────────────────────────
   Shows a small floating menu anchored to the + button.
   Lists pages that are NOT already open as a singleton tab.
   If all pages are already open → activates Home.                           */
function _showNewTabMenu(){
  /* remove any existing menu */
  var old = document.getElementById('ntm-menu');
  if(old){
    var oldBd = document.getElementById('ntm-backdrop');
    if(oldBd) oldBd.remove();
    old.remove();
    return;
  }

  var candidates = [
    {type:'bot_center',   label:t('tb'),       ico:'🤖', p:{}},
    {type:'daily_journal',label:t('tj_short'), ico:'📓', p:{}},
    {type:'pos',          label:t('tp'),        ico:'📊', p:{}},
  ].filter(function(c){
    /* only if NOT already open as a singleton */
    return !TABS.find(function(x){ return x.type===c.type; });
  });

  if(candidates.length===0){
    /* everything is open — just go to Home */
    var homeTab = TABS.find(function(x){ return x.type==='home'; });
    if(homeTab) activateTab(homeTab.id); else openTab('home',{});
    return;
  }

  var btn = document.getElementById('tab-plus');
  if(!btn) return;
  var rect = btn.getBoundingClientRect();

  var menu = document.createElement('div');
  menu.id = 'ntm-menu';
  menu.style.cssText = [
    'position:fixed',
    'left:'+(rect.left)+'px',
    'top:'+(rect.bottom+4)+'px',
    'background:var(--surf)',
    'border:1px solid var(--bd2)',
    'border-radius:var(--r2)',
    'box-shadow:var(--sh2)',
    'z-index:9000',
    'min-width:180px',
    'padding:6px 0',
    'overflow:hidden'
  ].join(';');

  candidates.forEach(function(c){
    var item = document.createElement('button');
    item.style.cssText = [
      'display:flex','align-items:center','gap:10px',
      'width:100%','padding:10px 16px',
      'background:none','border:none',
      'font:15px/1.3 inherit','color:var(--tx)',
      'cursor:pointer','text-align:left',
      '-webkit-tap-highlight-color:transparent'
    ].join(';');
    item.innerHTML = '<span style="font-size:18px">'+c.ico+'</span><span>'+c.label+'</span>';
    item.addEventListener('mouseenter',function(){ item.style.background='var(--bg)'; });
    item.addEventListener('mouseleave',function(){ item.style.background='none'; });
    item.addEventListener('click', function(e){
      e.stopPropagation();
      var bd = document.getElementById('ntm-backdrop');
      if(bd) bd.remove();
      menu.remove();
      openTab(c.type, c.p);
    });
    menu.appendChild(item);
  });

  /* invisible backdrop — cattura tap su tutto il resto della pagina, iOS incluso */
  var backdrop = document.createElement('div');
  backdrop.id = 'ntm-backdrop';
  backdrop.style.cssText = 'position:fixed;inset:0;z-index:8999;-webkit-tap-highlight-color:transparent';
  backdrop.addEventListener('pointerdown', function(e){
    e.preventDefault();
    backdrop.remove();
    menu.remove();
  });
  /* inserisci backdrop PRIMA del menu, così il menu sta sopra */
  document.body.insertBefore(backdrop, document.body.firstChild);
  document.body.appendChild(menu);
}

function renderTabBar(){
  var inner = TABS.map(function(tab){
    var on = tab.id===AID;
    return '<div class="tab'+(on?' on':'')+'" data-tid="'+tab.id+'" role="tab" aria-selected="'+(on?'true':'false')+'">'
      +'<span class="tab-ico">'+(ICO[tab.type]||'📄')+'</span>'
      +'<span class="tab-lbl">'+tab.title+'</span>'
      +(tab.type!=='home'
        ? '<button class="tab-x" data-close="'+tab.id+'" title="Chiudi">✕</button>'
        : '')
      +'</div>';
  }).join('');
  inner += '<button class="tab-plus" id="tab-plus" title="'+t('tnew')+'">+</button>';

  var tbEl=document.getElementById('tabbar');
  tbEl.innerHTML='<div class="tb-inner" id="tb-inner">'+inner+'</div>';

  /* Wire via event delegation — avoids onclick= attribute encoding issues */
  document.getElementById('tb-inner').addEventListener('click', function(e){
    /* close button */
    var closeBtn=e.target.closest('[data-close]');
    if(closeBtn){ e.stopPropagation(); closeTab(closeBtn.dataset.close); return; }
    /* new tab */
    if(e.target.closest('#tab-plus')){ _showNewTabMenu(); return; }
    /* activate tab */
    var tabEl=e.target.closest('[data-tid]');
    if(tabEl) activateTab(tabEl.dataset.tid);
  });

  /* scroll active into view */
  requestAnimationFrame(function(){
    var el=document.querySelector('.tab.on');
    if(el) el.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'});
  });
}

function renderWorkspace(){
  /* guard: if AID is stale or null but tabs exist, recover */
  if((!AID || !TABS.find(function(x){ return x.id===AID; })) && TABS.length>0){
    AID = TABS[0].id;
    _persist();
  }
  var tab=TABS.find(function(x){ return x.id===AID; });
  var ws=document.getElementById('workspace');
  if(!tab){ ws.innerHTML='<div style="padding:60px;text-align:center;color:var(--txm)">—</div>'; return; }
  var page=PAGES[tab.type];
  ws.innerHTML = page ? page.render(tab.params||{}) : '<p style="padding:40px;color:var(--txm)">Pagina non trovata.</p>';
  /* restore scroll */
  ws.scrollTop = tab.scroll || 0;
  /* save scroll on scroll */
  ws.onscroll = function(){
    var cur=TABS.find(function(x){ return x.id===AID; });
    if(cur) cur.scroll=ws.scrollTop;
  };
  /* after-render hooks */
  if(page && page.after) page.after();
  /* dev validator */
  setTimeout(function(){ validatePage(tab.type); }, 200);
}

function renderAll(){
  renderTopBar();
  renderTabBar();
  renderWorkspace();
}

/* ══ CHEF AI DRAWER ════════════════════════════════════════════════════════ */
var CAI_OPEN = false;
var CAI_HISTORY = [];

/* Context per tab type — in futuro leggerà la tab attiva */
function caiContext(){
  var tab = TABS.find(function(x){ return x.id===AID; });
  if(!tab) return t('cai_ctx_home');
  var ctx = {
    home:          t('cai_ctx_home'),
    bot_center:    t('cai_ctx_bots'),
    recipe:        t('cai_ctx_recipe') + (tab.params&&tab.params.name?' — '+tab.params.name:''),
    inventory:     t('cai_ctx_inv')    + (tab.params&&tab.params.name?' — '+tab.params.name:''),
    daily_journal: t('cai_ctx_journal'),
    pos:           t('tp')+' · '+t('tpsub')
  };
  return ctx[tab.type] || tab.title;
}

function toggleChefAI(){
  if(CAI_OPEN) closeChefAI(); else openChefAI();
}

function openChefAI(){
  CAI_OPEN=true;
  var ov=document.getElementById('cai-overlay');
  ov.classList.add('open');
  /* update context */
  var ctx=caiContext();
  var ctxEl=document.getElementById('cai-ctx');
  if(ctxEl) ctxEl.textContent=t('cai_ctx_prefix')+ctx;
  /* update topbar button */
  var btn=document.getElementById('cai-topbar-btn');
  if(btn) btn.classList.add('active');
  /* init body if empty */
  var body=document.getElementById('cai-body');
  if(body && CAI_HISTORY.length===0){
    caiAddMsg('ai', t('cai_greeting'));
    /* suggestions */
    var sugs=t('cai_suggestions').split('|');
    var sugHTML='<div class="cai-suggestions">'
      +sugs.map(function(s){return '<button class="sug">'+s.trim()+'</button>';}).join('')
      +'</div>';
    body.insertAdjacentHTML('beforeend', sugHTML);
    body.querySelectorAll('.sug').forEach(function(b){
      b.addEventListener('click',function(){
        caiSend(b.textContent.trim());
        b.closest('.cai-suggestions')?.remove();
      });
    });
  }
  /* wire close */
  document.getElementById('cai-close-btn').onclick=closeChefAI;
  document.getElementById('cai-backdrop').onclick=closeChefAI;
  /* wire send */
  var inp=document.getElementById('cai-input');
  var snd=document.getElementById('cai-send-btn');
  if(inp){
    inp.placeholder=t('cai_placeholder');
    inp.onkeydown=function(e){
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();caiSendFromInput();}
    };
  }
  if(snd) snd.onclick=caiSendFromInput;
  /* focus input */
  setTimeout(function(){ document.getElementById('cai-input')?.focus(); }, 300);
}

function closeChefAI(){
  CAI_OPEN=false;
  document.getElementById('cai-overlay').classList.remove('open');
  var btn=document.getElementById('cai-topbar-btn');
  if(btn) btn.classList.remove('active');
}

function caiAddMsg(role, text){
  var body=document.getElementById('cai-body');
  if(!body) return;
  CAI_HISTORY.push({role:role,text:text});
  var isAI=(role==='ai');
  var html='<div class="cai-msg'+(isAI?'':' usr')+'">'
    +(isAI?'<div class="cai-msg-av">🤖</div>':'')
    +'<div class="cai-bubble">'+text.replace(/\n/g,'<br>')+'</div>'
    +(isAI?'':'<div class="cai-msg-av" style="background:var(--b6)">'+RINIT[ROLE]+'</div>')
    +'</div>';
  body.insertAdjacentHTML('beforeend', html);
  body.scrollTop=body.scrollHeight;
}

function caiSendFromInput(){
  var inp=document.getElementById('cai-input');
  if(!inp) return;
  var msg=(inp.value||'').trim();
  if(!msg) return;
  inp.value='';
  caiSend(msg);
}

/* Demo responses — no real AI in prototype */
var CAI_DEMO_REPLIES = null;
function caiGetDemoReply(q){
  if(!CAI_DEMO_REPLIES){
    CAI_DEMO_REPLIES = [
      t('cai_r1'), t('cai_r2'), t('cai_r3'), t('cai_r4')
    ];
  }
  /* simple keyword matching */
  q=q.toLowerCase();
  if(q.indexOf('bot')>=0||q.indexOf('pipeline')>=0) return t('cai_r_bots');
  if(q.indexOf('journal')>=0||q.indexOf('diario')>=0) return t('cai_r_journal');
  if(q.indexOf('tiramisu')>=0||q.indexOf('ricett')>=0||q.indexOf('recipe')>=0) return t('cai_r_recipe');
  if(q.indexOf('caesar')>=0||q.indexOf('dispensa')>=0||q.indexOf('pantry')>=0) return t('cai_r_inv');
  /* default cycle */
  var i=CAI_HISTORY.filter(function(m){return m.role==='user';}).length;
  return CAI_DEMO_REPLIES[i % CAI_DEMO_REPLIES.length];
}

function caiSend(msg){
  caiAddMsg('user', msg);
  /* typing indicator */
  var body=document.getElementById('cai-body');
  var typing=document.createElement('div');
  typing.className='cai-msg'; typing.id='cai-typing';
  typing.innerHTML='<div class="cai-msg-av">🤖</div>'
    +'<div class="cai-bubble" style="opacity:.6">'+t('cai_thinking')+'</div>';
  body.appendChild(typing); body.scrollTop=body.scrollHeight;
  /* simulate response */
  setTimeout(function(){
    typing.remove();
    caiAddMsg('ai', caiGetDemoReply(msg));
  }, 900 + Math.random()*600);
}


/* ══ PAGE STANDARD VALIDATOR (dev only — harmless in prod) ══════════════════
   Runs in console after each renderWorkspace().
   Reports: missing i18n keys, hardcoded labels, missing context.
   ════════════════════════════════════════════════════════════════════════ */
function validatePage(type){
  var issues=[];
  var ws=document.getElementById('workspace');
  if(!ws) return;

  /* 1. Check for hardcoded text in visible elements (heuristic) */
  var textEls=ws.querySelectorAll('h1,h2,h3,h4,p,button,label,span,option');
  var suspectPatterns=[
    /^[A-Z][a-z]+ [a-z]+ [a-z]+$/, /* English sentence fragments */
    /Tiramisu|Caesar|Hardie/,        /* data is OK, UI labels should be t() */
  ];
  /* We skip data-derived text by only checking elements with no data-cat, data-tid etc */
  /* This is a lightweight heuristic, not exhaustive */

  /* 2. Check caiContext covers this page type */
  var knownCtx=['home','bot_center','recipe','inventory','daily_journal','pos'];
  if(type && knownCtx.indexOf(type)<0){
    issues.push('⚠️  Page type "'+type+'" not registered in caiContext() — add it');
  }

  /* 3. Check TR keys exist in all 3 langs for this page's namespace */
  var ns=type?type.replace('_',''):null;
  if(ns && ns!=='home'){
    var langs=['it','en','es'];
    var missing=[];
    langs.forEach(function(l){
      if(!TR[l]) missing.push(l);
    });
    if(missing.length) issues.push('⚠️  TR missing language blocks: '+missing.join(', '));
  }

  /* 4. Check no inline styles with hardcoded colors in the rendered HTML */
  var html=ws.innerHTML;
  var hexInStyle=html.match(/style="[^"]*#[0-9a-f]{3,6}/gi);
  if(hexInStyle && hexInStyle.length>3){ /* allow a few for dynamic avatar colors */
    issues.push('⚠️  Possible hardcoded hex colors in rendered HTML ('+hexInStyle.length+' found) — use var(--token)');
  }

  /* 5. Check no onclick= attributes on newly rendered elements */
  var onclickEls=ws.querySelectorAll('[onclick]');
  if(onclickEls.length>0){
    issues.push('❌ VIOLATION: '+onclickEls.length+' element(s) with onclick= attribute — use addEventListener');
  }

  /* 6. Check responsive: at least one element with responsive class or section */
  /* (heuristic — just check pi wrapper exists) */
  if(!ws.querySelector('.pi')){
    issues.push('⚠️  Page does not use .pi wrapper — may not be responsive');
  }

  if(issues.length===0){
    console.log('%c✅ Brigade Page Standard — '+type+' — all checks passed','color:#16a34a;font-weight:700');
  } else {
    console.group('%c🔍 Brigade Page Standard — '+type+' — '+issues.length+' issue(s)','color:#d97706;font-weight:700');
    issues.forEach(function(i){ console.warn(i); });
    console.log('Reference: workspace/WORKSPACE_PAGE_STANDARD.md');
    console.groupEnd();
  }
}


/* ══ GLOBAL SEARCH ════════════════════════════════════════════════════════ */
var _searchIdx = null;

function buildSearchIndex(){
  return [
    {tabType:'bot_center',    params:{},
     ico:'🤖', title:t('tb'),   sub:t('bsub'),
     kw:['bot','pipeline','deduction','bots','centro bot','bot center','modifier','consolidator']},
    {tabType:'daily_journal', params:{},
     ico:'📓', title:t('jtit'), sub:t('jsub'),
     kw:['journal','diario','log','diario operativo','operations journal','maintenance','servizio','service']},
    {tabType:'recipe',        params:{id:'tiramisu',name:'Tiramisu'},
     ico:'📋', title:t('tr',{n:'Tiramisu'}), sub:'Pastry · 10 pz',
     kw:['tiramisu','dessert','pastry','mascarpone','ricetta','recipe','receta','savoiardi']},
    {tabType:'inventory',     params:{id:'caesar',name:'Caesar Dressing'},
     ico:'📦', title:t('ti',{n:'Caesar Dressing'}), sub:'Stock: 2.4 kg · 312 uses/60gg',
     kw:['caesar','dressing','dispensa','pantry','despensa','salad','insalata']},
    {tabType:'pos',           params:{},
     ico:'📊', title:t('tp')||'Vendite', sub:t('bsub')||'Sales dashboard · modifier depletion',
     kw:['vendite','sales','pos','revenue','dashboard','modifier','depletion','modifiers','modifer','cassa','incasso']},
  ];
}

function scoreResult(entry, q){
  q = q.toLowerCase().trim();
  var score = 0;
  entry.kw.forEach(function(k){
    k = k.toLowerCase();
    if(k === q)          score += 100;
    else if(k.startsWith(q)) score += 60;
    else if(k.indexOf(q) >= 0) score += 30;
  });
  var title = entry.title.toLowerCase();
  if(title === q)          score += 80;
  else if(title.startsWith(q)) score += 50;
  else if(title.indexOf(q) >= 0) score += 20;
  return score;
}

function wireSearch(){
  var wrap  = document.getElementById('t-search-wrap');
  var input = document.getElementById('t-search-input');
  var clear = document.getElementById('t-search-clear');
  var drop  = document.getElementById('search-drop');
  if(!wrap || !input || !drop) return;

  _searchIdx = null; /* rebuild on lang change */

  input.addEventListener('focus', function(){ wrap.classList.add('focused'); });

  input.addEventListener('blur', function(){
    setTimeout(function(){ wrap.classList.remove('focused'); hideDrop(); }, 200);
  });

  input.addEventListener('input', function(){
    var q = input.value.trim();
    clear.classList.toggle('vis', q.length > 0);
    if(!q){ hideDrop(); return; }
    showDrop(q);
  });

  input.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      input.value = ''; clear.classList.remove('vis');
      hideDrop(); input.blur();
    }
    if(e.key === 'Enter'){
      var first = drop.querySelector('.search-result');
      if(first) first.click();
    }
  });

  clear.addEventListener('mousedown', function(e){ e.preventDefault(); });
  clear.addEventListener('click', function(){
    input.value = ''; clear.classList.remove('vis'); hideDrop(); input.focus();
  });
}

function showDrop(q){
  if(!_searchIdx) _searchIdx = buildSearchIndex();
  var drop = document.getElementById('search-drop');
  if(!drop) return;

  var seen = {};
  var results = _searchIdx
    .map(function(e){ return {e:e, s:scoreResult(e,q)}; })
    .filter(function(r){ return r.s > 0; })
    .sort(function(a,b){ return b.s - a.s; })
    .filter(function(r){
      var key = r.e.tabType + ':' + (r.e.params.id || '');
      if(seen[key]) return false; seen[key] = true; return true;
    })
    .slice(0, 5);

  if(!results.length){
    drop.innerHTML = '<div class="search-empty">'+t('srch_noResults',{q:q})+'</div>';
    drop.classList.remove('hi'); return;
  }

  drop.innerHTML = results.map(function(r){
    var e = r.e;
    var ps = encodeURIComponent(JSON.stringify(e.params));
    return '<div class="search-result" data-tt="'+e.tabType+'" data-ps="'+ps+'">'
      +'<span class="sr-ico">'+e.ico+'</span>'
      +'<div class="sr-body">'
      +'<div class="sr-title">'+e.title+'</div>'
      +'<div class="sr-sub">'+e.sub+'</div>'
      +'</div>'
      +'<span class="sr-action">'+t('srch_open')+' →</span>'
      +'</div>';
  }).join('');

  drop.querySelectorAll('.search-result').forEach(function(el){
    el.addEventListener('mousedown', function(e){ e.preventDefault(); });
    el.addEventListener('click', function(){
      var tt = el.dataset.tt;
      var ps = JSON.parse(decodeURIComponent(el.dataset.ps||'{}'));
      var inp = document.getElementById('t-search-input');
      if(inp){ inp.value=''; document.getElementById('t-search-clear')?.classList.remove('vis'); }
      hideDrop();
      openTab(tt, ps);
    });
  });

  drop.classList.remove('hi');
}

function hideDrop(){
  var drop = document.getElementById('search-drop');
  if(drop) drop.classList.add('hi');
}

document.addEventListener('DOMContentLoaded', function(){
  LANG = sessionStorage.getItem('ws_lang') || 'it';
  ROLE = sessionStorage.getItem('ws_role') || 'executive';
  _restoreTabs();
  if(TABS.length===0){
    openTab('home', {});
  } else {
    /* ensure AID is valid before first render */
    if(!AID || !TABS.find(function(x){ return x.id===AID; })){
      AID = TABS[0].id;
    }
    renderAll();
  }
});
